    status: proposed
    human_decision_needed: false

edges:
  # lineage: done nodes feed the proposed rule-17-adjacent work
  - {from: eng.lit-manifest-fail-closed, to: kernel.rule17-source-first, kind: requires}
  - {from: kernel.rule17-source-first, to: kernel.gate-rules-taxonomy-i-z, kind: informs}
  - {from: kernel.rule17-source-first, to: docs.blackbox-log-formalize-source, kind: informs}
  - {from: eng.registry-check-ci-safe, to: schema.prereg-gate-fields, kind: informs}

  # pillars must land before citation-only additions that assume its vocabulary
  - {from: foundation.pillars-readout-not-truth, to: foundation.non-collapse-table-expand, kind: requires}
  - {from: foundation.pillars-readout-not-truth, to: foundation.responsibility-arrow-mother-eq, kind: requires}
  - {from: foundation.honest-edges-agrippa, to: foundation.pillars-readout-not-truth, kind: informs}
  - {from: foundation.s1.0-infinity-tension-flag, to: foundation.pillars-readout-not-truth, kind: conflicts}
  - {from: foundation.s1.0-ashari-ontology-analogue, to: foundation.pillars-readout-not-truth, kind: informs}

  # non-collapse table -> schema field -> downstream citation chain
