# glosa v0.3 — S3 improvement DAG
# Readout, not truth: every node below is a proposed readout of what the S1 harvest (324 cards,
# knowledge/harvest_v0.3/KNOWLEDGE_STATUS_v0.3.md) and the S2 literature review
# (records/lit/glosa-v0-3/DIGEST.md) already say, plus the WARN items closed in CHANGELOG 0.2.0
# / design/TODO_v0.3.md and the reviews/PUBLISH_GATE_v1_public.md findings. Nothing here is a
# decision; every `proposed` node needs the internal command-center's DECISIONS ledger (private) before S6 build.
# No novelty words used (no "first"/"best"/"novel"/"outperform").

nodes:
  # --- already done (v0.2 self-application lineage; carried forward for DAG lineage only) ---
  - id: eng.registry-check-ci-safe
    title: Registry check made CI-safe
    change: >
      Registry self-report state-machine check (rule blocking method→released without a
      literature-review manifest) runs in CI, not only at release time, so a stage-skip
      (e.g. D-LIT-MODE) is caught before merge, not after tagging.
    kind: process
    target: kernel/glosa_kernel.py (validate_release_manifest) + CI workflow
    evidence: [kc-ep-051]
    acceptance_test: "CI job fails a PR that advances registry stage past genre_routed without a PASS lit manifest."
    risk: Low — mechanical CI gate, already exercised by v0.1.0→v0.2.0 self-report gap it was built to catch.
    status: done
    human_decision_needed: false

  - id: eng.lit-manifest-fail-closed
    title: Literature-review manifest fails closed
    change: >
      A literature-review manifest with any non-conformant citation card (missing locator,
      wrong status) fails the whole manifest rather than silently dropping the bad card.
    kind: kernel
    target: kernel/glosa_kernel.py (validate_citation_card, validate_release_manifest)
    evidence: [kc-base-039, kc-ep-046]
    acceptance_test: "Unit test: manifest with one card missing a locator field returns overall FAIL, not PASS-with-warning."
    risk: Low — already the shipped v0.2.0 behavior; carried here only to show DAG lineage into S3/S4.
    status: done
    human_decision_needed: false

  - id: kernel.rule17-source-first
    title: Rule 17 — source-first citation
    change: >
      A citation card cannot leave CANDIDATE status unless quote/page/line/link fields were
      filled from the opened source at read-time, never reconstructed from memory afterward.
    kind: kernel
    target: kernel/glosa_kernel.py rule17 / rule17w (validate_citation_card)
    evidence: [kc-base-039, kc-ai-019, kc-ep-046]
    acceptance_test: "Unit test: card with status VERIFIED but empty verbatim/locator field raises rule17 error, not rule17w warning."
    risk: Low — shipped 0.2.0; this DAG's own S1/S2 harvest cards were produced under this rule.
    status: done
    human_decision_needed: false

  # --- DIGEST "Implications for the v0.3 DAG" table (records/lit/glosa-v0-3/DIGEST.md) ---
  - id: kernel.pcs-red-flag
    title: Premature Category Stabilization (PCS) as a scoped kernel red-flag
    change: >
      Add PCS to the contaminated-concept/red-flag table, but only when BOTH closure-timing
      AND absence-of-adaptation/contextual-fit hold jointly; explicitly not merged with the
      clinical term "premature closure."
    kind: kernel
    target: FOUNDATION §5/§6 disclaimer+genre-router; kernel contaminated-concept table (base-018)
    evidence: [kc-ep-018, kc-ep-019, kc-ep-020, kc-islam-011, kc-tourism-002]
    acceptance_test: >
      finite_diagnostic sim: run N synthetic claim cards with (a) timing-only closure,
      (b) timing+no-adaptation, (c) neither — kernel flags only class (b); precision on
      class (b) must be 100% on the synthetic set before this ships.
    risk: Medium — real cross-domain support, but two independent counter-cases (decoupled closure, successful non-premature adoption) risk over-generalization if scoping is dropped.
    status: decided
    human_decision_needed: false
    decision: "YES, narrow definition (rule 24) -- founder, delegated (\"ทำให้เลย\", BBL-2026-09-05-122); DECISIONS.md 2026-09-05 row. Text landed FOUNDATION_v0.6.md §5 (ex-PENDING FOUNDER block) + §3.3 rule 24. Built in kernel/glosa_kernel.py the same day (rule24/rule24w, fail fixture + Rule24PCSTest); still needs the out-of-lexicon holdout + independent adversarial review named in design/FOUNDATION_v0.6_PATCH.md §6 before it may ship."

  - id: rule17.claim-card-certification-open
    title: "Claim card replaces institutional certification: kept [Open]"
    change: >
      Do NOT formalize "claim card substitutes for institutional certification" into kernel
      rule 17 or the I0–I5 ladder this pass; keep it logged [Open] pending a falsifier that
      tests claim cards directly (not badges/Registered Reports by analogy).
    kind: kernel
    target: kernel rule 17 / FOUNDATION §4.2 Independence Ladder I0–I5
    evidence: [kc-ai-006, kc-aihp-002, kc-aihp-003]
    acceptance_test: "design/TODO_v0.3.md carries an explicit [Open] line with the falsifier condition; no kernel diff lands for this claim in v0.3."
    risk: Low (no change made) — flagged risk is silent drift if this stays unaddressed across future minor versions without a scoped falsifier ever getting written.
    status: deferred
    human_decision_needed: false

  - id: foundation.s5-scope-boundary-per-instance
    title: Non-clinical/non-medical/non-legal scope clause stays per-instance
    change: >
      Do not standardize one reusable disclaimer text across all AI-runtime instances;
      require each instance to pair its disclaimer with an explicit context/jurisdiction
      check (time-criticality, deployment jurisdiction, legal-category availability).
    kind: foundation
    target: FOUNDATION §5 Systematic disclaimer catalogue
    evidence: [kc-ai-023, kc-he-016]
    acceptance_test: "FOUNDATION §5 diff reviewed: every disclaimer entry carries a jurisdiction/time-criticality field, not just boilerplate text."
    risk: Medium — the evidence largely defeats a single standardized clause; risk is per-instance variation becoming unmanaged per-hub duplication.
    status: decided
    human_decision_needed: false
    decision: "Per-instance clause + explicit context/jurisdiction check, no boilerplate -- founder, delegated (\"ทำให้เลย\", BBL-2026-09-05-122); DECISIONS.md 2026-09-05 row. Text landed FOUNDATION_v0.6.md §5 (ex-PENDING FOUNDER block). Named risk (unmanaged per-hub duplication) tracked, not solved, per the decided text itself."

  - id: foundation.s7.9-intake-tier-flag
    title: Claim-tier intake flag — thin addition, not a new mechanism
    change: >
      Add a flag-and-request-tier step only as a thin layer on the existing AACODS-style
      checklist (trace-to-original + appraise); explicitly exempt Global South
      anecdotal/expert/local-knowledge evidence genres from being treated as automatically
      suspect.
    kind: foundation
    target: FOUNDATION §7.9 Literature Review System (LRS)
    evidence: [kc-ai-024, kc-he-018]
    acceptance_test: "LRS run on a policy-brief-only source set produces a flagged-not-blocked intake row, distinct from a rejected row."
    risk: Medium — real gap exists, but the mechanism as posed risks duplicating existing checklist machinery or over-policing legitimate non-graded evidence.
    status: decided
    human_decision_needed: false
    decision: "Thin flag on the existing AACODS-style checklist (rule 22), Global South exemption kept -- founder, delegated (\"ทำให้เลย\", BBL-2026-09-05-122); DECISIONS.md 2026-09-05 row. Text landed FOUNDATION_v0.6.md §7.9 (ex-PENDING FOUNDER block) + §3.3 rule 22. Sim caveat carried forward: the measured delta was produced by a different (defect-detector) proxy, not this mechanism -- acceptance test must be re-run on fixtures built for the actual AACODS layer before ship."

  - id: schema.prereg-gate-fields
    title: Frozen-preregistration gate as checkable fields, not a hard block
    change: >
      Add protocol_frozen_at, ethics_approved_at (nullable/NOT_APPLICABLE for non-human-subjects
      work), and a separate registry-administrative-approval timestamp; violations are flagged,
      not blocked; a passed sequencing check is never read as ethics-substance verification.
    kind: schema
    target: FOUNDATION §2.1a Problem before observation / §7.3 Bounded-Judge Law
    evidence: [kc-he-002, kc-he-004, kc-he-005, kc-he-006, kc-he-007]
    acceptance_test: "Schema validator accepts a card with ethics_approved_at=NOT_APPLICABLE for a non-human-subjects claim and flags (not rejects) an out-of-sequence pair."
    risk: High if implemented as a hard universal block — real registries do not hard-block this way; a naive implementation would misdescribe practice and could block legitimate research.
    status: dropped
    human_decision_needed: false
    decision: "Dropped -- founder, delegated (\"ทำให้เลย\", BBL-2026-09-05-122); DECISIONS.md 2026-09-05 row. Sim reason (design/FOUNDATION_v0.6_PATCH.md §8): delta_recall/delta_false_alarm both 0.0 -- the corpus has zero fixtures carrying prereg timestamp/ethics-applicability sequencing at all, so no defect was demonstrated to exist for this node to catch (Fail-Able Gate Law, BBL-119 -- no failing control, no gate). The separate prereg-gate-hard-vs-soft question this node names stays open, independent of this drop."

  - id: kernel.unverified-verifiability-flag
    title: "\"Verifiable with no stated procedure\" as a named narrow sub-case"
    change: >
      Nest "claims verifiable/checkable with no stated procedure" under the existing
      vague-attribution disclaimer-catalogue entry as a named narrower sub-case; do not make
      it a purely mechanical/keyword-triggered check (intent-dependence defeats pure automation).
    kind: kernel
    target: FOUNDATION §5 disclaimer catalogue / kernel rule 17
    evidence: [kc-tourism-006]
    acceptance_test: "finite_diagnostic sim: a hand-labeled set of 'verifiable'-claim sentences with/without a stated procedure — flag routes to human review, never auto-rejects."
    risk: Low-medium — well-supported as a narrow addition; main risk is over-automating detection given intent-dependence.
    status: proposed
    human_decision_needed: false

  - id: foundation.s1.0-infinity-tension-flag
    title: Infinity-as-transcendental-ground stays a flagged [Open] tension
    change: >
      Keep infinity-as-transcendental-ground logged as an explicitly flagged [Open] tension
      in FOUNDATION §1.0 rather than building a formal reconciliation section this pass; the
      flag must note the stance's historical load-bearing role and cross-cultural diffusion.
    kind: foundation
    target: FOUNDATION §1.0 Pillars
    evidence: [kc-ep-005]
    acceptance_test: "FOUNDATION §1.0 contains an [Open] block naming the rival stance and citing its historical-priority sources, not a silent omission."
    risk: Medium — defensible default, but two strong historical-priority sources mean a future version may need to revisit rather than leave permanently deferred.
    status: deferred
    human_decision_needed: false

  - id: foundation.s1.0-ashari-ontology-analogue
    title: Partial theology-neutral ontology analogue (2 of 3 constructs)
    change: >
      Adopt a theology-neutral structural analogue for "Dependent Identity" (grounding/
      ontological-dependence theory) and "Directed Selection" (Principle of Sufficient
      Reason) as FOUNDATION §1.0 ontology primitives; do NOT attempt the same move for
      "Dependent Order"/kasb or the five registers of faqr as a whole — those stay islam-domain.
    kind: foundation
    target: FOUNDATION §1.0 Pillars — ontology
    evidence: [kc-ep-030, kc-ep-034]
    acceptance_test: "FOUNDATION §1.0 diff cites grounding-theory and PSR sources directly, with an explicit line excluding kasb/faqr from the analogue."
    risk: Medium — partial adoption is defensible from the evidence but risks looking arbitrary without the full reasoning carried into the commit message.
    status: decided
    human_decision_needed: false
    decision: "2 of 3 constructs adopted as theology-neutral structural analogues, labelled and cited (kc-ep-030, kc-ep-034); kasb / the five registers of faqr are NOT given analogues -- founder, delegated (\"ทำให้เลย\", BBL-2026-09-05-122); DECISIONS.md 2026-09-05 row. Text landed FOUNDATION_v0.6.md §1.0 (ex-PENDING FOUNDER block), exclusion reasoning stated inline rather than only in a commit message per the DAG's own arbitrariness-risk note."

  # --- clusters drawn from KNOWLEDGE_STATUS_v0.3.md §4 Adopt/Adapt candidates ---
  - id: foundation.pillars-readout-not-truth
    title: Pillars §1.0 cross-tradition citation set
