    target: FOUNDATION §3.2b / §7 Gates & review (AI-authorship rules)
    evidence: [kc-ep-043, kc-ai-003, kc-ai-004, kc-aihp-013, kc-aihp-014]
    acceptance_test: "§3.2b/§7 diff cites the named source papers alongside the existing rule-17 provenance-only-channel text."
    risk: Low-medium — citation-only, but touches AI-authorship rules directly tied to CHANGELOG 0.2.0 gate rule 9 (no AI attribution without permission); requires foundation.ead-crosswalk land first.
    status: proposed
    human_decision_needed: false

  - id: foundation.independence-ladder-i0-i5-source
    title: I0–I5 Independence Ladder named source citation
    change: >
      Cite "Rigour Without Infrastructure" directly as the named source of the I0–I5
      Independence Ladder and the falsifiable-propositions framing already used in §4.2.
    kind: foundation
    target: FOUNDATION §4.2 Independence Ladder I0–I5
    evidence: [kc-ep-052, kc-ai-002]
    acceptance_test: "§4.2 diff adds the named citation without renumbering or redefining the existing I0–I5 classes."
