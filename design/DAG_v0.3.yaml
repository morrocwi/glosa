    acceptance_test: "§3.1 diff adds a citation line naming the E-A-D source papers directly above the crosswalk table."
    risk: Low — citation-only; requires schema.verdict-class-vocabulary land first for consistent field naming.
    status: proposed
    human_decision_needed: false

  - id: foundation.possession-constitution-collapse
    title: Possession-Constitution Collapse / knower-fetishism as the named AI-authorship rule source
    change: >
