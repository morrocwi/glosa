    kind: foundation
    target: FOUNDATION §7.9 Literature Review System (LRS) / §6 discovery extension
    evidence: [kc-ep-045, kc-ep-046, kc-ep-048, kc-ep-049, kc-aihp-005, kc-aihp-006, kc-aihp-010, kc-aihp-020]
