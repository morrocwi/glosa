    kind: foundation
    target: FOUNDATION §12 Honest edges
    evidence: [kc-base-025, kc-base-031, kc-base-036]
    acceptance_test: "§12 diff adds a named subsection citing Agrippa's trilemma with the three evidence card ids as sources."
    risk: Low — citation-only addition to an already-existing honest-edges section.
    status: proposed
    human_decision_needed: false

  - id: schema.verdict-class-vocabulary
    title: Verdict-class vocabulary field (DERIVED/FORCED/DEFINITIONAL-RELABEL/POSITED/BORROWED-SCALE/OPEN)
