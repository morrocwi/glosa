      PRESERVE_EXACT dual-track architecture already used in §4.4.
    kind: foundation
    target: FOUNDATION §4.4 K-state (Standalone Scholar, PRESERVE_EXACT)
    evidence: [kc-ep-041, kc-aihp-017, kc-ai-011]
