    acceptance_test: "§2.1b diff adds the mother-equation citation without altering the existing rule 15/16w wording."
    risk: Low — citation-only; requires foundation.pillars-readout-not-truth for shared vocabulary.
    status: proposed
    human_decision_needed: false

  - id: foundation.honest-edges-agrippa
    title: Agrippa's trilemma applied to the tier system itself
    change: >
      Cite Agrippa's-trilemma-applied-to-the-tier-system and "what this system explicitly does
      NOT claim" cards in §12 Honest edges, as the named philosophical grounding for why the
