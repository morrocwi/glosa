      state which verdict class a derivation belongs to, not only its relation to a base text.
    kind: schema
    target: "FOUNDATION field base_relation (holds|refined_by_later_work|superseded|outdated|open)"
    evidence: [kc-base-038]
    acceptance_test: "JSON schema validates a claim card with verdict_class=FORCED and rejects an unlisted seventh value."
    risk: Low-medium — additive enum field; requires foundation.non-collapse-table-expand to land first so Appendix A rows can reference the new field consistently.
    status: proposed
    human_decision_needed: false

  - id: foundation.ead-crosswalk
    title: Existence-Attribution-Disclosure (E-A-D) norm as the named source of §3.1 crosswalk
