# Blackbox Note (บันทึกกล่องดำ) — raw human voice record + the record of how it was later "cooked"
# Founder-named 2026-09-04 (supersedes "Register Zero / เสียงสด"): the name states a sociology-of-knowledge stance —
# to understand a piece of knowledge you must look at the moment it was made (open the black box), and we keep
# the whole processing of it (การปรุง: lens-in, analysis, lens-out, revisions) in the document forever, never sealed.
# Register labels R0/R1/R2 remain as the internal stage names inside the note. Tier: positional / Dr. Rules: verbatim (typos kept), never edited,
# never polished, never translated in place; translations/readout formulations live in R1/R2 beside it.
# Every claim/rule that grew from a line points back here (claim_card.origin_blackbox_ref). Paper appendix
# "Blackbox Note: how this work was made" is a CURATED subset of these lines (only lines with a `became:`),
# selected by the human owner of the voice; the full record is archived and cited by id.
# Fixed FOUNDATION_v0.5 §12: this header used to name the pre-rename appendix title
# ("Human-AI dialogue before this work"); corrected to match chair ruling A1 and
# paper/BLACKBOX_NOTE_APPENDIX.md's actual title.
blackbox_note:
  id: BB-YYYY-MM-DD-NN            # e.g. BB-2026-09-04-01
  project: <project_id>            # one problem = one project
  session_ref: <transcript id / file path, private allowed>
  participants:
    - role: founder | practitioner | community-member | AI-<vendor>/<model>   # people by ROLE, not name, unless owner opts in
  language: th | en | mixed
  privacy_scan: pending | done      # required before any line goes public
  public_lines_selected_by: <human role>   # AI may propose candidates only (mark ai_proposed: true)
  lines:
    - n: 1
      ts: "2026-09-04T07:20:08Z"    # time received (mid-turn lines) or sent -- quoted: schema types ts as
                                     # string (common ISO-8601 style), and an unquoted YAML timestamp parses
                                     # to a python datetime object instead, which fails that check
      speaker: founder
      kind: question | proposal | correction | ruling | experience | reply
      text_verbatim: |
        <exact words, untranslated, typos kept>
      distinction_introduced: <what this line made visible that was not visible before, one sentence>
      became:                        # forward links (empty = candidate for exclusion from appendix)
        - claim_card: <id>
        - rule: <protocol card / field / gate id>
      public: true | false
      ai_proposed: false
  lens_used:                        # REQUIRED (founder rule 2026-09-04): name the lens that looked at the problem and extracted the hypothesis
    display: "Readout Universe — Yaoharee Lahtee"     # short form used in cards, appendix, front-matter (founder-approved wording)
    description: "readout-not-truth; retained distinction; Readout Condition E–A–D (Readout Universe / Readout Genesis)"
    author: "Yaoharee Lahtee"
    orcid: "0009-0005-3861-0626"
    references:                     # cite what was actually read (citation_card ids once verified)
      - "10.5281/zenodo.21529456"   # Readout Genesis Standalone Synthesis
      - "10.5281/zenodo.21665100"   # What a Zero Readout Certifies
      - "10.5281/zenodo.22301318"   # The Readout Condition (Aug 2026)
      - "10.5281/zenodo.22301202"   # Written by AI. Still True. (pillars)
      - "github.com/morrocwi/readout_universe"
    repo_urls:                      # REQUIRED — always cite the lens's git repo in the document too
      - "https://github.com/morrocwi/readout_universe"
      - "https://github.com/morrocwi/readout_genesis"
    repo_ref: <commit/tag or date read>
    must_appear_in_document: true   # gate: lens citation (DOI) + repo URL must be in the reference list, else D-LENS-UNCITED → FAIL
    version_or_date_read: <YYYY-MM-DD>
    what_it_did_here:
      lens_in: <which distinctions became visible when the problem was read as a readout>
      lens_out: <how the hypothesis was extracted back into world language>
    if_other_lens: "if a different lens was used, write that lens and its author here instead; a work may list more than one"
    note: "attribution ≠ authority — naming the lens credits its source and lets a reader replace it; it does not make the lens true"
  cooking:                          # การปรุง — every transformation of the raw lines, kept forever, append-only
    - step: lens_in | analysis | lens_out | revision | translation | review
      ts: <when>
      by: human | ai-<vendor>/<model> | joint
      input_lines: [1, 3]
      output_ref: <file/claim_card id produced>
      what_changed: "<one sentence — which distinction was added/removed/re-attributed>"
  r1_readout_ref: <file of the lens-in formulation>      # never inline here
  r2_hypothesis_ref: <file of the world-language hypothesis>
  question_trace:                   # OPTIONAL, top-level (schema.blackbox-question-trace, build_now,
                                     # SESSION_ARCH_v0.4_SPEC.md §9.1/§9.4). Real gap this closes:
                                     # question_human/question_readout on a Claim Card are single-shot
                                     # (design/FOUNDATION_v0.6.md:495) -- nothing records how the
                                     # question itself changed turn-to-turn inside ONE note. This is
                                     # NOT grounded in "glosa's own Human Return Test" (no such thing
                                     # exists in glosa's design docs -- that phrase was a
                                     # sources/notes/EPISTEMIC_FUSION_v7.1.txt:467 construct glosa has
                                     # not adopted; the spec's own §9.1 ships this field on the real,
                                     # narrower gap alone). Distinct from `session.question_trace[]`
                                     # above (Problem Card refs opened this session, SA-3 scope).
    - n: 1
      ts: <ISO-8601 ts>
      question_text: <verbatim, as asked this turn>
      derived_from_line: <lines[].n this question grew from, or null>
      note: ""
  # TODO(schema.blackbox-line-origin-enum): build-with-revision -- replaces `lines[].ai_proposed:
  #   boolean` with an enum [human_authored, ai_proposed_pending, ai_proposed_adopted,
  #   ai_proposed_forgotten]; keep the `ai_proposed` alias one migration cycle. Needs its own
  #   revision fix (same-document cooking[]/became[] ordering check) before shipping -- not built
  #   this pass.
  # TODO(schema.blackbox-chooser-reaffirmation): build-with-revision -- `became[].chooser_reaffirmed:
  #   {by, ts}|null` conditional-required sub-field, scope to `^hsel-` ids only until the
  #   cross-file `responsible:human` validator this proposal never designed is specified. Not built
  #   this pass.
  # TODO(kernel.candidate-set-delta-cooking-step): build-with-revision -- `cooking.items[].
  #   candidate_set: {before, after, forgotten}` additive counts. Fixture/tool retarget needed
  #   first (see SESSION_ARCH_v0.4_SPEC.md §9.1). Not built this pass.
  # TODO(schema.blackbox-language-bridge-subfield): still_open -- already refuted
  #   (design/MEETING_2026-09-05_judged.json:84-92, keep:false); do NOT add a `cooking.items[].
  #   bridge_kind` field here without a founder overrule of that standing ruling.
  translation_status: none | machine | reviewed | verified   # for any rendering of these lines elsewhere
  # Session-boundary fields (SA-1, build_now, SESSION_ARCH_v0.4_SPEC.md §2.1/§2.2/§8): the
  # session-boundary + AI-reset fact lives on the Blackbox Note per one-fact-one-home (this is the
  # only artifact that already owns per-line/per-cooking-step sequencing) -- it is NOT a new
  # session.yaml file. FIXED (MUST, ARCH_REVIEW_v0.7.json spec-code-fidelity/one-fact-one-home/
  # fail-closed-and-controls/founder-invariants): these fields are TOP-LEVEL properties of the note
  # (matching schema/blackbox_note.schema.json's actual property definitions and the location
  # kernel/glosa_kernel.py's `check_session_boundary_reset` reads) -- a prior draft of this template
  # nested them under a second-level `session:` wrapper, which made every note `glosa session open`
  # produced invisible to that kernel check. `glosa session open|close` writes these fields.
  session_id: <string>               # citations: sources/notes/EPISTEMIC_FUSION_v7.1.txt:489-490 (F8), :493 (F10)
  session_boundary:
    opened_at: <ISO-8601 ts>
    closed_at: null                  # set only by `glosa session close`
    ai_state_at_boundary: reset      # ALWAYS the literal `reset` (MUST fix, ARCH_REVIEW_v0.7.json
                                      # founder-invariants/source-fidelity) -- v7.1:331 "m^{AI}_
                                      # {s+1,0} = 0 (by architectural scope definition)": the AI's
                                      # own state resets at EVERY boundary, unconditionally. There is
                                      # no second `carried` value -- what the human explicitly
                                      # retains is a separate, distinct fact recorded below on
                                      # `human_retained_residue_ref`, never conflated with this field.
    human_retained_residue_ref: null # what the human explicitly carries forward, if anything; a
                                      # session open either points at the PRIOR note's residue here
                                      # or records "none" -- never left silently blank (boundary
                                      # check §6.4). Schema-nested under `session_boundary`.
  entry_anchor: <ref -> problem_card.problem_id>   # H0 anchor (schema.entry-resistance-precommit-field
                                      # + HU-2, v7.1:344 "H_0 = (P_0, M_0, U_0, E_0, Phi_0)", :351)
  retained_direction_ref: null       # POINTER ONLY, never a duplicate value: the actual
                                      # `unknown | expansion | tunnel` fact lives on
                                      # hypothesis_selection.yaml's own `retained_direction` field
                                      # (§2.2 one-fact-one-home decision; schema.retention-direction-field,
                                      # SA-2, NC-77) -- put the hsel-<slug>-<nnn> id here once that row
                                      # exists for this session, never re-state its value on this note.
  retention_note: null               # human writes, AI never fills. `glosa session close` refuses
                                      # (fail-closed) unless this is a non-empty human-authored string
                                      # at close time -- an AI session may never author this field's
                                      # content on the human's behalf.
  # TODO(SA-3, still_open, not yet built): a `question_trace[]` array of Problem Card refs OPENED
  # during this session (v7.1:353-354 V_0) was proposed as a Session-object field distinct from the
  # top-level per-turn `question_trace[]` above (schema.blackbox-question-trace) -- SA-3 itself is
  # still_open (SESSION_ARCH_v0.4_SPEC.md §3/§9.2: fabricated citation, blocked on session_id), so
  # this second question_trace has no schema field and is NOT scaffolded by `glosa session open`
  # today; do not add it here as a live field until SA-3 actually ships (see P18_session_
  # architecture.md's own Session-object table, which lists it `still_open` for the same reason).
  disclaimers: [D-BLACKBOX-NOTE, D-STANDPOINT]
  # Fixed FOUNDATION_v0.5 §12: dropped D-SELF-EXPERIENCE-NOT-GENERAL-EVIDENCE, an id that did not
  # exist in FOUNDATION §5's master catalogue (the nearest match, NC-64, is a Non-Collapse Table
  # row, not a disclaimer id, and the two vocabularies are never interchangeable). D-STANDPOINT
  # already covers this trigger (a first-person, positional record) and is already mandatory on
  # every claim card this note feeds, so no new id was minted (one-fact-one-home, request 21).
  # D-LENS-UNCITED (FOUNDATION §5/§7.4, request 38c) fires whenever lens_used is present but its
  # citation card is not VERIFIED or repo_urls is not represented in the document's reference list.
