# litreview_manifest.yaml — RWI S14 template (Dr, unreviewed proposed schema)
#
# ONE manifest per LRS run (one lens-out hypothesis, R2, per founder 35b). Frozen at the end of
# the pipeline (S14 §1 stages 1-6): once `status: FROZEN`, this file is never edited in place —
# a correction is a new manifest version with `supersedes` pointing at the old id, matching the
# kg/ledger append-only discipline. GATE: no lit-review section may be drafted or published for
# this hypothesis until `gate.accuracy_gate == PASS` (or `PASS_WITH_LIMITS` with founder sign-off).

id: litrev-<slug>-<nnn>
hypothesis_ref: <claim_id, R2, hypothesis_world>   # the ONE hypothesis this manifest's search frame answers
search_log_ref: search-<slug>-<nnn>                # the frozen search_log.yaml (§2.5 — frozen before screening)
search_log_hash: <sha256 of the frozen search_log.yaml at freeze time>
dialogue_table_ref: <path to dialogue_table.md for this hypothesis>
neighbour_table_ref: <path to neighbour_table.md rows contributed by this run>
status: DRAFTING | FROZEN | SUPERSEDED
frozen_at: null
supersedes: null

# --- per-source ledger: every citation_card this run produced or reused --------------------
citations:
  - citation_card_id: cite-<slug>-<nnn>
    status: <copied from citation_card.status at freeze time>   # must be VERIFIED to count toward gate
    identifier_kind: DOI | PMID | PMCID | ISBN | ARXIV | OFFICIAL_URL | BLACKBOX_NOTE | OTHER_STABLE
    fetch_status: FETCHED | NOT_FETCHED | FETCH_FAILED | PAYWALLED_ABSTRACT_ONLY | UNCHECKED_OFFLINE
    acquisition_log_ref: acq-<slug>-<nnn>            # source_acquisition_log.yaml row
    metadata_verified: true | false
    claim_match_verified: true | false
    claim_match_verification_route: HUMAN_I5 | DECORRELATED_AI_I3 | NOT_YET
    version_status: PREPRINT | PUBLISHED | BOTH_LINKED | NOT_APPLICABLE
      # preprint-vs-published check (request 35) — if BOTH_LINKED, `superseded_by`/`supersedes`
      # on the citation_card must point published<->preprint pair explicitly
    retraction_check: CLEAR | RETRACTED | UNCHECKED
      # Crossref/Retraction Watch check result at freeze time; UNCHECKED is honest, not silently
      # treated as CLEAR
    dialogue_table_stance: agrees | disagrees | orthogonal | undetermined
    # --- claim-tier intake flag (NEW v0.6, design/FOUNDATION_v0.6_PATCH.md §4 — PENDING FOUNDER
    # DECISION: thin-layer-scope-confirmation, not yet ratified) -------------------------------
    intake_tier: request_tier | not_flagged   # default not_flagged. request_tier = this source's
                                              # own genre would normally suppress an AACODS
                                              # trace-to-original+appraise pass (e.g. a policy
                                              # brief, grey literature, an anecdotal/expert/
                                              # local-knowledge account) -- requests a tier
                                              # assignment, never rejects the source outright.
    intake_tier_reason: null                  # required non-empty string when intake_tier ==
                                              # request_tier; a flagged-and-tiered row is distinct
                                              # from a rejected row (kernel rule 22,
                                              # INTAKE-TIER-UNTIERED).
    global_south_exempt: false                 # true suppresses the D-LIT-* suspicion framing --
                                              # Global South anecdotal/expert/local-knowledge
                                              # evidence genres are never automatically suspect by
                                              # the intake_tier flag alone.
    # --- diversity dimensions (request 35e — recorded per source, aggregated below) -----------
    diversity:
      language: en | th | other
      discipline_or_tradition: ""            # free text, e.g. "clinical veterinary medicine"
      source_type: peer_reviewed | preprint | grey_literature | practitioner | community | archival | field_observation
      search_route_or_database: ""           # which database/AI route/rl-shelf surfaced it — must
                                              # not be the same single value for every source (see gate)
      geography_or_institution: ""
      venue_quality_index:
        # metadata ONLY (request 35f) — a venue-quality signal (e.g. Scopus/SJR quartile, journal
        # impact tier), NEVER a substitute for claim_match_verified. Legitimacy ≠ Truth (NC family
        # A/D, Appendix A) — recording this does not raise evidence_tier or independence_class.
        index_name: null                     # e.g. "Scopus SJR"
        value: null                          # e.g. "Q1"
        date_read: null

# --- stratified selection table (request 35f) -----------------------------------------------
# Selection rule: WITHIN a stratum (quality_tier x region x language x source_type), take the
# most accurate / highest-quality verifiable source. ACROSS strata, maximise spread: fill empty
# strata before adding a second source to any stratum that already has one. Even a set restricted
# to top-tier venues must still report spread across region/language/institution WITHIN that tier.
strata_table:
  - stratum: { quality_tier: "", region: "", language: "", source_type: "" }
    candidates_considered: []              # citation_card ids considered for this stratum
    selected: null                          # citation_card id chosen for this stratum, or null if
                                             # the stratum is genuinely empty (no candidate found —
                                             # record as LOCAL_EVIDENCE_NOT_FOUND-style coverage fact,
                                             # never silently omitted from the table)
    selection_reason: ""                    # why this one, within the stratum (accuracy/quality)
  # ... one row per stratum actually populated or deliberately left empty and disclosed

# --- diversity audit rollup (request 35e) -----------------------------------------------------
diversity_audit:
  counts:
    by_language: {}                         # {en: n, th: n, other: n}
    by_source_type: {}
    by_search_route_or_database: {}
    by_stance: { agrees: 0, disagrees: 0, orthogonal: 0, undetermined: 0 }
    by_geography_or_institution: {}
  concentration_flags: []
    # any dimension where >= X% of sources sit in one cell (X set per-project, default 80%, Dr
    # proposed, founder may override) is listed here with the cell and the percentage
  zero_disagree_flag: false
    # true if by_stance.disagrees == 0 despite a real challenge-family search having run
    # (search_log.queries.challenge non-empty) — a flag, not silently accepted as "no counter-
    # evidence exists"
  never_claim_diverse_without_counts: true  # const reminder — prose citing this manifest may never
                                             # say "diverse sources" without pointing at this block

# --- accuracy discipline summary --------------------------------------------------------------
accuracy:
  total_citations: 0
  verified_count: 0                         # status == VERIFIED
  spot_check:
    applicable: true | false                # false only if every citation's claim_match_verified
                                             # route is HUMAN_I5 (100% human already)
    proposed_n_percent: 20                  # S14 §5.4 default proposal — Dr, founder may override
    small_n_rule_applied: false             # true if total_citations < 10 -> 100% spot-checked instead
    sampled_citation_ids: []
    sample_size: 0
    spot_check_result: PASS | FAIL | PENDING
    spot_checked_by: null                   # human name/role
    spot_checked_at: null

secondary_citation_ban_audit:
  violations_found: 0                       # any citation whose acq log secondary_citation_check
                                             # == FAILED and which still carries a dialogue_table
                                             # stance is a violation — hard block, not a warning

# --- gate (two SEPARATE gates, request 35e) ----------------------------------------------------
gate:
  accuracy_gate: PASS | PASS_WITH_LIMITS | FAIL | PENDING
    # PASS requires: every citation.status == VERIFIED, spot_check.spot_check_result == PASS
    # (or applicable: false), secondary_citation_ban_audit.violations_found == 0,
    # retraction_check != RETRACTED for any cited source
  diversity_gate: PASS | PASS_WITH_LIMITS | FAIL | PENDING
    # PASS requires: diversity_audit actually populated (not skipped), no undisclosed
    # concentration (every concentration_flags entry carries a D-LIT-CONCENTRATED disclaimer),
    # zero_disagree_flag either false or explicitly disclosed
  overall: PASS | PASS_WITH_LIMITS | FAIL | PENDING
    # overall PASS requires accuracy_gate in {PASS, PASS_WITH_LIMITS} — diversity_gate failing
    # alone downgrades to PASS_WITH_LIMITS with mandatory disclosure, it does NOT hard-block by
    # itself (a real, disclosed concentration is honest; a fabricated "diverse" claim is not)
  blocked_reason: null                      # required non-null whenever overall == FAIL

disclaimers_emitted: []   # D-CITATION-UNVERIFIED, D-LIT-MODE, D-LIT-NOT-OBTAINED,
                          # D-LIT-CONCENTRATED, D-DVP-NOT-K2, D-COMPARISON, D-BLACKBOX-NOTE (§4)

# --- discovery-routing extension (NEW v0.6, design/FOUNDATION_v0.6_PATCH.md §23 — PENDING
# FOUNDER DECISION: discovery-routing-stage-adoption, not yet ratified) ------------------------
discovery_routing:
  used: false                              # default false. When true, this L1-L6 pipeline was
                                            # preceded by a discovery-routing stage: the human
                                            # retains ownership of the question; the AI
                                            # recursively decomposes it into candidate
                                            # sub-questions and gates each one before it enters L1.
                                            # An EXTENSION, never a replacement -- every candidate
                                            # that survives the gate still runs the full L1-L6
                                            # pipeline unchanged (kernel rule 25,
                                            # DISCOVERY-CANDIDATE-UNGATED).
  candidate_questions: []                  # [string] -- every sub-question the AI proposed
  k_epi_gate_log: []                       # [{question, gated_out: bool, reason}] -- required
                                            # one row per candidate_questions entry before that
                                            # candidate may enter L1, whenever used == true

human_owner: string, minLength 1
