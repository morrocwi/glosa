id: kc-ep-036
kind: method
title: 'The Declaration Bound: bit-accurate retained-state separation for deferred spectral queries'
text: Studies exact eigenvalue counting for a streamed tridiagonal matrix under before- vs after-traversal
  query declaration, measured in bits/machine words; shows a sharp Θ(1) vs Θ(n) retained-space separation
  depending on when the query is declared, and that the classical constant-register Sturm bound must not
  be identified with constant bit space without a stated precision model.
verbatim: We study exact eigenvalue counting for a streamed real symmetric tridiagonal matrix when the
  spectral query is announced either before or after the record is read. The principal revision over an
  arithmetic-register formulation is that retained state is measured in bits and machine words throughout.
  We construct a 𝑞-ary family of irreducible tridiagonal matrices whose entries and admissible shifts
  occupy 𝑤 = Θ(log(𝑛𝑞)) bits.
