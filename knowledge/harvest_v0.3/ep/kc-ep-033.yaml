id: kc-ep-033
kind: method
title: 'Experience Is the Human LoRA: readout-retention theory of selective model change'
text: Argues experience is a selective, low-rank transformation of the observer (a cross-level identity
  with the engineering LoRA procedure), developed inside a finite-discrete readout framework where every
  accessible state is a finite retained difference on a finite graph, time is indexed by n∈N, and state/update
  matrices are rational with no continuum limit required; if an update factors through an active readout
  space of dimension m inside a d-dimensional organization, update rank is bounded by m (finite-bottleneck
  condition m<d).
verbatim: This paper argues that experience is the human LoRA. The identity is not a claim that the brain
  is a transformer, that phenomenal character is matrix multiplication, or that biological learning implements
  the engineering procedure introduced as Low-Rank Adaptation. It is a cross-level identity claim about
  one finite event. From the first-person side, an experience is a temporally bounded, embodied, affectively
  weighted, world-directed appearance.
