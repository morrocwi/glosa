id: kc-ep-013
kind: claim
title: Knowledge as stabilization of representation under admissible variation
text: 'Reframes Gettier non-convergence as a mislocated explanandum: proposition-level theories evaluate
  completed beliefs and omit formation-path fragility; proposes knowledge as stabilization of representation
  under admissible variation, with epistemic luck reconstructed as representational instability, applied
  to fake-barn/stopped-clock/Smith-Jones cases.'
verbatim: Since Gettier, epistemologists have repeatedly attempted to repair the justifiedtrue-belief
  model by adding further conditions designed to exclude accidental truth. Yet the most striking feature
  of post-Gettier epistemology is not the ingenuity of these repairs but their failure to converge. This
  paper argues that the persistent non-convergence of post-Gettier analyses is best explained by a mislocation
  of the explanandum.
