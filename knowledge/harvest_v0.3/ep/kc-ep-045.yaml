id: kc-ep-045
kind: method
title: 'The Epistemic Chain Reaction: controlled human-AI amplification (Bounded Knower Paper IV)'
text: Paper IV of the Bounded Knower sequence; proposes a controlled epistemic chain reaction where a
  human retains the problem/question while heterogeneous AI processes recursively decompose it, traverse
  distant knowledge structures, generate/critique candidate relations, collapse readout-equivalent variants,
  and propagate only new candidate classes clearing declared grounding/discriminability gates; introduces
  a finite epistemic multiplication factor k_epi.
verbatim: 'Series. Paper IV of the Bounded Knower sequence. Paper I: From Problem to Hypothesis (DOI 10.5281/zenodo.22307148).
  Paper II: Knowledge Topology and the First Passage to Usable Hypotheses (DOI 10.5281/zenodo.22307561).
  Paper III: Before Evidence Can Decide (DOI 10.5281/zenodo.22307564). Status. GLOSA K0 conceptual and
  agenda paper — timestamped and citable, not independently reviewed, no priority claim; central augmentation
  laws remain [Open].'
