id: kc-ep-038
kind: claim
title: 'Epistemic hardening: asymmetric revisability in Muslim knowledge regimes'
text: Develops a sociology-of-knowledge account of 'epistemic hardening' — the declining social revisability
  of human interpretive claims once revelation, interpretation and institutional authority become socially
  compressed; the core relational contribution is asymmetric revisability (unequal practical capacity
  to question/correct/reclassify claims), which under some conditions shifts moral delegation toward protected
  displacement and contributes to conflict closure.
verbatim: 'This article develops a sociology-of-knowledge account of how human religious interpretation
  can become unusu- ally resistant to correction and, under specific political conditions, contribute
  to conflict persistence. It begins from a distinction that is doctrinally elementary but sociologically
  consequential: revelation, human interpre- tation, and institutional authority are not equivalent forms
  of knowledge.'
