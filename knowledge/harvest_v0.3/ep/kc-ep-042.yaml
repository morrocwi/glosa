id: kc-ep-042
kind: definition
title: 'The Readout Condition: existence, attribution, disclosure'
text: 'Develops the Readout Condition as a necessary architecture for source-relative epistemic warrant:
  existence (every claim-level distinction has an epistemic provenance path), attribution (a distinction
  credited to a source must be licensed by that source), and disclosure (essential augmentations must
  remain visible to audit); in the exact functional case, source attribution requires constancy on readout
  fibers and factorization through the readout, extended pointwise for non-transitive indiscriminability
  and via an identification ladder for stochastic (Blackwell-garbling) settings.'
verbatim: 'This paper develops the Readout Condition as a necessary architecture for source-relative epistemic
  warrant. Its core is a three-part norm: existence (every claim-level distinction has an epistemic provenance
  path), attribution (a distinction credited to a source must be licensed by that source), and disclosure
  (essential augmentations must remain visible to audit). In the exact functional case, source attribution
  requires constancy on readout fibers and hence factorization through the readout.'
