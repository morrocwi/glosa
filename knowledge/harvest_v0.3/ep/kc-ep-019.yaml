title: 'Three Layers, One Moon: PCS applied to hilal (crescent-sighting) disagreement'
text: 'Argues recurring hilal-sighting disagreements stem not from astronomical uncertainty or institutional
  failure but from Premature Category Stabilization: applying the tools/standards/authority of one layer
  (astronomical, jurisprudential, institutional) to questions belonging to another; recommends a repair-permissive
  community architecture over enforced uniformity.'
verbatim: Disagreements over the sighting of the new crescent moon (hilal) recur annually across Muslim
  communities worldwide, generating persistent conict even among actors who share sincere religious commitment
  and access to the same astronomical data.
