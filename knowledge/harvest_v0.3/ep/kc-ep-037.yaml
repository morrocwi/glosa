id: kc-ep-037
kind: definition
title: 'What a zero readout certifies: zero as the failure locus of retained distinction'
text: 'Shows that in a finite-discrete retained-difference setting, a zero readout is not an absence but
  a classification: for the retained-information operator on a positively weighted comparison graph, the
  zero locus coincides (both directions) with the locus where no difference is retained across the declared
  structure — machine-checked over the rationals without classical axioms; the class is relative to the
  declared structure, not absolute.'
verbatim: 'rithmetic supplies the symbol 0. It does not, by itself, say what a measurement returning that
  symbol has established. This paper answers that question for a setting whose primitive is the retained
  difference—the assertion that two things are told apart under finite access—and whose readings are finite
  and rational. In such a setting zero is anomalous: it arrives in the same register as every other value,
  yet reports that the primitive did not fire.'
