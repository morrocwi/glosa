id: kc-ep-043
kind: claim
title: 'Written by AI, still true: the Possession-Constitution Collapse and knower fetishism'
text: 'Confidence-drop on learning a text was AI-generated, after provenance has done its legitimate work,
  is often a further slide from ''knowing is a state of a subject'' (Possession) to ''epistemic value
  requires a human-like knower'' (Constitution) — the Possession-Constitution Collapse; its social form,
  knower fetishism, converts an earned relation among evidence/reliability/accountability into an intrinsic
  property of the knower. Proposes: provenance matters only via an identifiable channel; metadata is never
  epistemic status.'
verbatim: Suppose a proposition survives source checking, inferential scrutiny, and independent reconstruction.
  You accept it. Then you learn that an artificial-intelligence system generated the draft, and your confidence
  falls. What, exactly, became epistemically worse? The familiar answer is that provenance can carry higher-order
  evidence about reliability. Correct. This paper grants that point and then asks what remains after provenance
  has done all the legitimate epistemic work available to it.
