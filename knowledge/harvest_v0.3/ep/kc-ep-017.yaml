id: kc-ep-017
kind: claim
title: 'Causal Qualia: phenomenal interior as bounded causal organization, not brute privacy'
text: Argues privacy alone cannot explain phenomenality; proposes phenomenal interior arises from an embodied
  agent modeling its own condition under bounded access, regulatory dependence and affective stakes —
  components include bounded interior horizon, self-indexed modeling, homeostatic coupling, valence, ownership
  binding.
verbatim: Why internal information processing should ever be accompanied by phenomenal experience remains
  one of the central questions in philosophy of mind. Yet the hard problem is often posed in a form so
  broad that it obscures distinctions that matter theoretically. This article develops a constraint-based
  approach intended to sharpen that terrain.
