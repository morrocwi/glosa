title: 'Rigour Without Infrastructure: three propositions on claim-card discipline'
text: States, as three falsifiable propositions rather than demonstrated results, that a claim card separately
  recording what was seen / what the data separates / what AI filled in / what is assumed / what independent
  check (if any) the claim survived, bound to a formal Existence-Attribution-Disclosure norm (from kc-ep-042)
  and passed through a named independence ladder (I0 self-check through I5 outside human review) before
  public release, could carry a checkable rigour property that institutional certification otherwise supplies.
