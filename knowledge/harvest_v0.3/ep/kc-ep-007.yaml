verbatim: This note introduces a primitive aggregation operator within Causal Calculus, designed to formalize
  aggregation under finite causal and epistemic access. The operator does not presuppose an underlying
  discrete or continuous ontology. Classical summation and integration may arise only as declared limiting
  cases under additional structural assumptions
