title: สัจจะสัมพันธ์ (Relational Truth) — Thai restatement
text: 'A Thai-language book restating relational-truth themes: ''everything we know is not absolute truth
  as such, but a truth translated through us'' — knowing itself is choosing and holding a position between
  the world outside and the world we cannot know fully without distortion.'
verbatim: เพราะทุกการรับรู้ของเรา มิใช่ความจริงสมบูรณ์โดยตรง แต่คือความจริงที่ถูกแปลความผ่านตัวเราเสมอ
  ชีวิตจึงเป็นการเลือกและดำรงอยู่ ระหว่างโลกภายในกับโลกภายนอก ภายใต้ความจริงที่เราไม่อาจล่วงรู้ได้ครบถ้วน
  โดยไม่ละทิ้งจินตภาพ ซึ่งถือกำเนิดจากทั้งเหตุผลและศรัทธา
