id: kc-ep-010
kind: claim
title: 'Learning under generative abundance: a structural regime shift'
text: Argues AI-driven near-zero-cost coherent-expression production degrades inferential signals and
  escalates conceptual volatility until a critical threshold triggers a regime shift from accumulation
  to discrimination; redefines learning as preserving structural stability when expressive output no longer
  uniquely indicates internal organization.
verbatim: 'Artificial intelligence creates an epistemic environment in which coherent expressions can
  be produced externally at near-zero marginal cost. This paper argues that the consequences for education
  stem not primarily from pedagogical choice, but from a structural law governing inference under conditions
  of generative abundance. A single underlying dynamic gives rise to three observable effects: degradation
  of inferential signals, escalation of conceptual volatility, and the emergence of selective stabilization.'
