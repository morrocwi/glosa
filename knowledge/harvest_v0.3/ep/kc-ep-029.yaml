title: 'Catuskoti-on-Catuskoti: what survives Nāgārjuna''s self-applied fourfold negation'
text: Applies Nāgārjuna's fourfold negation (catuskoti) to the logical procedure itself; argues no horn
  of the tetralemma accounts for how catuskoti functions as a tool, yet it functions reproducibly — the
  functional residue is identified with θ(E) (no svabhāva, non-emptiness, asymmetric constraint, specifiable
  limits).
verbatim: This paper introduces the move of catus.kot. i-on-catus.kot. i—the application of N¯ag¯arjuna’s
  own fourfold negation to the logical procedure itself. The argument shows that no horn of the tetralemma
  can coherently account for how the catus.kot. i functions as a logical tool, yet the tool continues
  to function in a reproducible and nonarbitrary way.
