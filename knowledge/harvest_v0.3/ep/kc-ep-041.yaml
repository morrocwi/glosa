id: kc-ep-041
kind: method
title: 'The Standalone Scholar: dual-track architecture for AI-native scholarship'
text: For scholars outside institutional infrastructure, AI can make plausible scholarly-object production
  abundant before independent criticism/certification/institutional-access become abundant; proposes a
  dual-track architecture — AI-assisted formation/open-preprint-staging/provenance-controls/machine-constrained
  checks producing defensible provisional assets, converted to socially stress-tested knowledge via independent
  human friction/repeat correspondence/journal review — distinguishing synthetic plurality from independent
  validation and legitimacy from truth.
verbatim: Generative AI lowers the cost of literature exploration, argu- ment recombination, drafting,
  coding scaffolds, and adversarial questioning. For scholars embedded in universities, these gains are
  absorbed into pre-existing laboratories, seminars, editorial networks, ethics systems, and disciplinary
  communities.
