id: kc-ep-006
kind: method
title: Constructible ordering from a primitive step relation (precursor)
text: Defines an ordering value t(s) as minimal steps to reach state s from a reference point on a state
  space with a step relation ⇒, proves a characterization theorem (sufficiency+necessity) for when such
  ordering is well-defined, independent of time/dynamics/probability/physics.
verbatim: We present a self-contained characterization of when a well-dened ordering can be constructed
  from a primitive step relation on a state space, without presupposing time, dynamics, probability, or
  physical structure. Starting from a nonempty state space S equipped with a binary relation ⇒ (the step
  relation), we dene an ordering value t(s) as the minimal number of steps required to reach state s from
  a xed reference.
