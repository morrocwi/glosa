id: kc-ep-015
kind: claim
title: Judicial neutrality as institutional achievement, not visual sameness
text: 'Argues the assumption that visible religious attire threatens judicial impartiality rests on a
  mistaken premise: cognitive distortions (anchoring, framing, hindsight, implicit bias) arise from the
  architecture of human cognition, not visible identity; neutrality is an institutional achievement via
  procedural safeguards, not visual uniformity.'
verbatim: Debates about judicial neutrality frequently assume that visible religious attire threatens
  impartial adjudication. Yet existing legal debates about religious symbols rarely integrate empirical
  research on judicial cognition and decision-making. This article argues that the assumption linking
  visible identity to judicial bias rests on a mistaken premise.
