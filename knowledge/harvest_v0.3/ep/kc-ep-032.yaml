id: kc-ep-032
kind: claim
title: Objective chance is not explanatorily primitive; modal difference is prior
text: 'Argues against chance-fundamentalism: every objective-chance attribution assigns a weight to an
  outcome within a field of alternatives, which requires non-identity among members that remain structurally
  available for comparison/weighting (''modal difference''); establishes modal difference''s conceptual/explanatory
  priority over chance without denying chance itself.'
verbatim: 'This paper argues that objective chance is not explanatorily primitive. The target is chance-fundamentalism:
  the view that chance can serve as the primitive explanatory floor of the modal structure in which alternatives
  and weights are defined. Against this view, I argue that every contentful objective-chance attribution
  assigns a normalized or measure-like weight to an outcome within a field of alternatives.'
