id: kc-ep-031
kind: claim
title: The explanatory insufficiency of randomness
text: 'Argues objective chance cannot be the terminal explanans of natural order: every contentful chance
  ascription presupposes a determinate space of possibilities plus a measure over it, so chance explains
  at most which possibility is actualized, never that the possibility-space and its measure obtain; surveys
  and rebuts the standard escape routes (law-without-law, self-organisation, multiverse, quantum indeterminacy,
  brute fact).'
verbatim: 'It is sometimes proposed that objective chance is the terminal explanans of natural order:
  that laws and their stability are, at bottom, products of brute randomness with nothing more fundamental
  beneath them. I argue that this position is incoherent as stated. Every contentful ascription of objective
  chance—whether construed as a property of a process or of a product—presupposes a determinate space
  of possibilities together with a measure over it.'
