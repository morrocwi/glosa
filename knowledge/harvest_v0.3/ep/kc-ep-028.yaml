title: 'Mind as Information Horizon: telegraph equation to expertise on a discrete causal graph'
text: Derives a full chain from three postulates (distinguishability, causal closure, finite propagation
  speed) to the telegraph equation on a finite discrete graph as the unique minimal governing dynamics;
  derives an Agency-Horizon Theorem (event horizon, privacy, emission constraint, partial self-access,
  information persistence) and grounds expertise as the mature regime of coupled information-horizon/embodied-process
  dynamics.
verbatim: What must reality minimally be if knowingand therefore expertiseare to be possible at all? This
  paper derives a complete architectonic chain from primordial dierence through the formation of world-class
  expertise, within a discrete causalinformational ontology. The argument proceeds in ve movements.
