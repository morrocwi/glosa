id: kc-ep-008
kind: method
title: 'Causal Guardrails: pre-linguistic admissibility checks for LLMs'
text: Diagnoses LLM failure modes (hallucination, sycophancy, context drift) as expected consequences
  of finite agency without causal-admissibility constraints; proposes Causal Guardrails enforcing pre-generation
  checks on causal state/agency/invariant-meaning, plus Causal-Access-Constrained Learning (CA-CL) and
  adversarial stress tests.
verbatim: 'Large Language Models (LLMs) optimize next-token predictability and achieve remarkable fluency,
  yet exhibit persistent failure modes including hallucination, sycophancy, context drift, and behavioral
  instability. These are often treated as defects of training, alignment, or evaluation. This paper advances
  a structural diagnosis: such failures are expected consequences of finite agency operating without explicit
  constraints on causal admissibility.'
