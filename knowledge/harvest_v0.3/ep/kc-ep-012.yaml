title: 'CMP Knowledge Stability Theorem: three induction puzzles as one structural condition'
text: Unifies Hume's induction problem, Goodman's grue riddle, and Hempel's raven paradox as manifestations
  of observer-indexed underdetermination; proves that under an equivariance + Lyapunov-ascent condition,
  every stable attractor of a learning dynamics lies in the hypothesis set invariant under the operative
  regime's transformation group.
verbatim: 'Three foundational problems in the philosophy of science—Hume’s problem of induction, Goodman’s
  new riddle of projectibility, and Hempel’s raven paradox—are standardly treated as independent puzzles
  requiring separate solutions. We argue that they are unified manifestations of a single structural condition:
  observer-indexed underdetermination in hypothesis spaces that are delimited by finite causal memory
  and finite propagation speed.'
