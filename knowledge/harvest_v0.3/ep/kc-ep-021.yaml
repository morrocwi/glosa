id: kc-ep-021
kind: claim
title: 'Constraint-first epistemology: a non-zero floor of mediation'
text: Argues finite cognition entails a non-zero floor of mediation derived from three minimal premises
  (distinguishability, causal connectivity, finite propagation speed), from which normativity is derived
  as constitutive rather than optional; engages Kantian and Madhyamaka (Buddhist) frameworks and Thompson/Garfield/Siderits
  directly.
verbatim: Both Kantian philosophy and Buddhist thought reject the possibility of epistemic immediacy.
  Yet contemporary comparative philosophy still lacks a stable account of how normativity survives once
  cognition is fully acknowledged to be conditioned. If all cognition is mediated, and if agency does
  not originate from an unconditioned subject, why are some frameworks better than others? This article
  develops a constraint-first epistemology to address this problem.
