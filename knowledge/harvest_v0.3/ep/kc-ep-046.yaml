title: State of Evidence registry for the Readout hypothesis-generation programme (E01-E25)
text: 'Companion living evidence registry for Papers I-IV of the Bounded Knower programme: a Claim Registry
  of 25 evidence claims (id, status, evidence strength, primary paper, decisive test) plus a synthesis
  PDF; explicitly states ''Observed'' means the cited literature reported a neighbouring phenomenon, never
  that a paper-specific Readout variable was validated, and no independent checker has certified the registry.'
verbatim: 'Series. Companion evidence registry for the four-paper Bounded Knower / Readout hypothesis-generation
  programme: Paper I (DOI 10.5281/zenodo.22307148), Paper II (DOI 10.5281/zenodo.22307561), Paper III
  (DOI 10.5281/zenodo.22307564), Paper IV (DOI 10.5281/zenodo.22307751). Files: the State of Evidence
  synthesis (PDF) and Claim_Registry_E01_E25.csv (25 evidence claims: id, status, evidence strength, primary
  paper, decisive test). Status.'
