id: kc-ep-014
kind: claim
title: Knowledge as stabilized translation under bounded observation
text: Proposes epistemology begin from bounded observers forming world-models under constraint rather
  than direct access; knowledge is stabilized translation under bounded observation — a representation
  stable across admissible variation, calibration and cross-checking — giving a common grammar for human
  and machine model-based knowing.
verbatim: 'Epistemology has often treated knowledge as a matter of access: a subject seeks justified,
  reliable, or rational contact with reality. This article argues that such accounts remain incomplete
  because they understate the constitutive role of mediation, finite access, selective encoding, and structured
  error. The problem becomes sharper in the age of artificial intelligence, where systems generate reliable
  and action-guiding outputs without fitting inherited models of reflective belief or transparent justification.'
