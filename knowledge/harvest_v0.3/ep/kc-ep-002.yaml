id: kc-ep-002
kind: claim
title: The language bridge as human-to-social-capital conversion
text: Frames language as never-neutral and fragmented by discipline/culture; proposes a 'language bridge'
  converting individual human capital into social capital, with LLMs accelerating this by re-articulating
  thought across linguistic/disciplinary walls without replacing the human voice.
verbatim: 'Human capital, as Yaoharee Lahtee describes it, is not a statistic of productivity but the
  living potential within each person—the capacity to know, to feel, to connect, and to create meaning.
  Yet potential alone does not transform societies. It requires a medium that allows inner values to be
  shared and understood. That medium is language. Language, however, is never neutral. It is fragmented
  by professions, disciplines, and cultures: the language of law, the language of bureaucracy, the language
  of technology.'
