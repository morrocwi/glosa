id: kc-ep-044
kind: claim
title: Faqr, scholarly authority, and non-transferable responsibility
text: Distinguishes revelation (not fallible) from human reception/interpretation/institutionalization
  (creaturely acts); separates revelation from juristic readouts and scholarly epistemic authority from
  adjudicative/political authority; advances five claims including Non-Transferable and Additive Responsibility
  and Shūrā as Distributed Corrigibility — fiqh is a human juristic determination of divine normativity,
  not revelation itself, which is the condition under which ijtihād can be rewarded when correct and still
  rewarded when it errs.
verbatim: 'This article develops a revelation-bounded Sunni conceptual-normative architecture for relating
  divine normativity, juristic expertise, moral agency, and collective consultation without collapsing
  one into another. Its point of departure is faqr: the creaturely condition of dependence upon God. The
  argument reconstructs faqr as an epistemic discipline as well as a spiritual truth. Revelation is not
  fallible, but human reception, interpretation, contextualization, and institutionalization remain creaturely
  acts.'
