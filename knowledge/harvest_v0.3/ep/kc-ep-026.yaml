id: kc-ep-026
kind: definition
title: 'θ(E): relational invariance without intrinsic nature'
text: 'Names θ(E), the world-side causal-structural organisation finite knowers track without possessing,
  characterized by four properties: absence of intrinsic nature, non-emptiness, asymmetric constraint,
  and specifiable limits; argues structural realism captures (ii)-(iv) but risks reifying structure, while
  Madhyamaka captures (i) but struggles to ground (iii)-(iv).'
verbatim: Both structural realism and Madhyamaka philosophy identify naive realism as untenable, but they
  reach for dierent remedies. Structural realism retains mindindependent structural invariants as the
  real furniture of the world; Madhyamaka extends the ± unyat a diagnosis to structures themselves, risking
  anti-realist collapse. This paper argues that neither position systematically achieves the four-property
  cluster required for a coherent account of world-constrained, mediated knowing.
