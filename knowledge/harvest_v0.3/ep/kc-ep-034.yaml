id: kc-ep-034
kind: claim
title: The Architecture of Faqr (five registers of creaturely dependence)
text: 'Organizes a constructive Sunni framework around faqr (creaturely dependence) as the positive ontological
  mode of created being across five registers: Dependent Order, Directed Selection, Dependent Identity,
  Fahm al-ʿabd (the receptive stance of the creaturely knower), and ikhtilāl al-maqām (its structural
  failure mode); tests the framework against three juristic cases.'
verbatim: 'This article presents a unified constructive framework, within the broad heritage of ahl al-sunna
  wa-l-jamāʿa, organized by a single insight: creaturely dependence (faqr) is not a defect to be minimized
  but the positive ontological mode of created being— reality does not entail independence, and the creature
  is most fully itself where it is most perfectly held. The insight is specified across five registers.'
