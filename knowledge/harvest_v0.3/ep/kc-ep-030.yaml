title: Dependent Order, Directed Selection, Dependent Identity (Ash'arī theology)
text: 'Proposes three repairs to classical Ash''arī theology: Dependent Order (a three-tiered causality
  account preserving divine sovereignty while making a sustained world epistemically respectable — the
  world resists misunderstanding because God made it resistant, and knowledge is the residue of beliefs
  surviving that resistance), Directed Selection (thickening kasb with intention/orientation), and Dependent
  Identity (personal continuity via God''s preserved moral biography).'
verbatim: This paper proposes three coordinated repairs to classical Ashʿarī theology, each aimed at a
  structural weakness that the tradition has carried forward without resolving. The first, Dependent Order,
  offers a three-tiered account of causality that preserves the absolute sovereignty of God at the metaphysical
  level while making the intelligibility of a sustained world epistemically respectable.
