id: kc-ep-011
kind: claim
title: Invariance as condition of same-world discourse
text: Argues that claiming distinct descriptions concern 'the same world' presupposes a non-empty invariant
  structural core stable under admissible transformations; the invariance requirement is a condition-of-intelligibility
  necessity, not empirical or analytic.
verbatim: 'When distinct descriptions are said to concern the same world, what makes this claim more than
  pragmatic coordination or mutual translation? Absent structural constraint, world-identity risks collapsing
  into representationindexing or community agreement. This paper argues that same-world discourse presupposes
  a non-empty invariant structural core: at least some claims must remain stable under independently motivated
  admissible transformations.'
