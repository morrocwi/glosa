id: kc-aihp-013
kind: claim
title: 'Possession–Constitution Collapse and ''knower fetishism'': epistemic value does not require a
  human-like knower'
text: Modern epistemology often slides from the plausible claim that knowing is a state of a subject to
  the much stronger, usually undefended claim that epistemically significant content only acquires standing
  through a human or human-like knower — the Possession–Constitution Collapse. Its social form, knower
  fetishism, converts an earned relation among evidence/reliability/accountability into an apparently
  intrinsic property of the recognized knower.
verbatim: 'I argue that modern epistemology often slides from a plausible claim about the possession of
  knowledge—that knowing is a state or standing of a subject—to a much stronger and usually undefended
  claim about the constitution of epistemic value—that epistemically significant content, processes, records,
  or sources acquire standing only through a human or human-like knower. I call this the Possession–Constitution
  Collapse. Its social form is knower fetishism: the conversion of an earned relation among evidence,
  reliability, accountability, and inquiry into an apparently intrinsic property of the recognized knower.'
