id: kc-aihp-011
kind: rule
title: 'The Readout Condition: Existence, Attribution, Disclosure — three principles governing claim-level
  distinctions'
text: 'Formalizes the epistemic engine glosa''s own claim card operationalizes: Principle 1 (Existence)
  every claim-level distinction with epistemic weight must have a traceable provenance path; Principle
  2 (Attribution) a claim''s attributed source must actually license the distinction; Principle 3 (Disclosure)
  any augmentation beyond the attributed source must stay declared or recoverable in audit. The conjunction
  is the Readout Condition.'
verbatim: Principle 1 (Existence). Every claim-level distinction that bears epistemic weight must have
  an epistemic provenance path. Principle 2 (Attribution). If a claim attributes a distinction to a source
  S, then S must license that distinction under the relevant access condition. Principle 3 (Disclosure).
  If a distinction depends essentially on an augmentation beyond the attributed source, that augmentation
  must remain declared or recoverable in an epistemic audit. The conjunction is the Readout Condition.
