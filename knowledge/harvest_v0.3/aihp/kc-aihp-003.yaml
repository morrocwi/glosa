id: kc-aihp-003
kind: claim
title: Three falsifiable propositions (H1 design, H2 conceptual, H3 empirical) on claim-card discipline
text: 'Concept paper states, as untested propositions not demonstrated results: a claim card bound to
  an Existence–Attribution–Disclosure norm and gated by an independence ladder could substitute for institutional
  certification (H1/H2); cross-vendor AI checking would outperform same-vendor re-checking at catching
  undisclosed AI-fill (H3, n=0, untested). Each proposition carries a named falsifier.'
verbatim: Three candidate hypotheses (Section 5) — a design mechanism (H1), a conceptual claim about where
  rigour lives (H2), and an empirical claim about cross-vendor AI checking (H3) — propose that a claim-card
  discipline bound to Existence–Attribution–Disclosure and gated by an independence ladder could make
  a standalone scholar's claim reader-checkable without an institutional credential. Method. Each proposition
  carries a named falsifier and is placed against 48 independently verified citation cards in a conversation-with-the-literature
  table (Section 6).
