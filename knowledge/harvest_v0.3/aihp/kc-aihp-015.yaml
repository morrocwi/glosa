id: kc-aihp-015
kind: claim
title: 'NIDA national-conference slides: AI-mediated society risks the human forgetting their own status
  as chooser and responsibility-bearer'
text: 'Thai-language conference slides (NIDA, 29 Aug 2026) presenting, informally, the same concern as
  the companion English paper ''The Civilization of Knowledge'' (18943971): in a society increasingly
  mediated by AI, the human risks forgetting their status as chooser and their attendant responsibility.
  Presentation slides, not independently reviewed.'
verbatim: เนื้อหาเป็นการนำเสนอเชิงแนวคิดว่าด้วยปัญญาประดิษฐ์กับอารยธรรมความรู้ — การที่มนุษย์ลืมสถานะการเป็นผู้เลือกและความรับผิดชอบของตนในสังคมที่ถูกสื่อกลางด้วย
  AI; เป็นเอกสารนำเสนอ ไม่ใช่บทความที่ผ่านการประเมิน
