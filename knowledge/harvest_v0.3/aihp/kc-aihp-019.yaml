id: kc-aihp-019
kind: definition
title: 'Information Epistemic Foundation: knowledge as an auditable status of a claim, not a possession
  of a knower'
text: A journal-form synthesis of the Information Epistemic Foundation as a bounded domain translation
  of Readout Genesis. The root contains retained distinctions, a graph-Laplacian operator, ordered dynamics,
  context, and lineage — it does not contain belief, knowledge, truth, mind, institution, or consciousness
  as primitives; those become admissible only after a declared quotient and readout. Knowledge is proposed
  to be attributed as an auditable status of a claim, not a possession/reputation/authority of a knower.
verbatim: The root contains retained distinctions, a graph-Laplacian operator, ordered dynamics, context,
  and lineage; it does not contain belief, knowledge, truth, mind, institution, or consciousness as primitive
  objects. Those terms become admissible only after a declared quotient and readout. On that basis, the
  paper inserts a typed belief layer between memory and claim evaluation, defines belief as a multidimensional
  agency–claim relation, and proposes that knowledge be attributed as an auditable status of a claim rather
  than as a possession, reputation, or authority of a knower.
