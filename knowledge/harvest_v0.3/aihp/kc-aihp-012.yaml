text: A complementary identification ladder tracks the weakest augmentation layer at which a distinction
  becomes identified; the resulting typed provenance DAG supports a defeater-routing result — source-specific
  defeaters propagate exactly along the distinctions that depend on that source, while misattribution
  misroutes defeat and correction.
