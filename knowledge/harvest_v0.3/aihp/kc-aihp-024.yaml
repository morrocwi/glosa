kind: claim
title: 'Non-zero Kantian floor: finite cognition entails a structural, non-metaphysical floor of mediation'
text: 'Both Kantian philosophy and Buddhist thought reject epistemic immediacy. The paper derives a non-zero
  floor of mediation from three minimal premises (distinguishability, causal connectivity, finite propagation
  speed) — not as a metaphysical essence but as a structural condition of corrigible inquiry — and argues
  normativity is constitutive rather than optional: without responsiveness to constraint, inquiry collapses.'
verbatim: 'I argue that finite cognition entails a non-zero floor of mediation—not as a metaphysical essence,
  but as a structural condition of corrigible inquiry derivable from three minimal premises concerning
  distinguishability, causal connectivity, and finite propagation speed. From this, normativity is derived
  as constitutive rather than optional: without responsiveness to constraint, inquiry collapses.'
