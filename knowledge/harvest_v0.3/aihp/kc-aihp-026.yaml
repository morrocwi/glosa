id: kc-aihp-026
kind: claim
title: 'Knowledge crises are authority crises: the history of knowledge is the history of changing interpretive
  authority'
text: Human beings encounter partial traces, anomalies, records, and mediated signs, not a complete transparent
  reality; these become knowledge only after translation, stabilization through repeatable durable forms,
  and social authorization through institutions or recognized interpreters. What changes across civilizations,
  the paper argues, is not only accumulated truths but the succession of agencies authorized to interpret
  the world's signals — so knowledge crises are typically authority crises.
verbatim: 'Human beings do not encounter reality as a complete and transparent whole; they encounter partial
  traces, anomalies, records, measurements, and mediated signs. These do not become knowledge by themselves.
  They must be translated into meaningful accounts, stabilized through repeatable and durable forms, and
  socially authorized through institutions, procedures, or recognized interpreters. ... Its central claim
  is that knowledge crises are often authority crises: moments in which the legitimacy of interpreters
  is contested'
