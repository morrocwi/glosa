id: kc-aihp-018
kind: rule
title: 'Global-search bias correction: every socially relevant flagship needs both a global conversion
  route and a local one'
text: The paper argues that global scholarly search and AI recommendation routes may share Anglophone
  and database-distribution biases; accordingly every socially relevant flagship claim is assigned both
  a global conversion route and a local one, so a standalone scholar's work is not epistemically stranded
  by search-engine bias.
