title: 'Human LoRA Factorization Thesis: durable experiential change is rank-bounded by a finite readout
  bottleneck'
text: 'Developed inside a finite-discrete readout framework (every accessible state a finite retained
  difference on a finite graph, time indexed by n∈N, rational update matrices, no continuum limit): if
  an experience-mediated update factors through an active readout space of dimension m inside a d-dimensional
  operational organization, its update rank is bounded by m. Under m<d, event-level change is low-rank
  — the Human LoRA Factorization Thesis.'
verbatim: 'The argument is developed inside a finite-discrete readout framework: every accessible state
  is a finite retained difference on a finite graph; time is indexed by n ∈ N; formal state and update
  matrices are rational; and no continuum limit is required. If an experience-mediated update factors
  through an active readout space of dimension m inside an operational organization of dimension d, then
  its update rank is bounded by m. Under the finite-bottleneck condition m < d, event-level change is
  low- rank.'
