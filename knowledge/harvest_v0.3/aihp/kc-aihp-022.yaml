title: 'Agency-Horizon Theorem: every agent under the framework''s axioms exhibits five information-horizon
  properties'
text: 'From three postulates (distinguishability, causal closure, finite propagation speed), the telegraph
  equation on a finite discrete graph is derived as the unique minimal dynamics governing structural persistence
  and decay. The Causal Body Framework''s No-Go theorems then yield the Agency-Horizon Theorem: every
  agent satisfying the axioms exhibits event horizon, privacy, emission constraint, partial self-access,
  and information persistence — stated as a formal theorem, not a metaphor.'
verbatim: 'First, from three postulates (distinguishability, causal closure, nite propagation speed),
  the telegraph equation on a nite discrete graph is shown to be the unique minimal dynamics governing
  all structural persistence and decay. Second, the Causal Body Framework and its No-Go theorems are used
  to derive the Agency-Horizon Theorem (Th-BH): every agent satisfying the framework''s axioms exhibits
  the ve structural properties of an information horizon—event horizon, privacy, emission constraint,
  partial self-access, and information persistence. This result is a formal theorem, not a metaphor.'
