verbatim: 'This paper reports glosa (Rigour Without Infrastructure), a Standalone Scholar methodology
  for human–AI knowledge co-production: a person with no university, no lab, and no research team needs
  a mechanism that forces every claim to answer, for one claim at a time, what was actually seen, what
  the data separates, what AI filled in, what was assumed, and whether it has met independent evidence
  or objection. The paper is itself an instance of the method it describes: it is genre-routed as design_science
  (Problem → Objectives → Design → Demonstration → Evaluation), reaches tier Dr on its design claims and
  finite_diagnostic on one mechanically executed check (its own LaTeX build), and states plainly what
  was executed versus what remains specified.'
