id: kc-aihp-017
kind: method
title: 'Standalone Scholar: dual-track architecture separating AI-assisted formation from independent
  human friction'
text: For a scholar outside a university, AI can produce plausible scholarly objects abundantly before
  independent criticism, human relationships, certification, or institutional access become abundant.
  The paper's dual-track architecture routes AI-assisted formation, open preprint staging, provenance
  controls, and machine-constrained checks into defensible provisional assets, while independent human
  friction and review convert those assets into socially stress-tested knowledge — distinguishing synthetic
  plurality from independent validation, and legitimacy from truth.
verbatim: It develops a dual-track architecture in which AI-assisted formation, open preprint staging,
  provenance controls, and machine-constrained checks generate defensible provisional assets, while indepen-
  dent human friction, repeat correspondence, journal review, and local epistemic participation convert
  those assets into socially stress-tested knowledge. The framework distinguishes synthetic plurality
  from independent validation, production criticality from scholarly-credit criticality, attention from
  uptake, legiti- macy from truth
