  knowledge structures, generate candidate relations, critique them, collapse readout-equivalent variants,
  and propagate only new candidate classes that clear declared grounding and discriminability gates. Each
  retained frontier item can then seed new subquestions or rival hypotheses. A finite epistemic multiplication
  factor, kepi , is introduced as the number'
