title: 'Controlled epistemic chain reaction: human retains the question, AI recursively decomposes and
  gates candidates'
text: 'Paper IV of the Bounded Knower sequence proposes a controlled human-AI epistemic multiplication:
  a human retains the problem/question while heterogeneous AI processes recursively decompose it, traverse
  distant knowledge structures, generate and critique candidate relations, collapse readout-equivalent
  variants, and propagate only candidate classes that clear declared grounding and discriminability gates.
  A finite multiplication factor k_epi is introduced.'
