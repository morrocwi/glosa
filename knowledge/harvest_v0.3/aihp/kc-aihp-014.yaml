text: 'The paper''s positive proposal: (1) provenance matters only through an identifiable epistemic channel;
  (2) source metadata must never be identified with the epistemic role for which it is merely a proxy.
  AI is philosophically useful because it removes the human face from a claim and reveals how much epistemic
  credit was quietly attached to the face.'
