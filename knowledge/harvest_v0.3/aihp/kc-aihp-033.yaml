id: kc-aihp-033
kind: claim
title: 'The language bridge: human capital converts to social capital only by crossing disciplinary/professional
  dialects'
text: 'Conceptual reflection arguing language is never neutral — fragmented by profession, discipline,
  and culture into isolating dialects (law, bureaucracy, technology) — and proposing the ''language bridge'':
  a dynamic process converting human capital into social capital by transcending those linguistic/disciplinary
  walls. LLMs are framed as accelerating this bridge by interpreting and re-articulating human thought
  across those borders, extending rather than replacing the human voice.'
verbatim: 'Language, however, is never neutral. It is fragmented by professions, disciplines, and cultures:
  the language of law, the language of bureaucracy, the language of technology. These dialects often isolate
  knowledge rather than circulate it. Lahtee therefore proposes a new paradigm: the language bridge—a
  dynamic process through which human capital is converted into social capital by transcending linguistic
  and disciplinary walls.'
