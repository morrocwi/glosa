id: kc-he-005
kind: method
title: RRHM phobia model — pre-registering which falsification gates are simulable before any participant
text: Of eleven pre-committed falsification gates for a phobia hypothesis, ten are declared simulable and all
  ten are run before recruiting any participant; the record reports that six earlier simulated runs (v6-v8)
  produced four failures that forced a design change and a construct's algebraic form to be rewritten, and
  states this revision history rather than only the final passing battery.
verbatim: "Of the eleven falsification gates this hypothesis commits to, ten are simulable and all ten have now
  been run before any participant was recruited (K1 is a procedural rule, not a simulation target). Six were
  run in v6-v8: four of those failed, the design and one construct's algebraic form were changed, and the
  repaired battery discriminates."
