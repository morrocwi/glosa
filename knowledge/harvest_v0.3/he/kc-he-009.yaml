title: Health as constraint-admissible trajectory — identity redefined as admissible continuity, not static sameness
text: The paper defines health domain-restrictedly as maintained dispositional capacity of a temporally exposed,
  vulnerable process to preserve its identity-pattern through constraint-admissible reconstitution across
  state-transitions, rejecting equilibrium/statistical-normality/moral-fitness framings, and redefines identity
  itself as admissible continuity of identity-defining integration rather than static structural sameness.
verbatim: "Health is defined not as equilibrium, statistical normality, or moral fitness, but as the maintained
  dispositional capacity of a temporally exposed vulnerable integrated process to preserve its identity-pattern
  through constraint-admissible reconstitution across state-transitions."
