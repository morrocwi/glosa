id: kc-he-012
kind: definition
title: High Capability, Low Execution — execution failure reframed as finite causal capacity, not motivation deficit
text: The paper rejects motivation/personality/isolated-neurochemical explanations for capable people failing
  to complete extended tasks and reframes execution as a load-capacity causal system with a derived
  Lyapunov-based admissibility condition for persistence, extended to an operational specification letting AI
  systems reason about execution failure without anthropomorphic assumptions.
verbatim: "We propose that execution failure is not a deficit of intelligence, willpower, or desire, but a
  necessary consequence of finite causal capacity for state maintenance."
