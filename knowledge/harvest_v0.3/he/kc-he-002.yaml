id: kc-he-002
kind: method
title: SOMA-READ — frozen preregistration deposited before ethics approval, before any data
text: A human empirical protocol is time-stamped and deposited on Zenodo as a FROZEN draft explicitly BEFORE
  ethics-committee submission and before enrolling any participant, so the prediction (informational-window
  manipulation changes a candidate readout before fear/behaviour changes) cannot be retrofitted after seeing
  results. The deposit itself functions as the falsifiability commitment device, not the eventual paper.
verbatim: 'Status: FROZEN protocol draft v1.0 (2 September 2026), deposited as a time-stamped preregistration
  record BEFORE ethics submission and before any data collection. Not a result; no participants have been
  enrolled; the study must not run until an ethics committee approves it.'
