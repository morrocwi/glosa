id: kc-he-008
kind: definition
title: Wellbeing from Informationism — repair-permissive causal-informational coherence, not symptom absence
text: The monograph rejects reducing wellbeing to subjective happiness, symptom absence, or isolated
  biomarkers on the ground that each fails to explain chronic dysfunction, recovery failure, or irreversibility
  of accumulated biological burden, and instead defines wellbeing operationally as repair-permissive
  coherence across matter/body/mind/meaning/environment/social relation under finite causal access and memory.
verbatim: "Wellbeing lacks a principled ontological definition. Dominant framings reduce it to subjective
  happiness, symptom absence, or isolated biomarkers — each insufficient to explain chronic dysfunction,
  recovery failure, or the irreversibility of accumulated biological burden."
