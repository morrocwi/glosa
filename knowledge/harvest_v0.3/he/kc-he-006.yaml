id: kc-he-006
kind: method
title: CPRMH — seventeen pre-specified falsifiers, locked before outcome access
text: The plaque-remodeling coordination theory pre-specifies, for each stage, a load-bearing set, a
  negative-modality blocker set, a measurement model, and decision thresholds BEFORE outcome data is seen, and
  explicitly bars redefining the measurement model or thresholds after a result "merely to rescue the current
  architecture." Seventeen named falsifiers (F1-F17) are enumerated as the operational test battery.
verbatim: 'Once 𝑀𝑠 and 𝑇𝑠 pass their pre-specified adequacy rules, they cannot be redefined after the result
  merely to rescue the current architecture.'
