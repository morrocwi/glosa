id: kc-he-013
kind: rule
title: Cellular Aging paper — falsifiable constraints derived without pathway-specific or clinical claims
text: The paper builds a constraints-first architecture treating cellular aging as accumulation of irreversible
  records under finite causal memory, explicitly stating it does NOT propose molecular pathways or therapeutic
  mechanisms, and derives falsifiable constraints on cellular time-series data while withholding pathway-level
  or clinical claims the underlying constraints do not license.
verbatim: "Rather than proposing molecular pathways or therapeutic mechanisms, the work makes explicit a set of
  admissibility conditions already implicit in successful cellular models. [...] The framework yields
  falsifiable constraints on cellular time-series data without pathway-specific or clinical claims."
source:
  doi: 10.5281/zenodo.18212478
  title: "Cellular Aging as Irreversible Record Accumulation under Finite Causal Memory"
  year: 2026
