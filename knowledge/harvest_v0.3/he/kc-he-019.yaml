id: kc-he-019
kind: rule
title: Systemic Repair Capacity Theory — explicit no-novelty-at-mechanism-level claim, novelty scoped to architecture only
text: The paper states plainly that it does NOT claim novelty at the level of individual biological mechanisms
  (vagus nerve, lymphatic system, glymphatic exchange, etc. are all already established) and scopes its own
  contribution narrowly to the architectural/epistemological act of integrating known mechanisms into one
  repair-capacity model plus a measurement strategy, rather than letting integration read as mechanism discovery.
verbatim: "The theory does not claim novelty at the level of individual biological mechanisms; the vagus nerve,
  the lymphatic system, glymphatic exchange, neuroimmune signaling, interoception, and circadian metabolism are
  all established. Its contribution is architectural and epistemological."
source:
