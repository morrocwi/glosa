id: kc-he-001
kind: method
title: Referral governance — separating clinical decision, information transfer, and payment authorization
text: A policy working paper on Thailand's expired-referral problem proposes governance design that splits
  three distinct functions (clinical necessity, data transfer, payment approval) so a single administrative
  failure (an expired referral slip) cannot silently override an unchanged clinical need. The author explicitly
  flags the equations/DAG/simulated impacts as testable proposals, not proven results, and the sentinel case as
  a failure-mode finder, not an incidence rate or liability finding, speaking from a social-enterprise/citizen
  standpoint rather than a medical or legal one.
verbatim: 'Status (EN): conceptual and policy working paper proposing a referral-governance design for Thailand
  that separates clinical decision, information transfer, and payment authorization; not an empirical result,
  not a legal determination; equations/DAG/simulations are proposals for testing. Not peer reviewed.'
