id: kc-he-007
kind: method
title: CPRMH — versioned living-evidence object with machine-assisted retrieval plus mandatory human adjudication
text: The paper specifies each load-bearing claim as a structured, versionable record (claim text, locked
  parameters, evidence layer, supporting/discordant studies, kill condition) maintained as a "living evidence
  object" rather than a static citation list, and states plainly that automated literature retrieval can assist
  but cannot replace human adjudication, because keyword-based harm detection both over-flags and under-detects.
verbatim: "Automated literature retrieval can assist this process but cannot replace human adjudication:
  conservative keyword-based harm detection can over-flag background sentences, while genuine discordant
  signals can otherwise be missed. The desired workflow is therefore machine-assisted retrieval + human reading
  + versioned adjudication."
