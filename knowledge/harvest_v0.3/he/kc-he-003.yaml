base_justification: Matches the base "legal ≠ epistemic, credential ≠ warrant" discipline in spirit — a
  non-clinician standpoint does not borrow clinical authority; it cites clinical evidence and stops short of
  clinical action, consistent with kc-base-008's evidence-vs-convention separation.
