id: kc-he-003
kind: rule
title: T-PHE — practitioner standpoint paired with a cited tier-one evidence dossier, no clinical recommendation
text: A practitioner-led (social-enterprise, not clinician) programme-theory paper for premarital health
  education explicitly pairs every claim with cited medical-science evidence in a separate tier-one dossier
  (search cut-off dated) and refuses to issue clinical recommendations itself. This is a worked separation of
  standpoint (who is speaking) from evidence-grounding (what backs the claim) and from action authority (what
  may be recommended).
verbatim: "Standpoint: social-enterprise practitioner (ARAYA Nikah Social Enterprise, Bangkok), not a clinician;
  the paper pairs every claim with the cited medical-science evidence and makes no clinical recommendation."
source:
  doi: 10.5281/zenodo.22302161
