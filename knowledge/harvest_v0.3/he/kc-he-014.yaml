id: kc-he-014
kind: definition
title: Causal Psychology — apparent psychological failure reframed as environmental impossibility, not individual deficiency
text: The framework repositions the mind as a predictive, resource-bounded system operating under finite causal
  access, anatomical constraints, and temporal uncertainty, and explicitly does not propose new diagnoses or
  therapies — instead asking under what causal conditions a mind can operate at all, so that "failure" can be
  read as environmental impossibility rather than a deficiency internal to the person.
verbatim: "Rather than proposing new diagnoses or therapies, the framework repositions the mind as a predictive,
  resource-bounded system whose apparent failures often reflect environmental impossibility rather than
  individual deficiency."
