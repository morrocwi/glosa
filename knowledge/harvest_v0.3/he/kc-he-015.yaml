id: kc-he-015
kind: rule
title: Life as Hazard Management — nondiagnostic white paper, no new biological constants or clinical prescriptions
text: The white paper offers a structural view of living systems as hazard-managers over time, translated into
  two everyday control classes (reset, rhythm), while explicitly stating the document is nondiagnostic and does
  not propose new biological constants or clinical prescriptions — its stated purpose is a shared
  interdisciplinary vocabulary, not a claim to new measured quantities.
verbatim: "This document is nondiagnostic and does not propose new biological constants or clinical
  prescriptions; its purpose is to provide a shared interdisciplinary language for biology and health practice."
