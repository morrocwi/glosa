base_justification: Recording a numeric prior and binary failure criteria BEFORE checking external data is a
  concrete instance of the Fail-Able Gate Law (kc-base-008) — a passing control alone would not suffice, a
  failing criterion is pre-declared.
glosa_use: adopt
glosa_target: "FOUNDATION §7.3 Bounded-Judge Law and §3.3 Kernel gate rules"
notes: Worth citing as a real external "lock a prediction, then check it" mechanism glosa's own gate design
  could point to as precedent, distinct from glosa's own internal registration mechanism.
