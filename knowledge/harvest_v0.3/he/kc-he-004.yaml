id: kc-he-004
kind: method
title: RRHM Open Lab — sealed prediction package with an independent reproduction and a recorded prior
text: A computational companion repo "seals" a frozen, falsifiable numeric prediction against a named external
  dataset (Staveland et al. 2026) before that data is used for confirmation, records the prior probability
  explicitly (0.45) and binary failure criteria in a frozen text, and separately reports an independent
  reproduction of the original paper's own coefficient as a distinct check from the new prediction.
verbatim: 'Seals targets/staveland_2026 — an operationally frozen, falsifiable prediction about the public data
  of Staveland et al., Nature Communications 2026 (doi:10.1038/s41467-026-70287-5): a task-geometry
  escape-recoverability margin is predicted to add out-of-sample information about turnaround timing (recorded
  prior 0.45; binary failure criteria in the frozen text). Includes an independent reproduction of the paper''s
  turnaround-by-reward coefficient (0.1114 vs original 0.1115) from the publisher Source Data.'
source:
