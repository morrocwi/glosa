id: kc-ai-021
kind: tool
title: CMG-F — diagnostic, non-optimizing structural graph fingerprinting
text: 'Specifies an AI-implementable, domain-agnostic pipeline (CMG-F) for structural graph analysis under finite-response
  constraints: canonical inputs, deterministic construction, structural fingerprints (inverse participation ratio,
  spectral gaps, localization indices), boundary-aware evaluation. Explicitly diagnostic, not optimizing — it does
  not train models or tune parameters against targets.'
verbatim: 'The framework is diagnostic rather than optimizing: it does not train models, tune parameters against
  targets, or claim predictive validity beyond structural constraints. Instead, CMG-F provides a reproducible protocol
  for computing graph fingerprints... and evaluating ensemble performance under quantile-based boundary criteria.'
