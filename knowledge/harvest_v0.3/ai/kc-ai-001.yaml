title: The Readout Condition — Existence/Attribution/Disclosure norm
text: 'Defines the Readout Condition: a three-part norm (Existence, Attribution, Disclosure) that any claim-level
  distinction must satisfy to carry epistemic warrant — it must have a provenance path, be licensed by the source
  it is credited to, and any essential augmentation beyond that source must stay declared/recoverable in an audit.'
verbatim: 'Principle 1 (Existence). Every claim-level distinction that bears epistemic weight must have an epistemic
  provenance path.

  Principle 2 (Attribution). If a claim attributes a distinction to a source S, then S must license that distinction
  under the relevant access condition.

  Principle 3 (Disclosure). If a distinction depends essentially on an augmentation beyond the attributed source,
  that augmentation must remain declared or recoverable in an epistemic audit.

  The conjunction is the Readout Condition.'
