title: Claim card as substitute for institutional certification (three propositions)
text: States as three falsifiable propositions (not demonstrated results) that a claim card recording what was observed
  / what data separates / what AI supplied / what is assumed / what independent check it survived, bound to the
  Existence-Attribution-Disclosure norm and passed through a named independence ladder (I0 self-check through I5
  outside human review), could carry a checkable-rigour property historically requiring a university, lab, or research
  team.
verbatim: 'This paper states, as three falsifiable propositions and not as demonstrated results, a candidate answer:
  a claim card that separately records what was seen, what the data separates, what AI filled in, what is assumed,
  and what independent check (if any) the claim has survived — bound to a formal Existence–Attribution–Disclosure
  norm and passed through a named independence ladder (I0 self-check through I5 outside human review) before public
  release — could carry the checkable property'
