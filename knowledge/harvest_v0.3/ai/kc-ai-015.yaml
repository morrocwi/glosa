id: kc-ai-015
kind: claim
title: Knowledge history as succession of authorized interpretive agencies
text: Argues civilizational knowledge history is not only accumulation of truths but succession of agencies authorized
  to interpret the world's signals and stabilize interpretations as social reality; traces interpretive authority
  from embodied/oral interpreters through priestly/archival regimes, philosophical and scientific institutions,
  to platforms/algorithms/AI-mediated systems; knowledge crises are often authority crises.
verbatim: 'What changes across civilizations is not only the accumulation of truths, but the succession of agencies
  authorized to interpret the world''s signals and stabilize those interpretations as social reality... Its central
  claim is that knowledge crises are often authority crises: moments in which the legitimacy of interpreters is
  contested'
