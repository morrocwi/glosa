id: kc-ai-007
kind: claim
title: Controlled epistemic chain reaction and the k_epi multiplication factor
text: 'Paper IV of the Bounded Knower sequence: proposes that the strongest human-AI augmentation is not one-shot
  idea generation but a controlled chain reaction — a human retains the problem/question while AI processes recursively
  decompose it, traverse distant knowledge structures, generate and critique candidate relations, collapse readout-equivalent
  variants, and propagate only candidates that clear declared grounding/discriminability gates. A finite multiplication
  factor k_epi counts the propagated frontier.'
verbatim: 'this manuscript proposes a controlled epistemic chain reaction: a human retains the problem and question,
  while heterogeneous AI processes recursively decompose the question, traverse distant knowledge structures, generate
  candidate relations, critique them, collapse readout-equivalent variants, and propagate only new candidate classes
  that clear declared grounding and discriminability gates.'
