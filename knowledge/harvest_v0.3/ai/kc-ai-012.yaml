kind: claim
title: Human LoRA Factorization Thesis — bounded-rank experiential update
text: 'Cross-level identity claim: an experience, first-person a bounded embodied appearance and third-person a
  selective transformation of the observer, is developed inside a finite-discrete readout framework (finite retained
  differences on a finite graph, n in N, rational matrices, no continuum limit). If update factors through an active
  readout space of dimension m inside an organization of dimension d, with m<d, event-level change is low-rank —
  the Human LoRA Factorization Thesis.'
verbatim: 'The argument is developed inside a finite-discrete readout framework: every accessible state is a finite
  retained difference on a finite graph; time is indexed by n ∈ N; formal state and update matrices are rational;
  and no continuum limit is required. If an experience-mediated update factors through an active readout space of
  dimension m inside an operational organization of dimension d, then its update rank is bounded by m. Under the
  finite-bottleneck condition m < d, event-level change is low-rank.'
