id: kc-ai-004
kind: rule
title: 'Two constraints replacing knower-fetishism: channel over face'
text: 'Proposes two constraints to replace face-based epistemic crediting: (1) provenance matters only through an
  identifiable epistemic channel, never through the identity of the producer as such; (2) source metadata must never
  be identified with the epistemic role for which it is merely a proxy (e.g. ''human-authored'' standing in for
  ''reliable'', when the two can come apart).'
verbatim: 'the paper... proposes two constraints: provenance matters only through an identifiable epistemic channel,
  and source metadata must never be identified with the epistemic role for which it is merely a proxy.'
