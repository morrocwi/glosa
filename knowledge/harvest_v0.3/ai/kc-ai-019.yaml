id: kc-ai-019
kind: claim
title: Information access vs context access — AI does not reconstruct situational conditions
text: Distinguishes event-specific context (the real-world event's situational/temporal/relational/agency-bearing
  conditions) from interpretive context available to human agents; argues AI substantially expands access to interpreted
  information and linguistic synthesis but does NOT reconstruct the full situational conditions of events — a structural
  distinction between information access and context access.
verbatim: 'It argues that while AI systems substantially expand access to interpreted information and linguistic
  synthesis, they do not reconstruct the full situational, temporal, relational, and agency-bearing conditions of
  events. The contribution is fourfold: (i) a structural distinction between information access and context access'
