id: kc-ai-003
kind: definition
title: Possession–Constitution Collapse and knower fetishism
text: Names a slide from a claim about knowledge-possession (knowing is a state of a subject) to an undefended claim
  about the constitution of epistemic value (content/process/record only counts through a human-like knower). The
  social form of that slide is 'knower fetishism' — an earned relation among evidence, reliability, accountability,
  and inquiry misread as an intrinsic property of the recognized knower.
verbatim: 'I argue that modern epistemology often slides from a plausible claim about the possession of knowledge
  — that knowing is a state or standing of a subject — to a much stronger and usually undefended claim about the
  constitution of epistemic value — that epistemically significant content, processes, records, or sources acquire
  standing only through a human or human-like knower. I call this the Possession–Constitution Collapse. Its social
  form is knower fetishism: the conversion of an earned relation among evidence, reliability, accountability, and
  inquiry into an apparently intrinsic property of the recognized knower.'
