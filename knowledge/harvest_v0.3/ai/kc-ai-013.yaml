id: kc-ai-013
kind: claim
title: AI expands potential only under disciplined revision (constraint-first epistemology)
text: Argues AI expands human potential — rather than merely accelerating output — only when machine-mediated dissonance
  becomes disciplined revision under world-answerable conditions, requiring corrigibility, route-openness, criticizability,
  and domain-sensitive validation. AI can accelerate candidate generation and reframing but cannot itself certify
  truth, remove mediation, or replace target-domain assessment.
verbatim: AI expands human potential only when machine-mediated dissonance becomes disciplined revision under world-answerable
  conditions. This requires corrigibility, route-openness, criticizability, and domain-sensitive validation. AI
  can accelerate candidate generation, comparison, and conceptual reframing, but it cannot by itself certify truth,
  remove irreducible mediation, or replace target-domain assessment.
