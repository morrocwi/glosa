id: kc-ai-010
kind: method
title: MOCA — Readout Condition applied to mission-attributable sacrifice
text: 'Specifies a calculation architecture answering, for a social enterprise: given declared mission, state, feasible
  actions, evidence base and horizon, which choices/sacrifices/allocations are mission-attributable, what binding
  mechanisms hold the mission, and which conclusions are actually identified by the available readouts (as opposed
  to merely asserted). Explicitly anchored in the Readout Condition''s provenance/attribution norm.'
verbatim: 'It specifies a calculation architecture for a narrower operational question: given a declared mission,
  organizational state, feasible actions, evidence base, and time horizon, what choices are admissible, what private
  economic opportunities and sacrifices are mission-attributable, what binding mechanisms hold the mission, whether
  the enterprise remains viable, and which of those conclusions are actually identified by the available readouts?'
