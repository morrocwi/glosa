kind: method
title: Readout Condition — defeater-routing and the identification ladder
text: 'Beyond the three-part norm, the paper gives a machinery for handling non-exact cases: pointwise licensing
  for non-transitive indiscriminability (blocks illicit transitive closure), a Blackwell-garbling access audit for
  stochastic settings plus a complementary identification ladder, and a defeater-routing result — source-specific
  defeaters propagate only along the distinctions that actually depend on that source.'
verbatim: 'For non-transitive indiscriminability, the correct extension is pointwise: a claim token at an actual
  alternative is licensed only if its local indiscriminability neighbourhood lies inside the claim-value fiber,
  avoiding an illicit transitive closure. In stochastic settings, Blackwell garbling provides an access audit but
  cannot by itself detect assumption-driven silent lifts; a complementary identification ladder tracks the weakest
  augmentation layer at which a distinction becomes identified.'
