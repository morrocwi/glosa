id: kc-ai-018
kind: claim
title: 'Structural law: learning shifts from accumulation to discrimination under abundance'
text: 'Argues AI-driven near-zero-cost generation of coherent expression produces a structural (not merely pedagogical)
  law: degradation of inferential signals, escalating conceptual volatility, and selective stabilization; beyond
  a critical generative-exposure threshold, learning undergoes a regime shift from accumulation to discrimination
  — learning redefined as preserving structural stability once expressive output no longer uniquely indicates internal
  organization.'
verbatim: Beyond a critical threshold of generative exposure, learning undergoes a regime shift — from accumulation
  to discrimination. Learning is therefore redefined as the capacity to preserve structural stability when expressive
  production no longer uniquely indicates internal organization.
