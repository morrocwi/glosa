id: kc-ai-022
kind: claim
title: Causal Guardrails — pre-linguistic admissibility checks against hallucination/sycophancy
text: Diagnoses LLM failure modes (hallucination, sycophancy, context drift, instability) as expected consequences
  of finite agency operating without explicit causal-admissibility constraints, not merely training/alignment defects;
  introduces Causal Guardrails enforcing pre-linguistic admissibility checks prior to generation (internal causal
  state, available agency, invariant meaning constraints), plus adversarial stress analysis and 'causal compression'
  as the architectural patch for endurance without fabrication.
verbatim: 'This paper advances a structural diagnosis: such failures are expected consequences of finite agency
  operating without explicit constraints on causal admissibility. We introduce Causal Guardrails, an architectural
  framework that enforces pre-linguistic admissibility checks prior to language generation... and propose causal
  compression as the architectural patch for endurance without fabrication.'
