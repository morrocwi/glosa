id: kc-ai-025
kind: claim
title: Language as cognitive infrastructure — Elective Connectivity mechanism
text: Proposes a three-stage mechanism (Elective Connectivity, Capability Activation, Reflexive Reconfiguration)
  under which language functions as cognitive infrastructure activating organizational linguistic capital when LLM
  connection is elective and governed, dialogic prompting surfaces tacit knowledge, and reflective insights get
  institutionalized; explicitly conceptual-reflective synthesis, no empirical claims made.
verbatim: Language can function as cognitive infrastructure when (i) connection to LLMs is elective and governed,
  (ii) dialogic prompting routines surface tacit knowledge and align values, and (iii) reflective insights are institutionalized
  into policies and processes.
