id: kc-ai-011
kind: definition
title: Standalone Scholar — dual-track architecture (synthetic plurality vs validation)
text: 'Names the condition where AI makes plausible scholarly output abundant before independent criticism, human
  relationships, certification and institutional access become abundant, and proposes a dual-track architecture:
  AI-assisted formation/preprint staging/provenance controls produce defensible provisional assets, while independent
  human friction and review convert those into socially stress-tested knowledge — distinguishing synthetic plurality
  from independent validation, and legitimacy from truth.'
verbatim: the production of plausible scholarly objects can become abundant before independent criticism, human
  relationships, certification, and institutional access become abundant... It develops a dual-track architecture
  in which AI-assisted formation, open preprint staging, provenance controls, and machine-constrained checks generate
  defensible provisional assets, while independent human friction, repeat correspondence, journal review, and local
  epistemic participation convert those assets into socially stress-tested knowledge.
