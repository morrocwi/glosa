title: Bounded dynamic semantic mobility for hypothesis generation
text: 'Paper I of the Bounded Knower sequence: proposes modeling hypothesis-generating imagination as bounded dynamic
  semantic mobility — not an infinite faculty and not a static reachable set, but a time-indexed process over semantic
  readouts whose transitions are provenance-audited, dynamically weighted, and history-sensitive, situated in a
  readout-discriminable hypothesis space.'
