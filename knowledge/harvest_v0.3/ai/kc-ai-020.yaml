id: kc-ai-020
kind: method
title: Admissibility-first AI-coached planning with explicit no-go conditions
text: Specifies a minimal, conservative AI-coached training-planning framework (74 runners, 42,766 training days)
  whose objective is admissible scheduling under finite recovery, not prediction or optimization; derives explicit
  no-go conditions that invalidate unsafe plans from causal-spectral master equations, with all optimization layers
  modular/optional and never weakening the conservative safety guarantee.
verbatim: The objective is not injury prediction or performance optimization, but admissible scheduling under finite
  recovery and delayed adaptation. We formalize load–recovery dynamics using a small set of causal–spectral master
  equations, derive explicit no-go conditions that invalidate unsafe plans... The framework is explicitly admissibility-first.
