id: kc-islam-003
kind: claim
title: Functional sacralization of fiqh — human determinations acquiring practical sacred-normativity when institutions make dissent costly
text: The paper's structured evidence review names a recurrent transregional mechanism, "functional
  sacralization of fiqh" — human juristic determinations can acquire the practical weight of sacred normativity
  once religious attribution combines with legal, political, organizational, or communal mechanisms that make
  dissent costly, deviant, or institutionally inaudible. Documented across several national settings, explicitly
  not asserted as a universal or identical-belief claim.
verbatim: '...this article terms functional sacralization of fiqh: human juristic determinations may acquire
  practical attributes of sacred normativity when religious attribution is combined with legal, political,
  organizational, or communal mechanisms that make dissent costly, deviant, or institutionally inaudible.'
