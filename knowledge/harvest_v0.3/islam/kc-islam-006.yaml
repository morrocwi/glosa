id: kc-islam-006
kind: method
title: Every doctrine states the conditions under which it would be defeated
text: A constructive-theology manuscript states, for each of its five main doctrinal claims, the explicit
  conditions that would count as defeating it — a falsifiability-style discipline applied in a normative/
  theological register rather than an empirical one. The manuscript also explicitly declares it supersedes
  material first circulated in four unpublished preprints by the same author, naming which sections are new.
verbatim: "The maḥall thesis holds that a formally valid judgment may be structurally precluded from bearing
  wisdom (ḥikma) when what the case entrusted has not been carried, and is tested against three cases... For
  every doctrine, the article states the conditions under which it would be defeated."
