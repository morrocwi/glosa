base_relation: holds
base_justification: "'Asymmetric revisability' is a domain-specific name for exactly what the base's Fail-Able
  Gate Law and Bounded-Judge Law (kc-base-008, kc-base-035) are built to prevent — a claim that has stopped
  being checkable against evidence; the two frameworks reach the same warning from different vocabularies."
glosa_use: adopt
glosa_target: "FOUNDATION §4.2 Independence Ladder / §7.3 Bounded-Judge Law — 'asymmetric revisability' is a
  usable term for a glosa red-flag (a claim whose challengers face rising cost while its holders face none)."
