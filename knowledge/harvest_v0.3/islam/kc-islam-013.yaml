id: kc-islam-013
kind: tool
title: Statistical dataset compiled from named sources, explicitly excludes interpretive analysis
text: A structured statistical dataset on Muslim/Malaysia-origin tourism to Thailand, compiled from named
  official sources (TAT, Mastercard & CrescentRating, Pew Research Center, DinarStandard, Malaysian/Gulf
  statistics), covering arrivals, population ratios, religiosity levels, and destination coordinates. States
  explicitly it carries no behavioral or interpretive analysis, offered as a transparent structured resource
  for researchers and planners.
verbatim: 'The dataset includes country-wise arrivals, Muslim population ratios, levels of religious
  observance, and province-level destination coordinates within Thailand. No behavioral or interpretive
  analysis is included. The purpose is to provide a transparent, structured dataset for researchers and
  tourism planners.'
