id: kc-islam-002
kind: claim
title: Revelation is not fallible; the human juristic determination of it is — distinguishing revelation from juristic readouts
text: The paper's foundational architecture separates revelation itself (held infallible within the tradition)
  from the human juristic determination of it — "fiqh is a human juristic determination of divine normativity,
  not revelation itself." Scholarly epistemic authority, adjudicative authority, and political authority are
  kept as distinct, non-identical human trusts, each answerable to revelation but none equal to it; consultation
  never extinguishes the acting agent's own moral responsibility.
verbatim: 'Its foundational thesis is deliberately strong: fiqh is a human juristic determination of divine
  normativity, not revelation itself. This does not secularize fiqh or diminish its authority; it states the
  very condition under which ijtihād can be rewarded when correct and still rewarded when it errs.'
source:
