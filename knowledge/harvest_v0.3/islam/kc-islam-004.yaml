id: kc-islam-004
kind: claim
title: AI-mediated society risks the human forgetting their own status as chooser and responsibility-bearer
text: A national-conference presentation argues that in an AI-mediated society, the primary risk is the human
  forgetting their own status as the one who chooses and who bears responsibility for the choice — not the AI
  system replacing that role. Slides accompanying a full English companion paper; not itself a peer-reviewed
  article.
verbatim: "Artificial Intelligence and the Civilization of Knowledge — forgetting the human's status as chooser
  and the human's responsibility in an AI-mediated society... Companion English paper: The Civilization of
  Knowledge: Who Has the Authority to Interpret the World (10.5281/zenodo.18943971)."
