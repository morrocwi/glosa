id: kc-islam-015
kind: method
title: Cultural-Based Practitioners framework converts faith/cultural capital into verifiable social and economic value
text: Introduces a Cultural-Based Practitioner (CBP) framework — cultural skills, cultural bridging, cultural
  governance — as a method for transforming faith-based and cultural capital into value that can be verified,
  illustrated by case studies across three countries, positioning faith as a foundation for service-system
  design rather than an obstacle to it.
verbatim: 'The paper introduces the CBP framework, integrating cultural skills, cultural bridging, and cultural
  governance to form a Living Soft Infrastructure — a model for transforming faith-based and cultural capital
  into verifiable social and economic value.'
