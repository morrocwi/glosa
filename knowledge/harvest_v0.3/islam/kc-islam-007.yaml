kind: method
title: Power-literate satire framework offered as analytical tool, not normative verdict
text: An anonymized case study of one public incident is used to build a diagnostic framework
  ("power-literate satire") distinguishing critique of specific conduct by identifiable actors with power from
  critique that converts a marginalized identity into collective stigma. The author explicitly limits the
  claim's status — the framework is an analytical tool, not a normative verdict on the case it was built from.
verbatim: 'The framework is offered as an analytical tool, not a normative verdict.'
