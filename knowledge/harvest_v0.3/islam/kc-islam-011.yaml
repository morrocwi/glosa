id: kc-islam-011
kind: claim
title: Premature category stabilization — provider-defined service templates precede and distort the diversity they claim to serve
text: Origin paper for the "premature category stabilization" mechanism — the early reduction of heterogeneous
  Muslim travelers into rigid, provider-defined service categories, which then shapes service templates and
  promise-framing in ways that produce expectation mismatch and trust erosion, rather than certification alone
  building trust.
verbatim: 'This article argues that a central source of underperformance lies in premature category
  stabilization: the early reduction of diverse Muslim travelers into rigid, provider-defined service
  categories.'
