id: kc-tourism-003
kind: method
title: Explicit 'proves vs. still cannot explain' gap statement before advancing a new mechanism
text: Before introducing its own contribution, the paper names precisely what the existing literature has
  established (two named points) and precisely what it has not yet explained (the provider-side interpretive
  process), and only then states that this named gap is where the new article intervenes. This is a disclosed
  literature-gap move, distinct from simply asserting novelty.
verbatim: "Taken together, the field foundations discussed above prove two important points... At the same
  time, this literature still leaves an important explanatory gap. It does not yet fully explain why visible
  assurance sometimes fails to become deeper trust, nor does it sufficiently theorize how operators internally
  construct the Muslim traveler as a service object... This is precisely where the present article intervenes."
