id: kc-tourism-006
kind: claim
title: Cultural-Based Practitioner framework built from cross-national case studies, not a single-site claim
text: Proposes a Cultural-Based Practitioner (CBP) framework for actors operating at the intersection of state,
  market, and religion, evidenced through comparative case studies across three named jurisdictions (Thailand,
  Singapore, Taiwan) rather than a single-site or single-country claim.
verbatim: "The paper introduces the CBP framework, integrating cultural skills, cultural bridging, and cultural
  governance to form a Living Soft Infrastructure—a model for transforming faith-based and cultural capital
  into verifiable social and economic value. Case studies from Thailand, Singapore, and Taiwan demonstrate how
  individual, institutional, and state-level practitioners can sustain coexistence through transparency,
  justice, and shared ethical values."
