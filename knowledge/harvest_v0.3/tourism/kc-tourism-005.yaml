id: kc-tourism-005
kind: method
title: Statistical dataset sourced from named third-party institutions, analysis explicitly withheld
text: Compiles Muslim-relevant and Malaysia-origin tourism statistics for Thailand from five named
  institutional sources (TAT, Mastercard & CrescentRating GMTI, Pew Research Center, DinarStandard SGIE,
  Malaysian/Gulf statistical bodies), and states no behavioral or interpretive analysis is included — the
  stated purpose is a transparent structured dataset for others to analyze, not a pre-analyzed finding.
verbatim: "This paper presents a verified dataset related to Muslim-relevant and Malaysia-origin tourism to
  Thailand between 2024 and 2025, including GCC-region Muslim visitors. It compiles official data from the
  Tourism Authority of Thailand (TAT), Mastercard & CrescentRating (GMTI 2025), Pew Research Center,
  DinarStandard (SGIE 2024/25), and Malaysian and Gulf statistical sources... No behavioral or interpretive
  analysis is included. The purpose is to provide a transparent, structured dataset for researchers and
  tourism planners."
