id: kc-tourism-002
kind: claim
title: Premature category stabilization — provider-side interpretation as the mechanism, not certification sufficiency
text: Reframes underperformance in Muslim-friendly tourism as a category-stabilization problem (providers freeze
  diverse travelers into rigid service categories too early) rather than a certification-sufficiency problem,
  and proposes a readiness-first, interaction-sensitive, segment-specific governance model as the methodological
  alternative to certification-first approaches.
verbatim: "This article argues that a central source of underperformance lies in premature category
  stabilization: the early reduction of diverse Muslim travelers into rigid, provider-defined service
  categories. It proposes a mechanism in which provider-centered category projection shapes service templates,
  promise framing, and interactional conduct in ways that generate expectation mismatch, relational
  miscalibration, and trust erosion across the tourism journey."
