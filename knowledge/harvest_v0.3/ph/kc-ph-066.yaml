verbatim: 'Mass as a Structural Necessity of Finite-Speed Causal Transport This work argues that mass is not an
  arbitrary input but a structural consequence of finite-speed, causal, and stable transport dynamics. Under
  these constraints, the only admissible evolution law is the telegraph form, which maps into a Klein–Gordon
  field with a strictly positive mass gap—without inserting a mass by hand. The light-cone (causality) is
  preserved under minimal gauge coupling, and one-loop on-shell renormalization retains both the cone and the
  positive gap. In short: mass appears because causality and stability leave nature'
