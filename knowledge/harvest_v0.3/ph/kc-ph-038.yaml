verbatim: 'This Stage II manuscript delivers a scopetight, dimensionally sealed NEIP closed form that unifies: (i) a
  covariant scalar with comoving linear damping and a scalelog moderator embedded in the S2 covariant
  derivative, (ii) a Lyapunov energy decay identity under perfect-conductor boundaries, and (iii) a
  meandamping closure that maps dissipative power to a time-varying cosmological term via the factor 8πG/c4 .
  The main text adopts the background-field regime (no Maxwell evolution, no compensating current), which
  suffices to prove Lyapunov decay and pass the V1V6 dimensional checks. For completeness and Stage III'
