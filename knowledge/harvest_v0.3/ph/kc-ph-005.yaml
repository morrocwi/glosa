verbatim: 'The MUS/Epistemic framework introduces a minimal extension to standard physics via a coherence-valued
  scalar field C(x,t) that couples to both gravitational and quantum sectors through well-defined interaction
  terms. This framework quantitatively resolves five major anomalies: the Hubble tension by modifying
  late-time expansion through C-field contributions to the stress-energy tensor; the muon g-2 anomaly via
  C-mediated loop corrections to the magnetic moment; the JWST early massive galaxy problem by enhancing
  structure formation rates through C-field driven gravitational instability; the primordial lithium
  discrepancy by shifting nuclear reaction resonances during Big Bang Nucleosynthesis;'
