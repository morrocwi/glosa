verbatim: 'We compute the k lowest eigenvalues of the generalized banded symmetric problem Kx = λ Mx by bisection on
  the inertia of the pencil shift K − σ M, evaluated by a banded LDL⊤ factorization in O(nb2 ) work per shift.
  No Cholesky factor of M, no congruence transform, and no tridiagonal form is ever constructed. The method is
  simultaneously faster and more accurate than the reduction-based route, and for the same reason: the
