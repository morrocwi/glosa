verbatim: 'This paper offers a new picture of Newtonian gravity: it emerges from three tangible, minimal ingredients—
  (1) a conserved, transportable physical “information” content; (2) a transport law with a finite response
  speed (no instantaneous spreading); and (3) a Poisson-type link that ties the “intensity of information” to
  a dimensionless potential. Assembled systematically, these yield the familiar Newtonian potential in the
  weak-field, quasi-static regime—without touching or modifying general relativity. The contribution is not
  just a concept but a method. A finite relaxation time in the transport dynamics produces wavefronts that
  move'
