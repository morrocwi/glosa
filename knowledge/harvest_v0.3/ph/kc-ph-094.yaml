verbatim: We frame TF/BTFR as correlations between two coarse-grainings of a common history—light as a short-term
  report, gravity as a long-term ledger. We extend local kernels to spatiotemporal diffusion (including
  fractional order) so that accumulated memory propagates to large radii and sustains extended flat curves. To
  avoid overfitting we adopt a minimal parameterization with hierarchical Bayesian priors and provide a
  real-data fitting protocol (SPARC/IFS) with ∆AIC/∆BIC comparisons to NFW and MOND. Key falsifiable
  signatures include residual–history correlations, phase lags ∼ τ , diffusion-length control of the flat
  extent, and outer-slope diagnostics
