verbatim: 'Conventional measures of quantum complexity are difficult to connect to finite-precision observables across
  different physical domains. We propose a complementary notion of physical complexity based on causal memory:
  the microscopic time scale τ micro c that limits how fast a system can update under perturbation. Mass and
  causal memory are linked by the identity m = ℏ/(2c 2 τ micro c ), and low-energy response is governed by
  telegraph-type equations. Complexity Physics 2.0 is defined by four axioms. Global complexity is the
  dimensionless depth C(t) = t/τ micro c .'
