verbatim: 'This note accompanies our theoretical remark on the old, polluted white dwarf LSPM J0207+3331. The core
  observational paradox is well-known: a cool white dwarf with a cooling age of $\approx 3$ Gyr continues to
  exhibit significant heavy-element pollution (Fe, Si, Ca), orders of magnitude longer than standard
  gravitational settling timescales ($10^6-10^7$ yr) would permit. The standard conclusion is that the star
  must be undergoing continuous, long-lived accretion from a circumstellar debris disk. Our remark accepts
  this premise but focuses on the physical interpretation of its timescale . We propose that'
