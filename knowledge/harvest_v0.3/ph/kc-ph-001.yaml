verbatim: 'Executive Summary: A New Origin for Dark Energy To: Interested Stakeholders From: Yaoharee Lahtee, Cosmo @
  Home Subject: A Testable New Theory for Cosmic Acceleration (Paper 2a) 1. The Problem We Solve One of the
  deepest mysteries in modern physics is "Dark Energy"—a force causing our universe to expand at an
  accelerating rate. The standard model explains this with a "cosmological constant" (Lambda), but this value
  is unexplained, unpredicted, and simply accepted as a fact. It is one of the most profound gaps in our
  understanding of the cosmos. 2.'
