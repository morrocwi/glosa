verbatim: 'Parabolic diffusion equations predict infinite propagation speed, violating relativistic causality—a
  mathematical inconsistency known since Cattaneo’s work in 1948. We address a precise mathematical question:
  within the class of second-order linear constantcoefficient partial differential equations, which structures
  are compatible with both finite propagation speed and asymptotic stability? We prove that the telegraph
  equation is the unique admissible structure satisfying three minimal axioms: finite-speed causality,
  dissipative stability, and source-free dynamics. Furthermore, we establish that these axioms are logically
  independent—none follows from the others. This uniqueness is a theorem of mathematical necessity, not'
