verbatim: The ringdown of perturbed Kerr black holes exhibits exponentially damped oscillations with frequencies and
  decay times that agree with quasinormal mode (QNM) predictions across LIGO– Virgo–KAGRA catalogs. We
  introduce a strictly phenomenological surrogate in which the observed damping time τ220 is reinterpreted as
  an effective causal relaxation time in a Maxwell–Cattaneo (telegraph-type) transport system. Enforcing the
  luminal constraint for the characteristic propagation speed yields the algebraic mapping Dring = c2 τ220,
  which defines an informational diffusivity directly from posterior QNM parameters without modifying general
  relativity, Kerr perturbation theory, or gravitational-wave
