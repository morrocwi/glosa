verbatim: 'This book is an invitation to examine the architecture of physical truth. It asks not “What might be true?”
  but “What must be true?” The answer may be narrower than expected—and that narrowness is the message. If the
  constraints are accepted, the structure follows. If the structure is rejected, some constraint must be
  abandoned. This is the discipline of foundational physics: to trace necessity and distinguish it from
  choice. Yaoharee Lahtee'
