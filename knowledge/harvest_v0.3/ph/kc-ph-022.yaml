verbatim: 'This paper provides a concise, self-contained proof of hypotheses H0--H4 in the $K=32$
  Equation-of-Everything (EoE) framework. We define the HG-free invariant $\CT = \Tcoh\,\alp^{32}$ (H0),
  establish invertibility between $\Tcoh$ and $\alp$ (H1--H2), introduce dimensionless bridge variables (H3),
  and prove the lock criterion $\rholock = \betayc \ge 0.95$ (H4). The proof leverages a sharp threshold $\alp
  \le 0.05/\pi$, with numerical anchors based on the CODATA-2022 fine-structure constant. Dimensional
  consistency, monotonicity, and sensitivity margins are rigorously analyzed. This work links to the broader
  EoE series: Lahtee (2025), \emph{K=32: Equation of Everything}, Zenodo,'
