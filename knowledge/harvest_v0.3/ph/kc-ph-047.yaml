verbatim: Non-Equilibrium Information Physics (NEIP) proposes that the universe is fundamentally composed of
  informational pixels at the Planck scale. Information, not matter or energy, is the primary physical
  quantity. Patterns of information generate potentials; changes in potential induce energetic rearrangements;
  and mass emerges from stable informational density. This note summarizes the core conceptual flow and
  governing equations of NEIP, together with unit definitions and consistency checks with GR, QFT,
  thermodynamics, and causality.
