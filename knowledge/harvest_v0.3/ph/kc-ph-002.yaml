verbatim: 'This paper introduces The Yaoharee Proposal, a conceptual framework that reframes observation as an
  epistemic rather than ontological process. It argues that reality, as encountered, is sustained through
  informational coherence between observers and the systems observed. The framework specifies a three‑tier
  epistemic architecture: Primary Observer — a field-like condition of awareness that makes observables
  possible; Universal Canvas — the total informational manifold of potential configurations; and Secondary
  Observers — localized cognitive or computational renderers that select and sequence experience. Dialoguing
  with quantum cognition (Pothos & Busemeyer, 2022), Integrated Information Theory'
