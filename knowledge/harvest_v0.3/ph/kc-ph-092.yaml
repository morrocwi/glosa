verbatim: 'The three problems share a common structural vulnerability: standard formulations do not enforce temporal
  causality as a binding constraint. By treating an instantaneous state as sufficient for future evolution,
  they allow history-free, arbitrarily fast reconfigurations that real processes cannot realize. This
  idealization makes the dynamics effectively Markovian even where no physical mechanism supports it. That
  latitude fuels familiar tensions. In Yang–Mills theory, a mass gap looks mysterious if low-energy
  configurations are deemed reachable without cumulative cost. In three-dimensional Navier–Stokes, extreme
  concentration is not ruled out when cross-scale transfer is left'
