verbatim: 'This document establishes the epistemological foundations for treating causal informational ordering (CIO)
  as the pre-geometric substrate from which time, change, and physical law emerge. We argue, on purely
  epistemological grounds, that: (i) any empirically accessible physics presupposes a notion of
  distinguishable states and lawful transitions between them; (ii) the ordering induced by such transitions is
  logically prior to geometric notions of time; (iii) this ordering constitutes the minimal structure required
  for physics to be possible at all. The framework does not compete with general relativity or quantum
  mechanics but identies'
