verbatim: 'This document specifies the Causal Memory Graph Framework (CMG-F) as an AIimplementable, domain-agnostic
  pipeline for structural graph analysis under finite-response (causal memory) constraints. CMG-F defines
  canonical inputs, deterministic construction steps, structural fingerprints, and boundary-aware evaluation
  rules that distinguish bounded operational regimes from catastrophic failures. The framework is diagnostic
  rather than optimizing: it does not train models, tune parameters against targets, or claim predictive
  validity beyond structural constraints. Instead, CMG-F provides a reproducible protocol for computing graph
  fingerprints (inverse participation ratio, spectral gaps, localization indices) and evaluating ensemble
  performance under quantile-based'
