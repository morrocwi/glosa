verbatim: This note presents a structural ordering of physical concepts derived from information causal constraints.
  The central insight is that nite admissibility, causal memory, and nite propagation form a single constraint
  bundlethey cannot be imposed separately. From this bundle, geometry, mass, force, and spacetime physics
  emerge as derived structures, not postulates. The ordering is logical, not temporal. Spacetime is
  reinterpreted as a bookkeeping language for causal accessibility, not as fundamental substance.
