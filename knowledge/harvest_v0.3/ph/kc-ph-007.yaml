verbatim: This study proposes a unified informational-coherence framework that bridges physics, cognition, and ethics
  through a general continuity principle. The Coherence Field Equation, expressed as
  \(\frac{∂Ψ}{∂t}=−∇·J+Γ(Ψ^q)\) with \(J=ρD∇Φ_I+J_{fb}−∇B(π)\), extends conservation dynamics into
  informational and moral domains. Within Regulatory Stability Theory (RST), the boundary term \(B(π)\)
  represents reflective regulation that sustains equilibrium. Three core case studies—AI ethics, social
  polarization, and ecological resilience—demonstrate coherence retention across adaptive contexts. Additional
