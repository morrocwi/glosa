  ϕ,...'
verbatim: 'We prove that Scale-Lock, the alignment of phase and frequency to a central cadence Ω0, emerges from
  Lyapunov dissipation (V˙ ≤ 0) in a K-free, local-only framework based on the seed algebra Aε = δ. The proof
  links residual dynamics (ε˙ = −ΛA⊤W(Aε − δ)) to a damped pendulum equation for the locking phase ϕ,
  converging to ϕ = 0. The framework is falsifiable, scale-aware (rad/s), and adheres to FAIR principles and
  CC BY 4.0, with materials at https://github.com/ morrocwi/yaoharee-proposal. Scale-Lock, Lyapunov
  dissipation, seed algebra, phase dynamics, open science'
