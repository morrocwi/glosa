verbatim: This whitepaper upgrades the MUS/Epistemic framework to MU v1.5 , transforming a conceptual proposal into a
  quantitatively testable effective theory . We introduce a minimally coupled C‑field with a stabilizing
  potential, a piecewise activation law that is linear at tiny and saturating at large , and domain‑specific
  source terms that coherently tie nuclear, quantum, astrophysical, and cosmological regimes. A single
  parameter set —calibrated by five independent problems (Hubble tension, muon , JWST early galaxies, BBN/Li/,
