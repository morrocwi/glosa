verbatim: We prove a Lyapunov energy decay theorem for complex scalar fields minimally coupled to U(1) gauge
  potentials in curved spacetime, subject to covariant linear damping. The damping term (1/tau) u^mu D_mu Psi,
  where u^mu is a timelike unit vector and D_mu is the gauge-covariant derivative, preserves local U(1)
  invariance while inducing energy dissipation. We establish rigorously that the total energy functional
  (scalar kinetic plus potential plus electromagnetic) satisfies dE/dt = - integral of ( (1/tau) * |u^mu D_mu
