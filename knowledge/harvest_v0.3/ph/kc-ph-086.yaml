verbatim: 'For researchers working in cosmology and dark energy, this work introduces a Minimal Variational Layer
  designed to isolate the least structure required for consistent energy dynamics. The guiding question is
  deliberately fundamental: if all model-specific assumptions about dark matter, dark energy, or modified
  gravity are stripped away, what is the minimal variational structure that still guarantees energetic
  consistency on a Lorentzian spacetime? To address this question, we construct a Root Lagrangian formulated
  solely in terms of two primitive variables: a local energy density ee e and an associated energy flux'
