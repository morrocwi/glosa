verbatim: This work establishes a phenomenological closure of the fine-structure constant (𝛼) using a universal
  constant coherence time 𝑇⋆coh. Two scale-invariant quantities, Λ𝐸/𝑅 (energy-distance invariant) and Λ𝐸⋅𝑅
  (energy-wavelength invariant), define 𝐺,ℎ, and 𝛼 through dimensionally consistent relations. All predictions
  are testableidentities with falsification criteria (Δ > 1%) and reproducible numerical paths(Appendices C,
  D, E, F). The model reproduces 𝛼obs exactly, yields no measurable drift, and suggests that macroscopic
  regularities (e.g., rotation curves, lensing) may emerge without additional dark-sector parameters.
  Open-science practices include seed=42, SHA256 checksums, YAML manifests, and AI-assisted unit audits.1
