  P1b) about the forthcoming spinning-binary extension...'
verbatim: 'Deterministic, standard-library instruments and frozen reference outputs behind the manuscript ''The Davies
  Point and Black-Hole Merger Remnants''. Contents: the Davies-crossing locus chi*(q) on the Barausse-Rezzolla
  aligned-spin fit; the measure analysis (band fraction 0.049 wide grid vs 0.300 astrophysical box); the
  maxent/NR crossing error budget; two pre-registered falsifiable predictions (P1, P1b) about the forthcoming
  spinning-binary extension of the maximum entropy conjecture (PRL 137, 021406, 2026), with commit-graph
  warrant; an audit brief with per-claim refutation conditions and a standing retraction pledge; a
  chronological logbook including this work''s own corrected errors. One-command verification:'
