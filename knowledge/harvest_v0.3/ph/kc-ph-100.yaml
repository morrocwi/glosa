verbatim: 'Finite propagation constraints are often introduced as dynamical or geometrical features of specific
  physical theories, most notably in relativity. We argue that a stronger, pre-dynamical claim holds: before
  introducing time parameters, metric distance, spacetime geometry, or any specific propagation constant,
  objective causal discourse already demands a nontrivial bound on causal influence. Using a purely
  intervention-based formulation, we demonstrate that unbounded causal reach—meaning every event is
  intervention-accessible from every other event—leads to invariant modal collapse: no observer-independent
  distinction between influenceable and noninfluenceable event pairs survives representational relabelling.
  This no-go result establishes'
