verbatim: 'ABSTRACT We validate that Scale-Lock—phase and frequency alignment to Omega_0—and mass emergence arise from
  Lyapunov dissipation (V_dot <= 0) in a K-free, local-only framework based on the seed algebra A*epsilon =
  delta. A Minimal Viable Simulation (MVS) with TP1 (homogeneous decay) and TP2 (ping-excited lock) confirms
  E_dot_coh <= 0 and discrete quark-like modes. KEY EQUATIONS Phase-Lock: tau*phi_ddot + phi_dot =
  -(1/Omega_0) * d_phi(U_lock) Effective Mass: m_eff = (hbar * Omega_0^2 * tau) / c^2 CONCLUSION & OPEN
  SCIENCE Results align with theory, with no falsification. This work adheres to FAIR'
