verbatim: 'What constitutive memory structures are compatible with causality and passivity under finite resources?
  Starting from two pre-theoretic primitives -- retardation (causal order prior to geometry) and
  finite-resource admissibility -- we prove the Causal Memory Admissibility Theorem (CMAP): a bidirectional
  necessity-and-uniqueness classification of retarded constitutive memory operators on finite records. Under a
  finite-resource admissible class (H1-H4) and five structural gates (P1) retardation, (P2) operator
  passivity, (F1+F2) genuine fading, (N) non-negativity, and (A) diffusive admissibility, admissible memory is
  uniquely constrained to be Completely Monotone Finite-resource (CMF): a non-negative-weight superposition of
  geometric-decay channels,'
