verbatim: 'Causal–Memory Program: Short Talk (Two-Column Boxed) This document addresses a single question throughout:
  the limits of control in the real world . It asks, in simple terms, that if any system has a finite response
  time and if influences within that system cannot propagate instantaneously, which aspects of the system
  remain controllable, and which inevitably fall beyond control. The work does not attempt to explain new
  phenomena, propose new physics, or compete with existing theories. Instead, it organizes a set of
  fundamental considerations that all physical systems necessarily face. When'
