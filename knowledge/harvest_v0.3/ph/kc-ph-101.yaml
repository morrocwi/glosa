verbatim: 'When System Memory Meets a Bottleneck: Why the Most Dangerous Stress Can Be Invisible . We often describe
  the spread of information, signals, or even epidemics using a familiar picture: diffusion, like a drop of
  ink slowly dissolving into water. In this view, obstacles or narrow passages merely slow the flow, but the
  process remains smooth, gradual, and predictable. This intuition is deeply embedded in many physical and
  social models. . Recent simulations under the Telegraph-on-Graph Bottleneck Stress Test (ToG-BST) reveal a
  very different reality once the system has memory,'
