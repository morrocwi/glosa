verbatim: 'Technical Note. We review the standard Newton-to-GR compactness u = 2GM/(Rc2) for static spherical systems
  and introduce three minimal notation-level extensions for cross-domain usage: (i) a generalized compactness
  u(X)gen , (ii) a domain-priority selector, and (iii) a micro-informationalscaling law. All non-standard
  structures are marked *[Assumed]* and introduce no new gravitational physics. Lineage. The notation
  extensions descend from the informational-axiomatic program of Lahtee [1], while the GR sector remains
  textbook Schwarzschild physics.'
