verbatim: 'This short note proposes a conceptual layer—not a complete theory—for thinking about information dynamics
  across very different physical and biological systems. We collect a set ofstructured observations suggesting
  that systems with confined information, non-zero memory time, and finite-speed propagation often exhibit
  similar mathematical structures: a conservation law with input and forgetting, a telegraph-type evolution
  equation for the information current, and a boundary-limited capacity reminiscent of black-hole area laws.
  This research is grounded in the framework of informationism, consistent with Wheeler’s “It from Bit”
