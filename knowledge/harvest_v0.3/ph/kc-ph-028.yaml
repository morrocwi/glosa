verbatim: 'Highlights: L4 Empirical Validation This study provides the first large-scale empirical validation (N=36)
  for a novel theoretical framework (L0–L3) of emergent coherence based on Lyapunov dissipation. Core Finding:
  We demonstrate that in human EEG, informational structure (phase coherence, τφ) persists significantly
  longer than energetic structure (amplitude envelope, τenv). Key Points for Academics & Reviewers: • A
  Testable Theory: We test a core prediction from the L0–L3 Lyapunov–Scale–Lock framework: that any coherent
  system following a dissipative path (Axiom III: V˙ ≤ 0) must exhibit τφ > τenv. • Robust Methodology: We'
