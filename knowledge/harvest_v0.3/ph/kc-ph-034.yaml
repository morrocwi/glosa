verbatim: 'The old, cool white dwarf LSPM J0207+3331, discovered through the Backyard Worlds: Planet 9 project (2019),
  has been reanalyzed using Keck spectroscopy (NASA/Keck, 2025), confirming strong photospheric pollution by
  over a dozen heavy elements (Fe, Si, Ca, Ni, Mg). Such long-lived accretion, over 3 Gyr after the star’s
  nuclear death, implies that its debris ring–white dwarf system constitutes an open, weakly dissipative
  system. We argue that its energy loss follows a long-tail Lyapunov-type relaxation, where dE/dt ≤ 0, E(t) =
  E0e −t/τeff , and τeff ∼ 109 yr. This slow'
