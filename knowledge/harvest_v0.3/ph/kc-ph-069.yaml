verbatim: 'Reframing Naturalness: Could a Black Hole Be “Massless”? Seeing Gravity Through the Lens of Causal Memory
  For decades, theoretical physics has wrestled with deep inconsistencies in how we describe black holes. We
  treat them as “massive objects,” yet several observations refuse to fit neatly into that picture. The
  ringdown signals measured by LIGO last a few milliseconds, while the quantum time-scale one would compute
  from the same black hole is smaller by almost 70 orders of magnitude . General Relativity predicts a
  curvature singularity—usually taken as a sign that something'
