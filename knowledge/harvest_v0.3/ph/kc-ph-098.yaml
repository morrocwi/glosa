verbatim: 'Before the Frame of Reality: Why Time Must Be an Irreversible Causal Record In recent years, the idea of
  viewing reality through the notion of a frame has gained increasing attention across physics, philosophy,
  and information theory. From block-universe interpretations in relativity to correlation-based views of time
  in quantum foundations, many contemporary approaches suggest that reality may be better understood not as
  something that flows , but as something that exists all at once , structured into a static or quasi-static
  whole. This shift has been productive. It has helped'
