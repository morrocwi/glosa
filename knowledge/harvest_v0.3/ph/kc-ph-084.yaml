verbatim: 'We sketch the complete lifecycle of black holes within the Causal-Memory (CM) framework, where spacetime
  dynamics obey telegraph-type equations with finite memory time tau rather than parabolic heat-type
  equations. This modification-motivated by requiring strict causality at all scales-leads to: (i) horizon
  formation via local causal criteria, (ii) singularity regularization at r_min ~ (GM tau^2)^(1/3), (iii)
  information preservation through tau-regulated Hawking emission, and (iv) finite-time complete evaporation
  with unitary S-matrix. We identify key open problems, distinguish proven results from conjectures, and
  propose near-term observational tests accessible to LISA, Einstein Telescope, and'
