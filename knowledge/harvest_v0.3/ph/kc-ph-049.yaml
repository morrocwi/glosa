verbatim: 'Building on our earlier work — [Y. Lahtee, Zenodo (2025), doi:10.5281/zenodo.17624144 ] — where we showed
  that the gravitational constant G and the Planck constant ℏ arise naturally from the geometry, topology, and
  information structure of spacetime, we now extend the same reasoning to explain the fine-structure constant
  α and the entire hierarchy of gauge couplings. In this new framework, the strengths of the fundamental
  forces are not arbitrary numbers. They emerge from the way space itself is organized — how it curves, loops,
  and transmits information. Step by step,'
