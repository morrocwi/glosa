verbatim: 'We demonstrate that graph-based telegraph dynamics exhibit structural localization that statistically
  selects dynamical regimes (underdamped vs. overdamped), and that this selection is operationally detectable
  from partial, noisy timeseries observations without spectral knowledge. Using 50 independent graph
  realizations (500 graphs total, n = 60-103 nodes) and analyzing 18 nontrivial Laplacian eigenmodes per
  graph, we establish three core findings via multi-seed validation: (C1) Certain topologies generate
  localized eigenmodes (272/500 graphs, 54% hit rate), (C2) localization exhibits population-level coupling to
  regime selection (∆r = 0.211, CI95 = [0.175, 0.247], p < 0.001) with'
