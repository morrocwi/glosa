verbatim: We present the Equation of Coherence (SURE–∞ Canonical v1.2), a metriplectic (GENERIC) framework unifying
  conservative (Hamiltonian) and dissipative (metric) dynamics under a single Lyapunov-stable energy
  functional (dE/dt <= 0). The formulation reproduces three non-contradictory regimes — Quantum/Unitary (Q),
  Relativistic correspondence (R), and Diffusive/Classical (D). Public sandbox verification (grid 32^3, 120
  steps) confirms energy conservation in Q/R and strict energy decrease in D, yielding Consistency Index CI =
  1.00. We disclose complete mathematical structure and proofs sufficient for peer verification while
  redacting application-specific calibration constants under a Public Privacy policy.
