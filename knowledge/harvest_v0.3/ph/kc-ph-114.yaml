verbatim: 'Applying the philosophy-first discipline of the companion paper [1] (“the lens”) to the question why is
  gravity weak compresses the 39-digit puzzle stepwise: αG = 1 4 (tP/τc,p)2 (a memory-hierarchy ratio) →
  e−accumulated update impedance → slopes (b1, b2, b3) → representation counting × three kinematic atoms → one
  formula, (−1)2s(2s)2 − 1/d. We then translate every operator in that formula — quotient, subtraction,
  square, parity exponent, product — into the vocabulary of retained information, and state precisely which
  readings are exact, which are borrowed, and which are open. The'
