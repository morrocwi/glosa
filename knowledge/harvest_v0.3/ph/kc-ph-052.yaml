verbatim: 'Within our developing non-equilibrium theory of information in physics—where local informational imbalances
  evolve under strict global information and entropy constraints—we analyze a minimal discrete geometry
  capable of supporting topologically protected eigenmodes: a five-site pixel ring with exact C5 rotational
  symmetry, two gauge-phase forbidden slots, and a globally enforced information budget of 2π natural units.
  Discretizing the informational PDE on this constrained geometry yields a spectrum whose allowed winding
  numbers are tightly restricted by symmetry and nodal structure. The first admissible values, n = 1, 4, 20,
  95, . . .,'
