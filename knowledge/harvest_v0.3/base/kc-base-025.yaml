id: kc-base-025
kind: rule
title: What this system explicitly does NOT claim
text: finite_diagnostic ≠ proof (an executed numeric PASS is evidence, not a theorem). The Coq floor is
  narrow — do not extend its scope by inference. No B1 uniqueness claim. Gödel/Liar/ethics are not solved,
  only relocated. No supersession of any tradition — the relationship is dialogue, never replacement.
  No machine-independent timing claims. 'Of everything' is a candidacy label with an open boundary, never
  a declared result. The trunk equation's form is posited, not forced by the root; cross-domain '=' signs
  are often definitional relabels, not derivations. No domain is 'covered' without a running artifact
  at a canonical path. No epistemic authority is claimed from outside validation — external peer review
  or institutional recognition is never a lever that makes a claim more known, only one more input held
  to the same review as any in-house reviewer.
verbatim: "- **`finite_diagnostic` ≠ proof.** An executed numeric PASS is evidence, not\n  a theorem.\n\
