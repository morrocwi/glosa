title: Epistemic Nuclear Core N1–N5 (domain-independent)
text: 'Five equations the source calls irreducible in a strict sense: none of the five is derivable from
  the other four without smuggling in a sixth assumption, and none names a domain. N1 is dynamics with
  no commitment to what Φ is; N2 is epistemology with no commitment to what is measured; N3 is the arrow
  with no commitment to what dissipates; N4 is the bridge with no commitment to which two domains are
  bridged; N5 is the residue with no commitment to which experiment produced the ratio. N3 is the only
  one of the five carrying a machine-checked (Th_coqc) tag.'
verbatim: 'Five equations the source calls irreducible in the strict sense used throughout that book:
  **none of the five is derivable from the

  other four without smuggling in a sixth assumption; and none names a

  domain.** N1 is dynamics with no commitment to what Φ *is*; N2 is

  epistemology with no commitment to what is measured; N3 is the arrow with

  no commitment to what dissipates; N4 is the bridge with no commitment to

  which two domains are bridged; N5 is the residue with no commitment to

  which experiment produced the ratio.'
