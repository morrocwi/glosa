title: L_R forced by three properties of δ_R's own meaning
text: 'A retained distinction already carries three properties before any physics is hung on it: symmetric
  (reading a distinction from either end returns the same retained fact), zero-row-sum (a uniform state
  retains nothing to distinguish), off-diagonal ≤ 0 (the operator reads difference, not connection). Machine-checked
  over Q, these three properties alone force any operator satisfying them into exactly the D_W − W shape.'
