title: Three Epistemic Scalars and the DECIDE/ABSTAIN/ESCALATE verdict gate
text: 'Any reasoning step reduces to three CPU-computable scalars read off the N1-N5 spine: Re_ep (epistemic
  Reynolds — spread/contestedness), F_ep (obstruction depth — strength of best support), k_ep (consistency
  coupling — coherence of the supporting set). A three-valued verdict gate: DECIDE when F_ep high AND
  Re_ep low (strong + uncontested); ABSTAIN when F_ep low AND k_ep low (no signal, for free); ESCALATE
  when Re_ep high (contested — pay the large model). Deliberately three-valued, not collapsible to binary
  answer/no-answer.'
verbatim: "> Any reasoning step reduces to three CPU-computable scalars (minimal\n> sufficient statistic\
  \ read off the N1–N5 spine, not a new axiom):\n> `Re_ep` = epistemic Reynolds (spread/contestedness);\
  \ `F_ep` = obstruction\n> depth (strength of best support, the epistemic reading of N3's `O`);\n> `k_ep`\
  \ = consistency coupling (coherence of the supporting set, the\n> epistemic reading of N2 through a\
  \ multimode `L_R`).\n\n```\nVerdict gate (three-valued, not binary — a two-valued gate cannot separate\n\
  \"no evidence\" from \"evidence is contested\"):\n\n  DECIDE    when  F_ep high  AND  Re_ep low   →\
  \  strong + uncontested\n  ABSTAIN   when  F_ep low   AND  k_ep low     →  no signal (for free)\n  ESCALATE\
  \  when  Re_ep high                   →  contested → pay the LLM\n```"
