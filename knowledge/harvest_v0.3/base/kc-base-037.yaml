title: Case study — the tier discipline catching itself mid-flight (EQ-069–071 retraction)
text: 'Three finite_diagnostic entries reported a fermion-mass mechanism with dynamic ranges up to 449808x
  logged as evidence of structure. Independent review located the actual shape: the readout was a smooth
  bijection Θ↔R — a coordinate on a knob, not an observable — so the large ranges were an artifact of
  timesteps, not signal. The founder ruled retraction: the entries stay in the ledger by number (the stream
  must not renumber around a mistake), but their content is replaced in place by the retraction rationale,
  with the original reasoning preserved in a standing error note rather than deleted.'
verbatim: 'On 2026-07-26 the founder ruled retraction:

  EQ-069/070/071 stay in the ledger *by number* — the stream must not

  renumber around a mistake — but their content is replaced in place by the

  retraction rationale, with the original reasoning and its transferable

  lessons preserved in a standing error note rather than deleted.'
