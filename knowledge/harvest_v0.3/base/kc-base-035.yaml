id: kc-base-035
kind: rule
title: Bounded-Judge Law (independent adversarial review requirement)
text: 'The discipline is enforced, not merely declared: no numeric claim may enter a document without
  an executed check first (pytest/assert), logged in a verified-runs record; every change goes through
  one round of independent adversarial review — the Bounded-Judge Law; a claim of ''machine-checked''
  must actually resolve against the live Coq theorem corpus, and a miss auto-downgrades Th_coqc to Dr.'
verbatim: 'The discipline is enforced, not merely declared: no numeric claim may enter a document without
  an *executed check* first (pytest/assert), logged in

  `docs/VERIFIED_RUNS.md`; every PR passes one round of independent adversarial

  review (the "Bounded-Judge Law", [`v2/POSITION.md`] §3); and a claim of

  "machine-checked" must actually resolve against the live Coq theorem corpus

  (gate G9 below) — a miss auto-downgrades `Th_coqc → Dr`.'
