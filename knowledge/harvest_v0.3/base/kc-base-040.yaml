title: Sorites Paradox — the one node meeting the corpus's own strict three-file binding
text: 'The vague-boundary question translates to: where does the readout policy Π sit relative to the
  τ_c* knife-edge? This is the only node in the whole corpus meeting its own strict binding criterion
  (chapter ↔ Coq file ↔ executable diagnostic, all three at once). Verdict: genuinely resolved, but only
  inside the declared monotone scope — a smooth, one-directional world. The general Sorites (non-monotone,
  adversarial orderings) is not covered, and extending the claim beyond monotone would itself be the kind
  of overclaim the corpus''s own discipline forbids.'
