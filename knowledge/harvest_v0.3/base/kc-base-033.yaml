title: MQ.08 — discrete stepper (deepest operational equation)
text: 'The deepest operational equation in the book: a discrete stepper a machine can literally execute,
  not a continuum PDE discretized as an afterthought. Continuum forms are readouts of this stepper, never
  the other way around. Includes an explicit CFL/stability condition bounding the timestep Δθ by the damping
  and diffusion coefficients.'
verbatim: 'V[n+1] = V[n] + Δθ · ( −γ·V[n]  −  D_s · (L_R @ X[n]) )    # velocity update

  X[n+1] = X[n] + Δθ · V[n+1]                                  # state update


  # CFL / stability condition

  Δθ  ≤  2 / ( γ + sqrt(γ² + 4·λ_max·D_s) )'
