kind: claim
title: no_decoder_recovers_state theorem (non-injective readout)
text: 'Machine-checked, axiom-free theorem: whenever a readout operator maps two distinct true states
  to the same recorded value, both states still exist, but no decoder can recover both from the record
  alone. This is a general fact about non-injective maps — it grounds the shape of readout-not-truth,
  but is not independent evidence the stance is true of the physical world.'
