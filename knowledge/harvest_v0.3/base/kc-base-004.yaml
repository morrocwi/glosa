title: Q3 — Identity by role, not by number (equal-number fallacy)
text: Two projections that compute to the same digits can still be different quantities, because identity
  is fixed by causal/inferential role in the bounded readout graph, not by the digits displayed. Substituting
  one for the other on the strength of equal numbers is banned as the 'equal-number fallacy.' A worked
  case (three PDG mass-ratio numbers from one formula) gives this fit_calibrated numeric weight.
verbatim: '**Q3 — Identity by role, not by number.** Two projections that compute to

  the same digits can still be *different quantities* — their identity is

  their causal/inferential role in the bounded readout graph, not the number

  they happen to display. Substituting one for the other on the strength of

  equal digits is banned ("the equal-number fallacy").'
