title: 'The one-line chain: δ_R → L_R → per-agency readout (N2)'
text: 'δ_R is the primitive act of retaining one difference; L_R is what that retention accumulates into
  once many distinctions are kept and related — the shared structure, not any agency''s private view.
  No agency reads L_R directly; every agency A''s actual readout is a lossy linear read of it (N2: M_A
  = K_A·θ + η — ''knowing is a lossy linear read of a latent state, never the latent state itself'').'
verbatim: 'So the one-line chain is: **δ_R is retained → accumulates into

  L_R (identified with θ(E) at `Dr` tier — a declared cross-reference

  between two of the founder''s own works, matched by equation-form, not a

  machine-checked identity...) → each

  agency reads only its own lossy M_A of that shared structure, never the

  structure itself.**'
