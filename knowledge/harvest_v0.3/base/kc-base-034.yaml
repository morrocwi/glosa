title: Term-by-term honest tier table (II.6)
text: 'Every term of the trunk equation is tiered individually, not once for the whole equation: M∂²Φ
  is Dr with failed finite_diagnostic forcing attempts (M is posited, mass is a readout of τ_c via m=ħ/(2c²τ_c));
  D∂Φ is finite_diagnostic (well-behaved linear damping); K·L_RΦ is Th_coqc for the admissibility/eigenmode
  structure, Open for the full multimode extension; ∇V(Φ) is finite_diagnostic audit-only (this is where
  turbulence actually lives, corrected 2026-07-21 away from the M term); J is Dr (external boundary data,
  never derived from the other terms); η is finite_diagnostic where measured, Open in general — the term
  that must never quietly become the one nobody checks.'
verbatim: 'The honest summary of this table: three of six terms (`D`, transport''s admissibility skeleton,
  and the

  state-space bookkeeping) are on solid `[finite_diagnostic]`/`[Th_coqc]` footing; `M` is a positioned

  placeholder whose *derivation* has failed every attempt so far while its *readout relation* to `τ_c`
  is

  locked; `∇V` carries a tier-honest correction about where turbulence actually lives; and `η` is, by

  design, the term that must never be allowed to quietly become "the term nobody checks."'
