id: kc-base-013
kind: method
title: Witness table ruling out rival operators to L_R
text: 'On a concrete rational weighted 3-node path graph, four named rival operators are each ruled out
  by explicit witness rather than assertion: raw adjacency fails zero-row-sum and off-diagonal≤0; signless
  Laplacian D_W+W fails the same two; random-walk Laplacian I−D⁻¹W breaks symmetry (concrete numeral witness:
  entry (0,1)=−1 ≠ entry (1,0)=−2/5); the normalized (symmetric) Laplacian is refused outright because
  its entries require 1/√(d_i d_j), an ℝ-completeness injection not constructible on the rational carrier.'
verbatim: '| `L_R = D_W − W` | ✓ | ✓ | ✓ | passes all three |

  | adjacency (raw `W`) | ✓ | ✗ (row 1 sums to a+b=5≠0) | ✗ (entries +a, +b>0) | ruled out — `ADJ_fails_rowsum0`,
  `ADJ_fails_offdiag_le0` |

  | signless Laplacian `D_W+W` | ✓ | ✗ (row 1 sums to 2(a+b)=10≠0) | ✗ | ruled out — `QSL_fails_rowsum0`,
  `QSL_fails_offdiag_le0` |

  | random-walk Laplacian `I−D⁻¹W` | ✗ — `RW(0,1)=−1 ≠ RW(1,0)=−2/5` | ✓ | ✓ | ruled out — `RW_fails_symmetric`
  (concrete numeral witness) |

  | normalized (symmetric) Laplacian `D⁻¹ᐟ²(D−W)D⁻¹ᐟ²` | — | — | — | **[Refused]** before the 3-property
  test can run: entries need `1/√(dᵢdⱼ)`, an I1 (√ / ℝ-completeness) injection, not constructible on the
  `Q` carrier at all |'
