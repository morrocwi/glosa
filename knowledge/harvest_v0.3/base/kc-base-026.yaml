title: RAR A1–A8 — logic of retention
text: 'A second formal stratum on top of the arithmetic genome: A1 distinguishability (a question is a
  set of candidate distinctions), A2 transport (no inference without an admissible grammar), A3 retention
  (only distinctions kept above a threshold count as structure), A4 accessibility (derivability ≠ existence),
  A5 admissibility (the comparison metric is positive), A6 identity-locking (the same entity tracked through
  every inference), A7 obstruction (target of inference is consistency O=0, not annihilation — contradiction
  registers as O>0, evidence to revise, never license for ex-falso explosion), A8 lens (validate through
  a lens that does not distort). Declared a Dr-tier correspondence to the book''s own logic, not yet a
  proven formal unification.'
verbatim: '| A1 | distinguishability | a question is a set of candidate distinctions |

  | A2 | transport | no inference without an admissible grammar (units/types match) |

  | A3 | retention | only distinctions kept above a threshold count as structure |

  | A4 | accessibility | derivability ≠ existence (direct/composite/inaccessible) |

  | A5 | admissibility | the comparison metric is positive... |

  | A6 | identity-locking | the same entity tracked through every inference |

  | A7 | obstruction | target of inference is consistency O=0, not annihilation — O(Γ,φ) is a measured
  residual, not a truth value... |

  | A8 | lens | validate through a lens that does not distort |'
