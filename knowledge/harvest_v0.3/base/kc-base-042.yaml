title: README Principles — Position, Lens Law, tier discipline, philosophy-leads
text: 'Four working principles: (1) Position is a control layer, not a knowledge store — the real asset
  is the operator that forces direction (Gates G1-G13 force the right question in the right order). (2)
  The Lens Law: every problem is translated into the book''s own information-philosophy vocabulary before
  it is solved — arguing in a foreign vocabulary past step 1 is disallowed. (3) Readout-not-truth with
  an enforced tier discipline; no number enters documentation without an executed run behind it; every
  change goes through adversarial review. (5) Every new result is Open until it survives external, independent
  review; kinship to prior work is always disclosed and a falsifier is attached to every claim.'
verbatim: "2. **The Lens Law.** Every problem is translated into this book's\n   information-philosophy\
