id: kc-base-015
kind: definition
title: Discrete number ladder δ_R → D → ℤ → ℚ → ℝ
text: 'The move is a ladder, not a given: each rung defined from the one before, Th_coqc (machine-checked,
  axiom-free) at every step through ℚ. Density (a third number always between two others) is provably
  absent at the root — it can only ever be a later readout, never a primitive fact. ℝ is defined as Bishop
  regular Cauchy sequences of ℚ, with Cauchy-completeness proved by an explicit constructed limit — the
  continuum point read off its discrete rational approximants, mechanically, digit by digit. Full trichotomy,
  a total ≤, and the classical least-upper-bound property are NOT constructively valid on this ℝ.'
verbatim: 'The move is a **ladder, not a given**: `δ_R → D → ℤ → ℚ → ℝ`, each rung

  *defined from* the one before, `Th_coqc` (machine-checked, axiom-free) at

  every step through `ℚ`. ... Density — the intuition that between any two numbers

  there is a third — is *provably absent* at the root; it can only ever be a

  later readout, never a primitive fact about number. ... And

  `ℝ` — the rung this book''s whole "readout,

  not substrate" stance stakes everything on — is defined as **Bishop regular

  Cauchy sequences of `ℚ`**, with Cauchy-completeness proved by an *explicit

  constructed limit*, not an appeal to a completed totality: the continuum

  point is read off its discrete rational approximants, mechanically, digit

  by digit.'
