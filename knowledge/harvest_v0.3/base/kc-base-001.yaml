title: Readout-not-truth (founding refusal)
text: 'The corpus''s founding move: no ℝ-value hides behind the dial. What ever exists to a knower is
  the finite, bounded, discrete readout an operator returns to a bounded knower who is themselves a finite
  retained structure — never ''the world as it truly, exactly is.'''
verbatim: there is no ℝ-value hiding behind the dial. What exists, ever, is the finite, bounded, discrete
  *readout* an operator returns to a bounded knower — never "the world as it truly, exactly is." This
  is not a claim that the world doesn't exist; it is a claim about what is ever *available* to a knower
  who is themselves a finite retained structure.
