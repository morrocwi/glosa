id: kc-base-020
kind: claim
title: Mother equation — the record is a translation, never the truth itself
text: θ(E[n]) names the true state a record is about; M_A[n] names what an agency A actually retains at
  tick n. M_A[n]=K_A·θ(E[n])+η_sel+η_map+η_self — the record is a translation of the true state, never
  the state itself. M_A[n]≠θ(E) for all n; the total error ε_tot=η_sel+η_map+η_self>0 for all n — the
  translation gap between record and truth never closes to zero.
verbatim: '`M_A[n] = K_A·θ(E[n]) + η_sel + η_map + η_self` — the record is a translation

  of the true state `θ(E[n])`, never the state itself (`η_sel` selection

  noise, `η_map` mapping/translation noise, `η_self` self-referential noise)

  ... `M_A[n] ≠ θ(E) ∀n`; `ε_tot = η_sel+η_map+η_self > 0 ∀n` — the translation gap between record and
  truth never closes to zero.'
