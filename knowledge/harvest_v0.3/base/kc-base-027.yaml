kind: definition
title: Bounded knower framing
text: 'The corpus''s epistemic subject is named explicitly, not left implicit: a ''bounded knower'' who
  is themselves a finite retained structure, receiving only the finite discrete readout an operator returns
  — never the world as it truly, exactly is.'
verbatim: 'never "the world as it truly, exactly

  is." This is not a claim that the world doesn''t exist; it is a claim about

  what is ever *available* to a knower who is themselves a finite retained

  structure.'
