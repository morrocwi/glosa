title: τ_c > 0 — persistence axiom, mass as a readout of τ_c
text: 'E00.5: τ_c > 0 — something is retained between distinguishable events. τ_c is not a late derived
  quantity dressed up as fundamental; it is asserted at the root, before mass, force, or any domain leaf.
  Mass, introduced later as m = ħ/(2c²τ_c), is a readout of the persistence already posited here — never
  the other way around. Getting this ordering backward (deriving τ_c from mass) would violate the root
  axiom''s own priority.'
verbatim: "E00.5  persistence / causal memory\n       τ_c > 0                                        \
  \            [Ax]\n       Something is retained between distinguishable events."
