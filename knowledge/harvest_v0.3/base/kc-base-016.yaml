title: Injected-infinity/zero taxonomy (I1–I4, Z1–Z4)
text: 'A named taxonomy of eight non-readouts routinely smuggled in as if they were readouts: I1 ℝ-completeness
  (LUB/Dedekind), I2 h→0, I3 Re,Λ→∞, I4 actual +∞, and on the zero side Z1 the point r=0, Z2 exact-zero
  spacing, Z3 absolute rest/exact vacuum, Z4 the true void. Reciprocity 1/0=∞ names zero and infinity
  as one non-readout seen from two sides, never two separate facts.'
