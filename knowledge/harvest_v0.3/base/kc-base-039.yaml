title: Falsifiable claims table (C1–C7) and its own 'We do NOT claim'
text: 'Seven falsifiable claims, each with an executable check and expected result: C1 inference-as-descent
  converges monotonically under constant evidence; C2 a settled conclusion revises under an evidence flip;
  C3 residual floor never reaches zero under noise; C4 Sorites: smooth world, exactly one readout jump,
  jump tracks Pi; C5 bounded inference diverges iff discarded difference is load-bearing; C6 distinct
  worlds with identical records, Fisher singular; C7 Sorites core machine-checked axiom-free (monotone
  scope). The corpus states explicitly what it does not claim from these: finite_diagnostic ≠ proof; Coq
  scope beyond monotone g; B1 uniqueness; Gödel/liar/ethics solved; supersession of any tradition; machine-independent
  timings.'
