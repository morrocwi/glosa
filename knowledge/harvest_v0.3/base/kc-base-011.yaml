title: L_R := D_W − W (the one derived link)
text: L_R is the weighted graph Laplacian, built from a cost-based relational graph (retained states as
  nodes, retained relations as weighted edges). Named explicitly 'the ONE genuinely derived link' among
  the whole root-to-trunk chain — everything downstream of it is comparatively more posited.
verbatim: '**L_R := D_W − W** — the weighted graph Laplacian, built from a cost-based

  relational graph (retained states → nodes; retained relations → weighted

  edges). This is named explicitly as **"the ONE genuinely derived link"**

  (`readout_genesis/README.md`) among the whole chain from root to trunk —

  everything downstream of it is comparatively more posited.'
