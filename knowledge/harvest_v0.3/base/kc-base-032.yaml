title: 'Doctrine reminder: readout-not-truth, symbols are finite discrete computable objects'
text: Every symbol in the universal equation is a finite, discrete, computable object. SI units, c, ħ,
  continuum limits are adapters applied at the boundary when a human or instrument needs a familiar dial.
  The native unit is RD.
