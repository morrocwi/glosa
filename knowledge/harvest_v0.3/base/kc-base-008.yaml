id: kc-base-008
kind: rule
title: Fail-Able Gate Law (Type-P vs Type-U)
text: A gate only earns the Type-P (genuinely evidence-bearing) label if it carries both a machine-derived
  passing control and a machine-derived failing control. A gate that only ever demonstrates passing cases
  has not shown it can tell signal from absence of signal, and stays Type-U — a convention wearing evidence's
  clothes — until a real failing control is produced and correctly rejected.
verbatim: 'The law: a gate only earns the label **Type-P** — genuinely

  evidence-bearing — if it carries *both* a machine-derived passing control

  *and* a machine-derived failing control. A gate that only ever demonstrates

  passing cases, no matter how many, has not yet shown it can tell signal from

  the absence of signal; it stays **Type-U** — a convention or definition

  wearing evidence''s clothes — until a real failing control is produced and

  correctly rejected.'
