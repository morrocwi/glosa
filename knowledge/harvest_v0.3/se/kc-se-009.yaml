id: kc-se-009
kind: rule
title: From AI Governance to Epistemic Governance — govern the output's status, not only the system
text: The same slide deck proposes shifting the guiding question from AI Governance (is the system safe?
  transparent? biased?) to Epistemic Governance (what status does this specific output have? who checks
  it? who certifies it? who is responsible once it is used?), splitting responsibility into an input side
  and an uptake side rather than leaving it solely on the system.
verbatim: "จาก AI Governance สู่ Epistemic Governance

  AI Governance

  Epistemic Governance

  ระบบปลอดภัยไหม?
  โปร่งใสไหม?
  มีอคติไหม?

  ผลลัพธ์นี้มีสถานะอะไร?
  ใครตรวจ? ใครรับรอง?
  ใครรับผิดชอบเมือนําไปใช้?

  Input Responsibility + Uptake Responsibility
  คำถามชวนคิด: กํากับระบบ AI อย่างเดียวพอไหม หรือต้องกํากับสถานะของความรู้ด้วย?"
