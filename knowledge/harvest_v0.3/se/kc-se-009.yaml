id: kc-se-009
kind: rule
title: From AI Governance to Epistemic Governance — govern the output's status, not
  only the system
text: The same slide deck proposes shifting the guiding question from AI Governance
  (is the system safe? transparent? biased?) to Epistemic Governance (what status
  does this specific output have? who checks it? who certifies it? who is responsible
  once it is used?), splitting responsibility into an input side and an uptake side
  rather than leaving it solely on the system.
verbatim: |-
  อเสนอของบทความจ งเสนอใ ขยายจาก AI Governance
  Epistemic Governance ทักษะการตังคําถามของคนรุ่นใหม่
