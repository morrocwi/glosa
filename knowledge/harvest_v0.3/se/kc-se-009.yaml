base_justification: Consistent with, and a policy-facing restatement of, the base's Bounded-Judge Law
  (kc-base-035, mandatory independent adversarial review) and glosa's own maker≠checker≠approver rule —
  both insist governance attach to the specific output/claim's checked status, not only to the producing
  system.
glosa_use: adopt
glosa_target: "FOUNDATION §1 gate rules 3, 8 (maker/checker/approver split; no independent check ⇒ no
  release) — Input Responsibility / Uptake Responsibility split as a naming pair worth reusing"
notes: The Input/Uptake Responsibility split maps cleanly onto glosa's existing maker/checker split and
  could be cited as convergent external naming for the same discipline.
