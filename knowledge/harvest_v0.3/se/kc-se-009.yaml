base_justification: Consistent with, and a policy-facing restatement of, the base's
  Bounded-Judge Law (kc-base-035, mandatory independent adversarial review) and glosa's
  own maker≠checker≠approver rule — both insist governance attach to the specific
  output/claim's checked status, not only to the producing system.
glosa_use: adopt
glosa_target: FOUNDATION §1 gate rules 3, 8 (maker/checker/approver split; no independent
  check ⇒ no release) — Input Responsibility / Uptake Responsibility split as a naming
  pair worth reusing
notes: 'Source re-pointed and re-quoted on 2026-09-05 (same re-fetch as kc-se-008:
  Zenodo record 22302410, 42pp, genuine Thai NIDA slide deck confirmed; zenodo.org
  blocked direct curl from this network with a 403, so WebFetch + `pdftotext` in
  full was used instead). `verbatim` above (p.39) is the deck''s own AI-Governance-to-Epistemic-Governance
  slide, whose two question lists match this card''s text almost word for word —
  "ระบบปลอดภัยไหม? / โปร่งใสไหม? / มีอคติไหม?" = "is the system safe? / transparent?
  / biased?", and "ผลลัพธ์นี้มีสถานะอะไร? ... ใครตรวจ? ใครรับรอง? ใครรับผิดชอบเมื่อนำไปใช้?"
  = "what status does this output have? ... who checks it? who certifies it? who
  is responsible once it is used?" — so the core AI-Governance-vs-Epistemic-Governance
  claim in this card''s title is directly confirmed. However a full-document grep
  (English "input"/"uptake" and Thai ต้นทาง/ปลายทาง/นำเข้า/รับเข้า) found NO occurrence
  anywhere in the 42-page deck of an explicit "input side / uptake side" responsibility
  split — that specific naming pair in this card''s text and glosa_target appears
  to be glosa''s own restatement, not something stated in this source; left `glosa_use:
  adopt` because the title''s core claim is confirmed, but a human should either
  drop the input/uptake clause or locate its actual source. Thai extraction has the
  same tone-mark/font gaps noted on kc-se-008 (copied exactly as pdftotext gives it).'
