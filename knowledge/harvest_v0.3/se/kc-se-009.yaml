base_justification: Consistent with, and a policy-facing restatement of, the base's Bounded-Judge Law
  (kc-base-035, mandatory independent adversarial review) and glosa's own maker≠checker≠approver rule —
  both insist governance attach to the specific output/claim's checked status, not only to the producing
  system.
