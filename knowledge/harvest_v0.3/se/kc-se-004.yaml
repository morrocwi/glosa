id: kc-se-004
kind: rule
title: Unidentified values return NI, never zero — a readout-audit layer over every calculated claim
text: MOCA's abstract commits to a readout layer that forces every calculated claim to expose its
  identification set and minimal sufficient support bundle; where a value cannot be identified from the
  available evidence, the framework returns "NI" (not identified) rather than defaulting it to zero,
  and treats development-stage real-enterprise batteries only as finite diagnostics, never population
  validation.
verbatim: "A readout layer requires every calculated claim to expose its identification set and minimal
  sufficient support bundle; unidentified values are returned as NI, not zero. ... Development-stage
  real-enterprise batteries are treated only as finite diagnostics, not population validation."
source:
  doi: 10.5281/zenodo.22301882
  title: "Mission Opportunity–Constraint Architecture (MOCA): An AI-Executable Technical Management
    Framework for Social Enterprises — Equations, Dynamic Policy Paths, Binding, Readout Audit,
