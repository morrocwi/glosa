base_justification: A direct structural cousin of the base's injected-zero taxonomy (kc-base-016, Z-series
  "injected zero smuggled in as if real") — MOCA independently bans the same silent-zero move in a
  management-accounting context by naming an explicit NI sentinel instead of defaulting to 0.
glosa_use: adopt
glosa_target: "FOUNDATION §3 claim card — 'unidentified ≠ zero' guard, alongside the base contaminated-concept table (kc-base-018)"
notes: Good candidate for a glosa pre-write checklist line ("if a value is not identified by current
  evidence, mark NI — never write 0") mirroring MOCA's own rule.
