base_justification: Structurally the same shape as the base's mother equation M_A[n]=K_A·θ(E[n])+η
  (kc-base-020) — same K·θ(E)+η form, ported into a social-enterprise readout channel. Marked
  refined_by_later_work (not plain "holds") because MOCA adds a channel-specific gain K_a and two named
  error terms the base's single-instance formula does not carry, so it is a domain-specific elaboration
  of the same base template rather than a bare restatement.
