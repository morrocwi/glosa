id: kc-se-005
kind: definition
title: Readout non-equivalence in an enterprise's own data model — a channel-specific lossy map, not the state
text: MOCA's core data model opens by naming the latent enterprise state relevant to a question, then
  defines any source or institutional channel's report of it as a readout produced through a channel-specific
  gain applied to a truncation of the state plus several named error terms — never the state itself. The
  mission-binding vector that follows is explicitly framed as an audit coordinate, not a claim that
  reality itself decomposes into exactly those dimensions.
verbatim: "Let Et denote the latent enterprise state relevant to question Q. A source or institutional
  channel a provides a readout map Ra,t = Ka θ(Et ) + ηa,tsel + ηa,tself . ... This vector is an audit
  coordinate, not a claim that nature contains exactly these dimensions."
