id: kc-se-010
kind: method
title: Faith-based Cultural-Based Practitioners as a governance framework, not a claim about outcomes
text: A journal article proposes a "Cultural-Based Practitioner" (CBP) framework describing individuals who
  operate between state, market, and religion, arguing faith functions as an ethical/human-centric
  foundation for service systems rather than an obstacle to development. The abstract frames the paper's
  contribution as a descriptive/comparative framework (three case studies) built from cultural skills,
  bridging, and governance — a naming and structuring exercise, not an effectiveness or outcome claim.
verbatim: "This article examines the role of Cultural-Based Practitioners (CBP) who operate at the
  intersection of state, market, and religion amid the rapid transformations of the ASEAN digital
  economy. ... The paper introduces the CBP framework, integrating cultural skills, cultural bridging,
  and cultural governance to form a Living Soft Infrastructure —a model for transforming faith-based and
  cultural capital into verifiable social and economic value. Case studies from Thailand, Singapore, and
  Taiwan demonstrate how individual, institutional, and state-level practitioners can sustain coexistence
  through transparency, justice, and shared ethical values."
