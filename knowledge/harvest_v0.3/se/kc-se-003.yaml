id: kc-se-003
kind: rule
title: Five-tier claim ladder for a social-enterprise management framework (Th-coqc through NI/Open)
text: >
  MOCA states its own claim boundary before any equation — it is a technical synthesis, not a theorem
  all social enterprises obey, and imports the discipline of not equating a readout with a latent state
  from a companion Coq repository without claiming a machine proof of social-enterprise economics. It
  then declares five explicit claim tiers (machine-checked structural claims; established math/game-theory
  constructions; MOCA's own conditional definitions; retrospective case batteries; and unidentified
  distinctions) and states finite batteries must never be promoted to "all enterprises" claims.
verbatim: "MOCA is a technical synthesis, not a theorem that all social enterprises obey. The accompanying
  Universal Solver repository contains generic Coq artifacts showing, among other things, that a record
  can be invariant to admissible relabeling while still being strictly lossy; MOCA imports the discipline
  of not equating readout with latent state, not a machine proof of social-enterprise economics ... We
  therefore distinguish: • Th-coqc: axiom-free machine-checked generic structural claims in the formal
  repository; ... • finite-diagnostic: retrospective or prediction-frozen case batteries; • NI/Open:
  distinctions not identified by the current evidence or bridge assumptions. Finite batteries must never
  be promoted to \"all enterprises\" claims."
