id: kc-se-007
kind: method
title: Systematic prior-art review reporting "partially anticipated, not found in formulation" — not a novelty claim
text: The paper reports running two systematic prior-art reviews across nine adjacent literatures and
  states the finding as a bounded comparison — the paper's four claims are "partially anticipated" in
  their motivations and components by that literature and "not found in their formulations within the
  stated search scope" — rather than asserting the work is first, novel, or unprecedented outright.
verbatim: "Two systematic prior-art reviews --- across social-enterprise typology, gatekeeper theory,
  legal-form-as-commitment, safeguarding evaluation, mission-drift measurement, steward-ownership,
  legitimacy theory, certification economics, and comparative promotion policy --- find the paper's four
  claims partially anticipated in their motivations and components and not found in their formulations
  within the stated search scope."
