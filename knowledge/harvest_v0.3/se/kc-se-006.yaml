id: kc-se-006
kind: rule
title: Reflexive practitioner-inquiry disclosure — using one's own organisation as illustration, and saying why
text: The paper's illustrative case is the author's own registered social enterprise, and the paper states
  this plainly, framing the choice as access rather than merit ("used because the author knows its
  transactions from inside, not because it is exemplary"), and explicitly bounds what the reflexive
  practitioner-inquiry method can and cannot establish — it generates the problem and propositions, not
  population prevalence.
verbatim: "One organisation — a Thai Islamic-marriage service recognised as a social enterprise in 2024 —
  appears throughout as illustration. It is the author's own, a fact disclosed here and weighed in Section 9.
  It is used because the author knows its transactions from inside, not because it is exemplary. ...
  Practice experience generates the problem and the proposition; it does not by itself establish population
  prevalence, and the propositions are stated with the falsifiers that empirical work would need."
source:
  doi: 10.5281/zenodo.22227005
  title: "Why We Became a Social Enterprise: Positional Governance, Dual Costs, and a Toolkit for the
    Class of Enterprises for Which the Form Is Not a Choice"
  year: 2026
