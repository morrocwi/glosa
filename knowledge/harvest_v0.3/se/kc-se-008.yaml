id: kc-se-008
kind: claim
title: Candidate Forgetting — the crisis is not AI's answer, it is losing track that the answer was a candidate
text: >
  A conference-slide deck argues the real problem with AI-produced content is not accuracy, bias, or
  governance of the AI system itself, but that AI now produces something knowledge-shaped, and humans use
  it as if it already were knowledge. It names "Candidate Forgetting" — the failure occurs not when AI
  generates text, but when a human forwards, stores, and re-cites it until the fact that it was once only
  "an answer awaiting verification" is forgotten.
verbatim: "เมื่อมันกลายเป็นสิ่งที่เราสัมผัสในชีวิตประจำวัน วิกฤติจริงๆ ที่เอไอมอบให้ จึงไม่ใช่เพียงเรื่องความแม่นยำของเอไอ
  ไม่ใช่เพียง มีอคติหรือไม่ ไม่ใช่เพียงเอไอควรถูกกำกับดูแลอย่างไร ไม่ใช่เรื่องเพียงเอไอมีผลต่อองค์กรอย่างไร
  แต่คือ การผลิตสิ่งที่คล้ายความรู้ และเราเอามันไปใช้ราวกับความรู้จริงๆ ... ปัญหาไม่ได้เกิดเฉพาะตอน AI สร้างข้อความ
  แต่เกิดเมื่อมนุษย์ส่งต่อ จัดเก็บ และใช้ซ้ำ จนลืมว่าสิ่งนั้นเคยเป็นเพียง \"คำตอบที่รอตรวจสอบ\""
