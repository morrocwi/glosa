base_justification: An independently-worded convergent statement of the same core
  discipline as kc-base-001 (readout-not-truth) and the EPIS-UNIVERSAL-LENS "verify
  before you repeat" rule — a record is a candidate readout awaiting a decoder/check,
  not a settled fact, stated here for AI output specifically rather than for records/benchmarks
  generally.
