id: kc-se-008
kind: claim
title: Candidate Forgetting — the crisis is not AI's answer, it is losing track that
  the answer was a candidate
text: 'A conference-slide deck argues the real problem with AI-produced content is
  not accuracy, bias, or governance of the AI system itself, but that AI now produces
  something knowledge-shaped, and humans use it as if it already were knowledge. It
  names "Candidate Forgetting" — the failure occurs not when AI generates text, but
  when a human forwards, stores, and re-cites it until the fact that it was once only
  "an answer awaiting verification" is forgotten.

  '
