id: kc-se-012
kind: method
title: Simulation-battery evidence for social-enterprise survival — finite runs, stated consistency with empirical rates
text: A dynamical-systems paper (TTD v3) models social-enterprise survival under realistic ~10% margins,
  reporting a lifecycle survival rate from 60 simulations over 120 steps, stating the survivor cash median
  and noting the result is "consistent with" (not validated against) empirical startup survival rates; it
  also reports a stress-test degradation under ±30% quarterly shocks. The evidence offered is explicitly a
  bounded simulation battery, not a claim about real enterprises drawn as a population sample.
verbatim: "We present Translated Trust Dynamics v3 (TTD v3), a minimal dynamical-systems framework for
  social enterprise (SE) survival under capitalist market conditions with realistic margins (∼10%). ...
  Under these realistic conditions, lifecycle survival from seed stage is 45% (60 simulations, 120 steps),
  with survivors reaching median cash 3.9M—consistent with empirical startup survival rates. All deaths
  occur at t ≤ 19 (early-stage mortality). Under ±30% quarterly shocks, survival degrades gracefully to"
