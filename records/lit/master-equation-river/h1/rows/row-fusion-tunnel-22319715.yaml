how_it_sees_the_problem: 'Frames the central research problem of Human-AI collaboration around four coupled
  quantities in one sentence: an enlargeable corrigible space (recursion), independent resistance, avoidance
  of self-reinforcing tunnels (a directional failure mode), and durable epistemic capability returned
  to the human after AI removal (retention/direction) -- the same four elements (coupling, resistance,
  retention, direction) the audit''s genealogy row names.'
what_it_separates: Separates in-session collaborative performance from what survives AI removal (durable
  epistemic capability) -- the retention/return axis -- and separates 'resistance is preserved' from 'a
  self-reinforcing semantic tunnel forms' as two distinct failure/success conditions, not one collapsed
  outcome.
what_it_assumes: Assumes 'corrigible space of inquiry', 'independent resistance' and 'durable epistemic
  capability' are each independently measurable or at least independently definable constructs; the paper
  defends this with later formal objects (chi_recip, retention gate eta) rather than in this single sentence.
stance: 'YES'
