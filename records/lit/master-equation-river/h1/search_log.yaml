frozen_scope:
  hypothesis_or_falsifier: 'H1 (master-equation-river): the programme''s manuscripts describe successive
    stages of one process (World -> Readout -> Meaning -> Experience -> Retention -> Accessibility ->
    Live Possibility -> Choice -> Agency -> Feedback -> Changed Reader -> Human-AI -> Human Return ->
    Warrant) and can be composed as a typed multi-level dependency closure; with retained change (H_{t+1}
    != H_t) the closure is a recursive river/spiral, not a closed circle. Falsifier: a stage whose attributed
    internal source does not in fact contain the attributed content when the source is fetched and read
    directly, or two stages that can only be composed by collapsing a declared non-collapse (e.g. accessibility
    = warrant, resonance = truth, retention = improvement, potential = performance).'
  question_type: mechanism
  concepts_synonyms_vocabulary:
  - retained difference
  - readout
  - meaning-giving
  - experience
  - selective retention
  - Human LoRA
  - history-shaped accessibility
  - semantic momentum
  - resonance
  - rhythm
  - transition readiness
  - live possibility field
  - agency potential
  - feasible corrigible action envelope
  - Human-AI reciprocal coupling
  - CTSA
  - Human Return
  - naming (recursive)
  - dependency closure
  - non-collapse
  - provenance audit
  local_track_terms:
  - การทวนสายธาร (provenance audit ภาษาไทย)
  - สายธารสมการ
  inclusion_exclusion_rules: 'INCLUDE: the ten internal programme manuscripts the provenance audit (Master_Equation_River_Provenance_Audit_v1_0.pdf)
    names as the source for each named stage of the River (Readout Genesis, Human Learning as Epistemic
    Architecture, Experience Is the Human LoRA, From Problem to Hypothesis, Epistemic Fusion or Tunnel
    v8.1, Experience Is Meaning-Giving v2, Potential as a Readout v2 / Agency Potential, Choice Begins
    Before Choice, CTSA Human-Return Readout, Meaning Before Naming) -- fetched from their own Zenodo
    record, read directly, and checked for whether the attributed content is actually present as a verbatim
    passage. This is a reflexive provenance check of the audit against its own named ancestors, not an
    external-literature search. EXCLUDE: any source not named by the audit as contributing a specific
    stage; general capability/psychology literature already covered by the sibling H2 (potential-as-readout)
    review in this same repository.'
  time_window: 2026 (all ten sources are 2026 programme manuscripts; the audit itself is dated 5 September
    2026)
  language_strategy: EN primary (all ten source manuscripts are EN-language preprints); the audit document
    under check is bilingual TH/EN, read in both languages for the frozen_scope and stance judgments.
