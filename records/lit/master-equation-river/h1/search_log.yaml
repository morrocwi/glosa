global_track:
  summary: 'All ten internal sources the audit names were fetched directly from Zenodo and read in full
    text (pdftotext). Nine of the ten sources contain a verbatim passage that directly supports the audit''s
    attribution for the stage it names them for: Readout Genesis (root has no semantic labels, terms admissible
    only after a declared quotient/readout), Human Learning as Epistemic Architecture (representations
    -> relations -> retrieval -> evaluation -> update), Experience Is the Human LoRA (experience as a
    selective transformation of the observer, not adaptation), From Problem to Hypothesis (attraction/semantic
    momentum as finite access diagnostics separated from warrant), Epistemic Fusion or Tunnel v8.1 (corrigible
    space, independent resistance, durable epistemic capability after AI removal), Experience Is Meaning-Giving
    v2 (meaning-giving before naming, resonance as external-internal congruence, rhythm as structured
    recurrence, transition readiness), Choice Begins Before Choice (six non-collapsed levels: possible/feasible/live/chosen/enacted/evaluator-visible),
    CTSA (session-boundary Conceptual/Tool-Selection/Skill-Execution/Alternative-Generation Return ledger),
    Meaning Before Naming (naming can reorganize subsequent readout of an already-felt pattern). One source
    (Zenodo 22361830, "Potential as a Readout v2") DOES contain the attributed Read-Decide-Execute-Feedback
    joint-event content for the "Agency Potential" stage, but only as an explicit restatement of a separate,
    differently-titled prior work it cites as "[Lahtee, 2026b] ... A programme note of 5 September 2026
    then proposed a joint-event definition of effective, corrigible agency potential" -- the audit''s
    own Internal Programme References item 9 ("Effective, Corrigible Agency Potential: A Readout Genesis
    Proposal ...") is not the same manuscript as the live Zenodo record checked here. This is logged as
    a title/provenance-drift finding, not a content-absence finding: the R-D-X-F content the audit attributes
    to this stage is genuinely present in 22361830 as a restatement, so the citation card is scoped VERIFIED/YES,
    but the mismatch is carried forward to the GLS-2026-003 claim card''s non_claims and to attribution_problems_found.'
  strength_note: 'This is a reflexive internal-provenance check (Dr tier: the ten source PDFs are read
    directly and quoted verbatim), not an external-literature test of H1''s content. It establishes whether
    the audit''s own citations are attribution-accurate, not whether the composed river is empirically
    true -- H1 itself remains an interpretive/conceptual claim about how to read the programme''s own
    corpus, carried at tier Dr.'
