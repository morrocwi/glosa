frozen_scope:
  hypothesis_or_falsifier: 'Q6 (DESIGN/POLICY): Should glosa''s intake schema flag the pattern of a source
    claiming something is "verifiable" with no stated verification procedure as a standing red flag (a
    new named disclaimer-catalogue / Rule 17 entry, alongside FOUNDATION §5''s existing disclaimer catalogue)?
    Falsifier: the world literature on weasel/hedging language, the verifiability criterion in philosophy
    of language, and practitioner red-flag checklists (predatory-publishing, fact-checking) shows that
    "claims verifiability without a stated procedure" is either (a) already fully covered by an existing
    named pattern (so a new entry is redundant) or (b) too broad/ill-defined a pattern to flag mechanically
    without false-positiving on ordinary hedged academic prose -- i.e. the proposed new red flag is shown
    to be either redundant or unworkable as stated.'
  question_type: mechanism
  concepts_synonyms_vocabulary:
  - weasel words / vague attribution
  - epistemic hedging / hedging language in academic writing
  - verifiability criterion / verification principle (logical positivism, Vienna Circle)
  - falsifiability / unfalsifiable claim (Popper)
  - '"peacock terms" / unsupported attribution'
  - predatory-journal red flags / unverifiable editorial board or metrics
  - fact-checking "unverifiable claim" category (ตรวจสอบไม่ได้ / ไม่อยู่ในขอบเขตการตรวจสอบ)
  - claims something "has been shown/proven/verified" with no method cited
  - คำกำกวมเชิงวิชาการ (ambiguous academic phrasing)
  inclusion_exclusion_rules: 'INCLUDE: any source (dictionary/policy page, peer-reviewed article, preprint,
    standards/style guide, grey-literature practitioner guide, fact-checking-platform methodology page,
    philosophy reference) that discusses (a) language patterns that assert something is verifiable, checkable,
    proven, or shown without stating how to check it, or (b) the general category of vague-attribution
    / weasel / hedging language, or (c) verifiability/falsifiability as a philosophical criterion of meaning,
    or (d) practitioner checklists that name "unverifiable claim" as a red flag. EXCLUDE: sources purely
    about statistical/measurement verification techniques with no language-pattern or red-flag-checklist
    dimension; sources about unrelated meanings of "weasel word" (e.g. purely stylistic guides with no
    verifiability angle); paywalled sources reachable only by abstract are logged as PAYWALLED_ABSTRACT_ONLY
    (scope restricted to SUPPORTS_GENERAL_CLAIM_ONLY / CONTEXT_ONLY_NOT_EVIDENCE, never quoted beyond
    the abstract). This is a SCOPING_SEARCH (not systematic): goal is a representative, stratified spread
    of neighbour positions, not exhaustive linguistic-corpus coverage.'
  time_window: 1936-2026 (Ayer's Language, Truth and Logic and the Vienna Circle verifiability lineage
    is 1920s-1950s; weasel-word/hedging style guidance and fact-checking-platform practice is largely
    2000s-2026)
  language_strategy: EN primary; TH required (at least 1 Thai-language or Thailand/SEA-based source per
    task instruction, covering how a Thai fact-checking or academic-writing source frames an unverifiable/no-stated-procedure
    claim); one additional non-EN/Global-South angle sought via an EN-language source reporting on a non-EN/non-TH
    Global-South context (predatory-publishing literature specifically studying India, a documented Global-South
    publishing hub) rather than requiring a third search language directly.
