global_track:
  summary: 'Eight candidate sources kept from a scoping (non-exhaustive) web search: two EN reference/policy
    pages (Wikipedia "Words to watch" weasel-words section; Wikipedia "Verificationism") giving the two
    closest named prior patterns to Q6''s proposal; one EN peer-reviewed-but-mirrored article (Ott, "Hedging,
    Weasel Words, and Truthiness in Scientific Writing") framing unverifiable extension of statements
    via hedging/weasel language as an active writing hazard; one EN grey/nonprofit practitioner page (NCSE
    "Weasel Words") giving a worked example of exactly Q6''s pattern -- an unnamed "some critics" claim
    the reader cannot verify; one EN grey/institutional checklist (NOAA Library predatory-publisher red
    flags) naming "the metrics listed... are not verifiable" as an explicit checklist item, the closest
    existing analogue to a Rule-17-style catalogue entry; one EN preprint (arXiv:1906.06856, Jain & Singh)
    studying predatory-publisher verification-evasion patterns empirically from a Global-South (India)
    research group; one EN encyclopedia article (IEP, "Popper: Philosophy of Science") giving the falsifiability
    contrast -- a theory "compatible with every possible observation" cannot be checked, which is the
    philosophical mirror image of a claim asserted "verifiable" with no stated procedure; and one TH grey/community
    source (Cofact, cofact.org/howto) showing a working Thai fact-checking platform already distinguishes
    "unverifiable / not within the scope that can be checked" (ไม่อยู่ในขอบเขตการตรวจสอบ) as its own comment
    category, separate from true/false/partly-true.'
  strength_note: No source found tests Q6's exact proposed move (a NEW named glosa red-flag entry specifically
    for "claims verifiable with no stated procedure") as a design decision -- this is a schema/catalogue-design
    question, not itself studied in the literature found. The closest direct engagement is NOAA's predatory-journal
    checklist (an existing, unrelated-domain instance of exactly this red flag already being named and
    used operationally) and the Wikipedia weasel-words guideline (an existing, broader pattern -- "vague
    attribution" -- that a reader could argue already subsumes Q6's narrower pattern, making a new entry
    potentially redundant rather than novel). Neither source settles whether glosa's catalogue needs a
    NEW entry versus extending an existing one; that remains a design judgment for the human owner.
  small_n_stopping_rule_disclosed: true
local_track:
  summary: 'One Thai-language source found and read directly: Cofact (cofact.org/howto), the Thai civic
    fact-checking platform''s own how-to page, which lists "ไม่อยู่ในขอบเขตการตรวจสอบ" (not within the
    scope that can be checked) as one of four comment categories distinct from "fully true", "partly true",
    and "deceptive" -- an operational, non-academic Thai precedent for treating checkability-status itself
    as a first-class tag, close in spirit to Q6''s proposed red flag. Two attempted Thai/Thailand-adjacent
    academic sources could not be fetched: a ResearchGate page for a 2014 Thai academic-writing-hedging
    book chapter (อมรา ประสิทธิ์รัฐสินธุ์) returned a CAPTCHA/rate-limit block (logged NOT_OBTAINED, never
    quoted), and a Thai fact-checking commentary piece found via search (songsue.co) resolved to a parked/expired
    domain (logged NOT_OBTAINED, never quoted).'
  result: FOUND
