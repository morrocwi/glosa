  no stated procedure" is already treated as a red flag in unrelated domains (predatory publishing, Wikipedia
  editorial policy, Popper's falsifiability contrast); challenge-family queries surfaced the closest prior-art
  pattern (Wikipedia's broader "weasel words / unsupported attribution" guideline) that could make a narrower
  new glosa entry redundant, plus a Thai fact-checking platform (Cofact) that already treats "not within
