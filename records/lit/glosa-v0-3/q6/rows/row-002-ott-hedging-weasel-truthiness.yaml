hypothesis_ref: Q6
source_label: Ott, 'Hedging, Weasel Words, and Truthiness in Scientific Writing' (PMID 30607107; EN, peer-reviewed-indexed
  article, read via an open mirrored PDF copy)
how_it_sees_the_problem: Frames hedging/weasel language as an active mechanism authors use to 'extend
  unverifiable statements' -- i.e. the harm is precisely a claim being made to feel more supported/checkable
  than it actually is, matching Q6's concern almost exactly, though framed at the sentence-rhetoric level
  rather than as a claim-level red flag with a named verification-procedure gap.
what_it_separates: Separates ordinary hedging (politeness, appropriate uncertainty-marking) from weasel
  wording that misleads a reader into 'truthiness' -- a belief mistaken for a checked fact -- based on
  the AUTHOR'S INTENT to deceive, which the paper says is often unknowable from the text alone.
what_it_assumes: Assumes a human reader alert to rhetorical mechanism; does not offer a mechanical/schema-level
  detection rule glosa could implement directly -- 'depends on intent to deceive' is explicitly NOT a
  mechanically checkable criterion, which is a caution against expecting Q6's red flag to be cleanly automatable.
stance: 'YES'
what_it_would_say_against_us: 'Supports Q6''s underlying concern (unverifiable-sounding claims are a real
  writing hazard) but undercuts a purely mechanical schema flag: the paper''s own account makes whether
  language is ''weasel'' (harmful) versus ''hedging'' (legitimate caution) depend on author intent, which
  a schema-level pattern match cannot read -- Q6''s red flag, if implemented as a keyword/pattern trigger,
  risks flagging legitimate epistemic hedging as if it were deceptive weasel wording.'
