exact_passage: Weasel words are words and phrases aimed at creating an impression
  that something specific and meaningful has been said, when in fact only a vague
  or ambiguous claim has been communicated. A common form of weasel wording is through
  vague attribution, where a statement is dressed with authority, yet has no substantial
  basis.
