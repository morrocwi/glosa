exact_passage: Verificationism, also known as the verification principle or the verifiability
  criterion of meaning, is a doctrine in philosophy which asserts that a statement
  is cognitively meaningful only if it is empirically verifiable (can be confirmed
  through experience) or an analytic truth (true by virtue of its definition or logical
  form).
