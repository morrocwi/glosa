  search / direct fetch, glosa-v0-3 Q6 scoping pass". dialogue_table_stance: agrees. what_it_separates:
  Separates ordinary hedging (politeness, appropriate uncertainty-marking) from weasel wording that misleads
  a reader into ''truthiness'' -- a belief mistaken for a checked fact -- based on the AUTHOR''S INTENT
  to deceive, which the paper says is often unknowable from the text alone. what_it_assumes: Assumes a
  human reader alert to rhetorical mechanism; does not offer a mechanical/schema-level detection rule
  glosa could implement directly -- ''depends on intent to deceive'' is explicitly NOT a mechanically
  checkable criterion, which is a caution against expecting Q6''s red flag to be cleanly automatable.
  what_it_would_say_against_us: Supports Q6''s underlying concern (unverifiable-sounding claims are a
  real writing hazard) but undercuts a purely mechanical schema flag: the paper''s own account makes whether
  language is ''weasel'' (harmful) versus ''hedging'' (legitimate caution) depend on author intent, which
  a schema-level pattern match cannot read -- Q6''s red flag, if implemented as a keyword/pattern trigger,
  risks flagging legitimate epistemic hedging as if it were deceptive weasel wording.'
