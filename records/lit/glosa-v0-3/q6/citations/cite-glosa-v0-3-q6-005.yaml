  flag. what_it_would_say_against_us: Supports the general idea that checkability-status
  deserves its OWN category rather than being folded into true/false, lending some
  structural precedent to Q6''s proposal; but Cofact''s category answers ''can WE
  check this claim'', not ''does the SOURCE itself claim checkability without showing
  how'' -- the two are related but not identical, so citing this as direct support
  for Q6''s specific wording would overstate the match.'
