  inclusion_exclusion_rules: >-
    INCLUDE: sources describing (a) occasionalism or custom-based/habitual causation as a
    philosophical (not confessionally-bound) account of regularity without necessity, with a
    described mechanism, from any tradition (Ash'ari kalam, Malebranche, Hume-adjacent regularity
    theory, or a general philosophy-of-causation survey treating occasionalism structurally); (b)
    relational/dependent ontology or grounding-theory work (analytic metaphysics) on an entity's
    identity/individuation being constituted by dependence on something else; (c) process
    philosophy (Whitehead and successors) on actualization/selection among possibilities and
    perishing/re-creation (subjective/objective immortality, prehension); (d) Global South,
    Arabic-language, or Southeast Asian/Malay-Indonesian philosophical treatments of any of the
    above, including direct Arabic kalam-studies literature on kasb/takhsis. EXCLUDE: purely
    devotional/homiletic faqr or tawakkul content with no structural/philosophical mechanism
    description; sources using "dependent" or "occasionalism" only as a passing label without
    describing how selection or persistence works; apologetic content whose sole purpose is
    confessional argument rather than describing the structure.
  time_window: >-
    1674-2026 (Malebranche's occasionalism, De la Recherche de la Vérité, 1674, as one Western
    comparator anchor; classical Ash'ari kalam sources predate this but are reached here via
