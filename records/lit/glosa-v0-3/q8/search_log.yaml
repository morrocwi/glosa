global_track:
  summary: >-
    A real, substantial scholarly conversation exists, but no source found uses glosa's own
    labels (Dependent Order, Directed Selection, Dependent Identity) or tests the tri-construct
    package as a unit. SUPPORT: SEP's "Occasionalism" entry independently frames Ash'ari
    occasionalism and Western (Malebranche/Berkeley) occasionalism as instances of one general
    philosophical position, with "conservation is but continuous creation" as a recurring
    formula close to Dependent Identity; SEP's "Ontological Dependence" entry supplies a fully
    secular, theology-free formal vocabulary (rigid/generic existential dependence) that maps
    cleanly onto Dependent Identity specifically; SEP's "Causation in Arabic and Islamic Thought"
    entry places al-Razi's Ash'ari-associated "principle of preponderation" inside the general,
    theology-independent Principle of Sufficient Reason (PSR) literature, giving Directed
    Selection a real secular formal home. CHALLENGE: IEP's "Process Philosophy" entry -- the
    single most naturalistic-looking candidate analogue for Directed Selection -- shows its own
    account of selection-among-possibilities (concrescence) has to reintroduce God as "the
    principle of limitation" to do the actual selecting work, i.e. even this candidate does not
    achieve full secularization on its own terms, only relocation.
  strength_note: >-
    Evidence tier for the surrounding secular-philosophy premises: Dr (well-specified,
    peer-reviewed/editorially-curated encyclopedia entries, not independently replicated by this
    search). No source tests glosa's specific three-construct package or the five registers of
    faqr as a set.
local_track:
  summary: >-
    Both required non-English languages were searched directly and yielded on-topic sources
    (unlike Q1's local track, which found no Thai-language source at all). Arabic
    (aleqt.com, a Saudi general-audience newspaper) supplied a CHALLENGE finding: even within
    native Arabic intellectual culture, kasb is proverbially flagged as "more hidden than the
    Ash'arite kasb" (أخفى من كسب الأشعرية) -- i.e. contested/unclear within its own tradition,
    which weakens confidence that a clean structure is available to export in the first place.
    Indonesian (edusoshum.org, Universitas Ahmad Dahlan Yogyakarta, open-access journal) supplied
    an ORTHOGONAL/CHALLENGE finding: in this Global South/Southeast Asian Islamic-education
    philosophy literature's own framing, "ontology" is directly glossed as "filsafat ketuhanan"
    (the philosophy/theology of God), with no separation drawn between ontological and
    theological vocabulary at all -- a different kind of caution than the Western analytic
    sources, since it shows the source tradition itself (at least in this SEA pedagogical
    register) does not treat the two domains as separable, independent of whether an external
    secular vocabulary happens to redescribe the structure anyway. A Turkish peer-reviewed
    source (dergipark.org.tr, Journal of the Institute for Sufi Studies) and a grey/community
    devotional site (worldatnet.com) were also kept as additional CHALLENGE evidence specifically
    on the five registers of faqr, both framing faqr's ontological content as inseparable from
    its relation to God/"its Creator," at both the academic and ordinary-devotional register.
  result: FOUND
transfer_verdict: TRANSFERS_WITH_ADAPTATION
  # SPLIT VERDICT BY CONSTRUCT, not one answer for all of Q8: Dependent Identity (SEP ontological
  # dependence, card 002) and, more provisionally, Directed Selection (SEP PSR/preponderation,
  # card 004) each have a real, theology-neutral, already-mature formal vocabulary in secular
  # analytic philosophy that a glosa ontology-section primitive could cite/adapt without
  # theological content. Dependent Order (kasb) is both contested within its own source tradition
  # (card 005, Arabic) and its closest naturalistic-looking analogue (process philosophy's
  # concrescence, card 003) turns out to reintroduce a God-equivalent selecting principle rather
  # than secularize cleanly -- so Dependent Order stays weakly supported at best. The five
  # registers of faqr (cards 006, 007, 008, across three independent sources spanning academic
  # Indonesian, academic Turkish, and grey/community English registers) show the LEAST transfer:
  # every source that engages faqr's actual content, in every language and register searched,
  # keeps its ontological claim fused to a relation-to-God, not stated as a free-standing
  # structural fact. This is an adaptation-with-caveats verdict, not a clean transfer for the
  # whole package, and explicitly NOT a transfer at all for the five registers of faqr as
  # currently specified.
summary_disclaimer: >-
  This is a SCOPING_SEARCH (not a systematic review): 8 sources kept from 10 queries across 2
  query families (support/challenge, including one required Arabic query and one
  Malay/Indonesian-family query) and one search episode (2026-09-05). WAS found: (a) two
  Stanford Encyclopedia of Philosophy entries supplying genuinely secular, theology-free formal
  vocabulary that maps cleanly onto Dependent Identity (ontological/existential dependence
  theory) and, more provisionally, Directed Selection (PSR/preponderation literature); (b) a
  process-philosophy source whose own most naturalistic-looking account of selection reintroduces
  a God-equivalent principle rather than secularizing cleanly; (c) an Arabic-language source
  showing kasb (Dependent Order) is proverbially contested even within its own tradition; (d)
  an Indonesian-language source showing ontology and theology are not separated at all in at
  least one Global South Islamic-education pedagogical register; (e) two further sources (Turkish
  academic, English grey/community) on faqr specifically, both keeping its ontological content
  fused to relation-with-God. NOT found: any source using Q8's own construct labels or testing
  the three-construct package or five-register faqr set as glosa specifies them; any source
  offering a ready-made, already-secularized version of "Dependent Order" or the five registers
  of faqr as a unit. NC-27 applies: absence of a source naming glosa's own constructs is a
  search-coverage fact, not itself a verdict on whether the constructs generalize.
