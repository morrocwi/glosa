frozen_scope:
  hypothesis_or_falsifier: >-
    Q8 (glosa-v0-3, K2-lrs): the three Ash'ari theological constructs used in glosa's islam-domain
    material -- Dependent Order (tartib i'tiyadi / God-instituted regularity, as opposed to
    necessary causation), Directed Selection (takhsis -- why THIS possible outcome among
    equally-possible alternatives actualizes), and Dependent Identity (the createdness/
    contingency of a thing's own continued existence, not only its origination) -- plus the five
    registers of faqr (ontological poverty/neediness before God) have a non-theological
    STRUCTURAL analogue (a general pattern: X depends on Y for its individuation/actualization/
    persistence, describable without reference to God or revelation) that could be lifted into
    glosa's ontology section (FOUNDATION §1.0 Pillars) as a theology-neutral structural
    primitive, OR whether these constructs remain islam-domain content that stays out of
    FOUNDATION and belongs only in domain-specific case material. Falsifier: the world literature
    on occasionalism, dependent/relational ontology, and process-philosophy structural dependency
    is found to describe the SAME formal shape (non-necessitating regularity; selection among
    equally-possible alternatives; ongoing existential dependence) using theology-independent
    vocabulary and mechanism -- in which case a structural analogue exists and Q8 answers
    "yes, non-theological analogue usable in ontology". If instead every non-theological framework
    found either (a) does not address selection-among-equal-possibles / sustained-dependence at
    all, or (b) only reproduces the pattern by smuggling in an equivalent metaphysically-loaded
    commitment (a designer, a privileged actual-entity, an occasionalist God-substitute) rather
    than a genuinely theology-neutral structure, then Q8 answers "no, domain-only" and these three
    constructs + five registers of faqr stay islam-domain content outside FOUNDATION.
