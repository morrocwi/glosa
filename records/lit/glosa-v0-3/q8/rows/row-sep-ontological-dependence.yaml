hypothesis_ref: Q8
source_label: "Stanford Encyclopedia of Philosophy, \"Ontological Dependence\" (plato.stanford.edu/entries/dependence-ontological/)"
how_it_sees_the_problem: >-
  Frames identity/individuation as potentially constituted by a dependence relation on another
  entity, formalized with a technical vocabulary (rigid existential dependence, generic
  existential dependence, identity-dependence) illustrated entirely with secular cases
  (electrons/electricity, singleton sets) with zero reference to God or revelation anywhere in
  the definitional machinery read.
what_it_separates: >-
  Separates existential dependence (an entity could not exist without another) from
  identity-dependence (what an entity essentially IS is constituted by its relation to another,
  as in Fine's singleton-Socrates case) -- a finer-grained distinction than Q8's own current
  three-way split, and one that could sharpen "Dependent Identity" if adopted.
what_it_assumes: >-
  Assumes contemporary analytic-metaphysics tools (grounding, essence, modal existential claims)
  are the right level of formalization; does not discuss Islamic theology, faqr, or any of Q8's
  source constructs at all -- it is a general theory that happens to match the shape, not a
  direct engagement with Q8.
stance: "YES"
what_it_would_say_against_us: >-
  If Q8's "Dependent Identity" register stayed domain-confined, this source would say that is an
  under-use of an already mature, fully secular formal apparatus (grounding theory / ontological
  dependence) that already does exactly this structural work -- directly supporting lifting at
  least this one register into FOUNDATION's ontology section as a theology-neutral primitive.
