disclosure: 'I0 only (same session, not independently checked). Author/venue/title
  confirmed directly from the fetched SEP page itself. This is SUPPORT for Q8''s "Directed
  Selection" register: the "principle of preponderation" (taken by the entry from
  Ash''ari-associated theologian al-Razi, quoting Adamson & Benevich 2023) is presented
  in this secular reference-philosophy entry as one historical articulation of the
  Principle of Sufficient Reason (PSR) -- a well-known, theology-independent principle
  in general analytic metaphysics (also associated with Leibniz in the Western tradition,
  per the same page''s broader discussion) that a contingent thing, equally poised
  between existing and not existing, needs SOMETHING to tip ("preponderate") it into
  actuality rather than non-actuality. This gives Q8''s "Directed Selection" (why
  THIS possible outcome actualizes among equal alternatives) a genuine theology-neutral
  formal home in the PSR literature -- though the page frames al-Razi''s own version
  specifically within a causal/creationist context (the preponderating cause producing
  existence), so full secularization still requires substituting a non-agential sufficient-reason
  relation for the "cause" role al-Razi assumes. | I3 route (codex) judged from fetched
  metadata/abstract + the card''s quoted passage, not full text: Fetched title matches
  the SEP entry named by the card. The quoted passage is mechanically present in the
  excerpt and aligns with the locator. The passage explicitly frames contingency as
  requiring preponderation toward existence over non-existence, which plausibly supports
  the card''s Directed Selection relevance.'
