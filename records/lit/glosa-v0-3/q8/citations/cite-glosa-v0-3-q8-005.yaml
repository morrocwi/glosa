  construct is proverbially flagged as notoriously unclear/self-contradictory, not as a settled,
  well-specified mechanism ready for structural export. This is CHALLENGE evidence for Q8: before
  asking whether Dependent Order/kasb has a portable non-theological analogue, this source shows
  the construct's own internal clarity is already contested within the tradition that produced
  it, which weakens confidence that a clean, well-specified structure is what would be exported.
