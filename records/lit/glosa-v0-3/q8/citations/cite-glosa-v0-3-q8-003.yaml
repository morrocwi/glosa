disclosure: 'I0 only (same session, not independently checked). Author/venue/title
  confirmed directly from the fetched IEP page itself (peer-reviewed philosophy reference
  encyclopedia). This is a CHALLENGE finding for Q8: process philosophy''s account
  of "concrescence" -- an actual occasion selecting/filtering among available possibilities
  ("eternal objects") to become determinate -- looks structurally identical to Q8''s
  "Directed Selection" (why THIS possible outcome actualizes among equally-possible
  alternatives), and superficially reads as a naturalistic, non-Islamic account. But
  the SAME page states plainly that Whitehead''s own system reintroduces God specifically
  to do the selecting/limiting work ("God is introduced into the system as the principle
  of limitation, which actual occasions require") -- i.e. even this apparently secular
  process-philosophy framework does not achieve a theology-free structural analogue
  for Directed Selection on its own terms; it relocates rather than removes the metaphysical
  dependence on a privileged selecting agency. (The same page does note, at line 174,
  that some later process philosophers such as Sherburne argue God can be excised
  from the system -- so this is a live, unsettled internal debate within process philosophy
  itself, not a closed matter either way.) | I3 route (codex) judged from fetched
