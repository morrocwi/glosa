exact_passage: 'A: Software that is meant to support time-critical decision making
  does not meet the definition of Non-Device CDS. Often, time sensitive or critical
  outputs detect life-threatening and/or time critical conditions. In such situations,
  it is difficult to support that a clinician is not meant to solely rely on a provided
  recommendation or that the clinician will spend time to understand its specific
  basis. Therefore, these kinds of software generally cannot meet all the criteria
  for Non-Device CDS software.'
