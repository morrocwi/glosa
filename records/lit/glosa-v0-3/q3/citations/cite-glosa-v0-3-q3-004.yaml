notes: 'Diversity: language=th, source_type=grey_literature, geography_or_institution=Thailand,
  search_route_or_database="web search / direct regulator-site fetch, glosa-v0-3 Q3
  scoping pass". dialogue_table_stance: orthogonal. what_it_separates: Separates Generative
  AI (creates new content) from Traditional AI (Prediction/Decision/Recommendation
  on trained data) as a technical taxonomy -- it does not separate clinical from non-clinical
  Traditional AI, treating an X-ray diagnosis tool and a product-recommendation engine
  as the same technical class. what_it_assumes: Assumes a general-audience primer
  purpose (defining AI/ML/DL/ANN/Generative AI for department staff); does not address
  disclaimer wording, scope-of-practice boundaries, or whether a diagnostic and a
  non-diagnostic ''Traditional AI'' example should be governed by the same or different
  disclaimer text. what_it_would_say_against_us: By placing a diagnostic example (lung
  X-ray) and a non-diagnostic example (product recommendation) side by side under
  one technical label without distinguishing their disclaimer needs, this guideline
  -- if taken as representative of current Thai government AI literacy material --
  suggests the clinical/non-clinical boundary that Q3''s clause exists to mark is
  not yet salient in at least one real domestic AI-governance document, which is itself
  evidence the boundary needs active standardization rather than being already assumed.
