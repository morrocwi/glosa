notes: 'Diversity: language=en, source_type=peer_reviewed, geography_or_institution=Global
  South (Africa), search_route_or_database="web search / direct regulator-site fetch,
  glosa-v0-3 Q3 scoping pass". dialogue_table_stance: disagrees. what_it_separates:
  Separates the 9 of 12 countries where ''software'' appears nowhere in the medical-device
  definition from the 3 (South Africa, Kenya, Uganda) where software is broadly construed
  to include SaMD -- and even there, notes the frameworks lack AI-specific risk classification,
  lifecycle oversight, or algorithm-validation guidance. what_it_assumes: Assumes
  national statute text is the right unit of analysis for ''is this AI a medical device'';
  does not itself address disclaimer wording or runtime scope-boundary clauses, only
  whether the underlying legal category a disclaimer would reference exists at all
  in these jurisdictions. what_it_would_say_against_us: A reusable scope-boundary
  clause of the EU/US SaMD kind presupposes a legal category (''medical device'' covering
  AI/algorithms) that, per this peer-reviewed mapping, is explicitly absent from the
  medical-device statutes of 9 of the 12 African countries studied -- a template built
  against the EU AI Act / FDA SaMD framing may simply not travel to jurisdictions
  where the underlying legal hook it references does not yet exist, a concrete Global-South
  limit on ''standardize across all our disclaimers''.'
