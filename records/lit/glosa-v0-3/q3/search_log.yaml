$schema: search_log.schema.json
id: search-glosa-v0-3-001
claim_or_hypothesis_ref: Q3
search_mode: SCOPING_SEARCH
frozen_scope:
  hypothesis_or_falsifier: >-
    Q3 (DESCRIPTIVE/DESIGN): Is there a reusable non-clinical/non-medical/non-legal AI
    scope-boundary clause glosa should standardize across all its own AI-runtime
    disclaimers (a common template), beyond the SANA-specific instances (kc-ai-023,
    kc-he-016) already logged? Falsifier: the world literature on AI scope-of-practice /
    non-diagnostic disclaimers and the AI Act / SaMD high-risk-medical-device boundary
    shows that a single reusable clause cannot actually travel across domains (health,
    legal, financial, safety-critical) without domain-specific legal content that makes a
    shared template either too vague to do the disclaiming work or too domain-bound to
    reuse -- i.e. the standardization move itself is shown to be unworkable or actively
    misleading in at least one class of real deployment guidance.
  question_type: mechanism
  concepts_synonyms_vocabulary:
    - AI scope of practice / scope-of-practice disclaimer
    - non-diagnostic / non-clinical AI disclaimer
    - '"this is not medical/legal advice" boilerplate'
    - software as a medical device (SaMD) / FDA SaMD guidance
    - EU AI Act high-risk system / Annex III medical-device boundary
    - clinical decision support (CDS) disclaimer requirements
    - chatbot health information disclaimer / wellness app boundary
    - legal-tech AI "not legal advice" disclaimer
    - informed consent for AI-assisted tools
    - scope creep / mission creep in AI-assisted advice tools
    - standardized disclaimer template / boilerplate reuse across products
  inclusion_exclusion_rules: >-
    INCLUDE: any source (regulation, regulatory guidance, peer-reviewed article,
    preprint, standards body publication, grey-literature legal/health-tech
    commentary, community/blog piece from a practitioner or regulator) that discusses
    (a) how AI-facing scope-of-practice or non-diagnostic/non-legal-advice disclaimers
    are worded or required, or (b) whether such disclaimers can be standardized/reused
    across products versus needing to stay domain-specific and product-specific.
    EXCLUDE: sources purely about AI accuracy/performance benchmarking with no
    disclaimer/scope-boundary language dimension; sources about liability litigation
    outcomes only, with no reusable-template angle; paywalled sources reachable only
    by abstract are logged as PAYWALLED_ABSTRACT_ONLY (scope restricted to
    CONTEXT_ONLY_NOT_EVIDENCE, never quoted beyond the abstract). This is a
    SCOPING_SEARCH (not systematic): goal is a representative, stratified spread of
    neighbour positions, not exhaustive regulatory coverage.
  time_window: '2016-2026 (EU AI Act and FDA SaMD guidance lineage is largely
    2016-2024; chatbot/LLM-era health-and-legal-disclaimer discussion is 2022-2026)'
