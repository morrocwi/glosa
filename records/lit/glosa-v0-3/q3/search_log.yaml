global_track:
  summary: >-
    Eight candidate sources kept from a scoping (non-exhaustive) web search: two EN primary
    regulatory texts (EU AI Act Annex III explainer, US FDA Clinical Decision Support Software
    FAQs) showing the actual high-risk/device boundary is drawn by function and situational
    criteria (public-authority benefit eligibility; time-critical vs non-time-critical decision
    support), not by a single fixed disclaimer string; one EN preprint (arXiv:2507.08030)
    showing empirically that medical-disclaimer presence in generative-AI outputs collapsed from
    ~26% (2022) to ~1% (2025) even though disclaimer guidance already existed -- a template alone
    does not enforce itself; one EN peer-reviewed Global-South legal-mapping study (Frontiers in
    Pharmacology, 12 African countries) showing the underlying "medical device" legal category a
    disclaimer would reference is absent from 9 of 12 African countries' statutes; one EN
    grey/community perspective piece (Tech Policy Press, Nigeria/Kenya health-messaging study)
    supporting a general-purpose-vs-health-product distinction as a governance requirement (not
    disclaimer text); and one EN grey/community commercial legal-templates blog showing even a
    single non-clinical/non-legal domain (creative freelance services) already needs
    service-specific and client-specific disclaimer variants in that vendor's own practice.
  strength_note: >-
    No source found makes Q3's exact claim (a single reusable clause, standardized once, would
    suffice across all of glosa's own AI-runtime disclaimers) either as a tested finding or as a
    directly refuted one -- this is a design/standardization question, not yet studied as such in
    the literature found. The closest direct engagement is the FDA CDS FAQ (Q3 in the source's own
    FAQ) and the arXiv declining-disclaimer-presence paper, both of which push toward "a clause
    needs a context-check and an enforcement mechanism, not just standardized text" rather than
    toward "yes, standardize the string alone." The Tech Policy Press piece is the strongest
    SUPPORT-leaning source, but for a governance distinction, not a disclaimer template per se.
  small_n_stopping_rule_disclosed: true
local_track:
  summary: >-
    Two Thai-language sources found and read directly: the Thai FDA (อย.) Medical Device Control
    Division's own SaMD screening-criteria page (medical.fda.moph.go.th/samd-head) -- a genuine
    primary Thai regulatory source, giving Thailand's own standalone/embedded/accessory/non-device
    software split -- and a Thai government AI-governance guideline PDF from the Department of
    Thai Traditional and Alternative Medicine (FY2569/2026), which names a diagnostic example
    (lung X-ray AI) and a non-diagnostic example (product recommendation) under one technical
    label without distinguishing their disclaimer needs. Two attempted Thai grey/news sources
    (hfocus.org, an apparently stale ctat.or.th redirect) could not be fetched (hfocus.org
    returned a Cloudflare JS challenge, HTTP 403; ctat.or.th redirected to an unrelated
    shipping-association homepage) and are logged as NOT_OBTAINED, never quoted.
  result: FOUND
transfer_verdict: TRANSFERS_WITH_ADAPTATION
summary_disclaimer: >-
  This is a SCOPING_SEARCH (8 kept candidates from web search, not a systematic review) --
  support-family queries surfaced primary regulatory texts and Thai-government sources that treat
  the disclaimer/scope boundary as function- and context-dependent rather than as a single fixed
  string; challenge-family queries surfaced a direct US-regulatory example (FDA CDS FAQ
  time-critical criterion) and a commercial legal-blog example (per-service disclaimer tailoring)
  both arguing against a single reusable clause traveling unmodified across contexts, plus a
  Global-South legal-mapping study showing the underlying legal category a clause would reference
  is itself jurisdiction-dependent. No source directly tests Q3's own proposed move (standardizing
  glosa's specific non-clinical/non-medical/non-legal clause across its own disclaimer catalogue);
  absence of a source testing that exact move does NOT mean none exists -- this is a small,
  non-exhaustive scoping pass, disclosed as such.
