  product' requiring 'alignment with clinical guidelines, rigorous privacy safeguards, and community co-design'
  -- explicitly naming this distinction as a protective mechanism against exploitative or careless deployment.
what_it_assumes: Assumes the distinction, once made, should drive downstream GOVERNANCE obligations (consultation,
  impact assessment, co-design) rather than settling for disclaimer text; does not specify what a reusable
  disclaimer clause implementing this distinction would actually say.
