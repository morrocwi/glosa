$schema: dialogue_table_row.schema.json
hypothesis_ref: Q3
source_label: Sharma, Alaa & Daneshjou, 'A Systematic Analysis of Declining Medical Safety Messaging in
  Generative AI Models' (arXiv:2507.08030, EN, preprint)
how_it_sees_the_problem: 'Frames the disclaimer problem empirically: it measures whether medical disclaimers
  actually appear in model outputs across 2022-2025, on 2,000 real image/question prompts, rather than
  debating what a disclaimer''s text should say.'
what_it_separates: Separates 'a disclaimer policy/template exists' from 'a disclaimer actually appears
  in the deployed output the end user sees' -- the paper's whole finding is that this gap widened sharply
  (most models show 0 disclaimers by 2025) even though disclaimer language and guidance have existed for
  years.
what_it_assumes: Assumes disclaimer PRESENCE (a phrase-detection screen) is a meaningful proxy for safety
  messaging; does not evaluate whether the disclaimers that DID appear used a standardized clause or ad
  hoc wording, so it cannot directly confirm or refute standardization's wording-level benefit, only that
  having any template is not self-enforcing.
stance: 'NO'
what_it_would_say_against_us: 'Directly defeats a naive reading of Q3: even where a reusable non-diagnostic
  disclaimer clause already exists and is well understood industry-wide, this paper''s own measurement
  shows it is not showing up in practice at industrial scale and is actively declining -- standardizing
  the CLAUSE TEXT alone, without a runtime enforcement mechanism, does not solve the underlying scope-boundary
  problem this question is trying to close.'
citation_card: cite-glosa-v0-3-q3-005
defeater_class: empirical
legitimate_defeater: "Defeated by a measurement showing a standardized clause text, deployed without a runtime enforcement mechanism, sustains or increases disclaimer presence at industrial scale rather than declining."
