disclosure: 'Ndwandwe et al. 2022, BMJ Open (peer-reviewed, Africa/PACTR, PMC open-access
  full text). Fetched and read directly (curl + stdlib HTML stripper, one page kept
  in memory at a time per RAM limit) 2026-09-05. Read as: the continental African
  trial registry PACTR explicitly permits registration to happen BEFORE ethics approval
  is granted, gated only on recruitment not having started yet -- i.e. in this real
  Global-South registry, "freeze before ethics, before data" is already an accepted,
  working sequence for the freeze-vs-ethics half specifically (registration can precede
  ethics), while the same paper reports 90% of registered trials do eventually carry
  ethics approval (line 97) and 45% are still registered retrospectively relative
  to enrolment (line 132) -- so the "before data" half is the harder-to-enforce one.
  stance vs Q5 as read: PARTIAL_SUPPORT (backs the specific claim that freeze-before-ethics
  is workable and already practiced at a continental registry, while showing freeze-before-data
  compliance is the still-unsolved half). No novel/first/prior-art claim made about
  this source; comparison to Q5 is same/different/orthogonal as stated in dialogue_table_stance.
