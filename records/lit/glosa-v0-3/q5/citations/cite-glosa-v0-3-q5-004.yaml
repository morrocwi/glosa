  Separates "registered before ethics approval is finalised" (explicitly permitted
  by PACTR, gated on recruitment not yet starting) from "registered before data collection/recruitment"
  (the harder norm, still failing in 45% of registered trials) -- Q5''s compound rule
  bundles two separately-enforceable conditions that this registry''s own policy already
  treats as distinct. what_it_assumes: Assumes a registry staff verification step
  exists to check ethics documents after the fact ("PACTR staff also ensure that the
  ethics approval is verified", line 249) -- i.e. the timestamp field alone is not
  self-enforcing even where it exists. what_it_would_say_against_us: If glosa''s hard
  gate demands protocol_frozen_at strictly BEFORE ethics_approved_at as a blocking
  precondition, that is stricter than what the largest working African trial registry
  actually requires (which only requires ethics has been "applied for", not yet granted,
  and verifies it post hoc) -- the minimal schema field should probably record both
  timestamps and let a checker flag the compound violation, not hard-block on ethics
  timing alone.'
