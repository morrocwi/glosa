disclosure: 'TCTR (Thai Clinical Trials Registry) official Help Center, "New Study Registration"
  how-to article (TH, grey/community operational documentation, not a peer-reviewed source). Fetched
  and read directly (curl + stdlib HTML stripper, one page kept in memory at a time per RAM limit)
  2026-09-05. Read as: TCTR''s own registration record has an "Ethics Review" field (line 33) that the
  researcher fills in as PART OF drafting the record while it is still "In Progress" -- i.e. a
  researcher can open/freeze-draft a TCTR record before a committee has approved it, then the record
  moves to "Submitted for Approval" and only becomes "Released" (assigned a registration number) once
  TCTR''s own committee approves the FILING, a step separate from and not identical to the underlying
  study''s own IRB/ethics-committee approval. This shows a real, currently-operating registry treats
  "protocol drafted/frozen" and "ethics approved" as two independently-timestamped events that can
  interleave, not a single strict before/after gate. stance vs Q5 as read: PARTIAL_SUPPORT (shows the
  operational plausibility of tracking a freeze event separately from an ethics-approval event, which
  is what a minimal timestamp-before field would need to do -- but does not itself mandate freeze
  strictly before ethics). No novel/first/prior-art claim made about this source; comparison to Q5 is
  same/different/orthogonal as stated in dialogue_table_stance. independence_class I1 (same session)
  -- status METADATA_OK only, not VERIFIED.'
