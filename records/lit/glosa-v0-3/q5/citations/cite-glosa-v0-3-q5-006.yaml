  study-ethics-approved-at vs first-data-observed-at are three, not two, distinct clocks). what_it_assumes:
  Assumes a researcher-facing UI walkthrough is representative of what the registry actually enforces
  on the backend; does not itself state that Ethics Review data is validated against an independent
  ethics-committee record before Release. what_it_would_say_against_us: If glosa''s hard gate only
  distinguishes "protocol frozen" from "ethics approved," it is missing a third clock this real
  registry already tracks separately -- the registry''s OWN administrative approval of the filing
  (Released) is not the same event as the underlying study''s ethics-committee approval, and conflating
  them in a two-field schema would misdescribe how an actual working registry sequences things.'
