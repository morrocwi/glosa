  timing norm from those that do not, by measuring the actual lag between enrolment and registration
  -- an empirical readout of gate failure, not a proposal for a gate. what_it_assumes: Assumes CTRI''s
  own registration-date field is itself trustworthy/unfalsified (the audit does not itself independently
  verify the registered dates against a separate source); does not address ethics-approval timing at
  all, only registration-vs-enrolment timing. what_it_would_say_against_us: A norm alone ("should
  preregister before data") demonstrably does not produce compliance at scale (63% failed it here) --
  so a hard glosa gate needs the checkable field AND an enforcement mechanism (like CTRI''s own
  post-2018 mandatory-prospective-registration policy shift cited in this same paper''s discussion),
  not just a schema field nobody is forced to satisfy.'
