disclosure: 'Birajdar et al. 2019, Perspectives in Clinical Research (peer-reviewed, India, PMC open-access
  full text). Fetched and read directly (curl + stdlib HTML stripper, one page kept in memory at a
  time per RAM limit) 2026-09-05. Read as: a one-year audit of India''s national trial registry (CTRI)
  found 63% of studies registered in 2016 were registered retrospectively (after enrolment began), with
  a median lag time of 428 days and a maximum of 5399 days (line 155 of the fetched text) -- direct
  empirical evidence that an unenforced "register before you start" norm is widely gamed/ignored in a
  real, large, Global-South research system even where a timestamp field already exists in the registry.
  stance vs Q5 as read: YES (supports the need for a hard, checkable gate rather than a norm alone --
  the exact motivation Q5 asks about, though for registration-before-data rather than
  freeze-before-ethics specifically). No novel/first/prior-art claim made about this source; comparison
  to Q5 is same/different/orthogonal as stated in dialogue_table_stance. independence_class I1 (same
  session) -- status METADATA_OK only, not VERIFIED.'
