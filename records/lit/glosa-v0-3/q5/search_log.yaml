frozen_scope:
  hypothesis_or_falsifier: >-
    Q5 (DESIGN/NORMATIVE): Should "frozen preregistration before ethics, before data" become
    a hard glosa gate rule (FOUNDATION §2.1a problem-before-observation / §7.3 Bounded-Judge
    Law), and what minimal card-schema field (a timestamp-before field, e.g. a
    protocol_frozen_at / preregistration_timestamp that must sequence strictly before both
    ethics_approved_at and first_data_observed_at) is needed to check it mechanically?
    Falsifier: the world literature on preregistration, Registered Reports, and research-ethics
    timing shows that (a) mandating protocol-freeze strictly BEFORE ethics approval is not
    actually how any real Registered-Reports or preregistration workflow sequences things
    (ethics approval routinely precedes or is decoupled from the registry timestamp, or the
    reverse order is shown to be unworkable/harmful in practice), or (b) a single
    timestamp-before field cannot actually be checked/verified from real registry outputs
    (OSF/AsPredicted/journal RR timestamps are not reliably comparable to IRB/REC approval
    dates), which would mean a hard glosa gate keyed on that field would be either
    unenforceable or would misdescribe the methodology it claims to enforce.
  question_type: mechanism
  concepts_synonyms_vocabulary:
    - preregistration timestamp
    - Registered Reports (Stage 1 protocol, in-principle acceptance)
    - frozen protocol deposit / time-stamped protocol
    - IRB approval date / research ethics committee (REC) approval date
    - protocol registration before data collection
    - study registry (OSF Registries, AsPredicted, ClinicalTrials.gov, PROSPERO)
    - p-hacking / HARKing (hypothesizing after results known) prevention
    - "การจดทะเบียนล่วงหน้าก่อนขออนุมัติจริยธรรม"
    - คณะกรรมการจริยธรรมการวิจัยในมนุษย์ (IRB/REC ไทย)
    - pre-analysis plan (PAP) timing relative to ethics/IRB approval
    - registration-to-publication timestamp audit / preregistration verification
  inclusion_exclusion_rules: >-
    INCLUDE: any source (peer-reviewed methodology article, preprint, registry policy
    document, journal Registered Reports policy, funder/regulator preregistration
    guidance, grey-literature methods commentary, community/blog piece from a
    working researcher or open-science practitioner, Thai or SEA research-ethics
    guidance) that discusses (a) the actual sequencing of protocol
    registration/freeze relative to ethics/IRB approval and to first data
    collection/observation, or (b) whether a single machine-checkable timestamp
    field is sufficient/practical evidence of that sequencing. EXCLUDE: sources
    purely about preregistration's effect on publication bias or effect-size
    inflation with no timing/sequencing-mechanism angle; sources about
    post-hoc/exploratory-analysis best practice with no registration-timestamp
    dimension; paywalled sources reachable only by abstract are logged as
    PAYWALLED_ABSTRACT_ONLY (scope restricted to CONTEXT_ONLY_NOT_EVIDENCE, never
    quoted beyond the abstract). This is a SCOPING_SEARCH (not systematic): goal is
    a representative, stratified spread of neighbour positions, not exhaustive
    methodology-literature coverage.
  time_window: '2013-2026 (Registered Reports format formalized ~2013 (Chambers);
