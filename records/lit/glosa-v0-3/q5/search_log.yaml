global_track:
  summary: >-
    Eight candidate sources kept from a scoping (non-exhaustive) web search: the COS/OSF
    preregistration FAQ (EN) states a "before data collection" timing rule but is silent on
    ethics-approval timing; the Scientific Reports Registered Reports policy (EN, primary
    journal-policy text) shows the flagship frozen-protocol methodology actually requires
    ethics approval BEFORE Stage 1 submission and defers formal registry deposit until AFTER
    Stage 1 acceptance -- the reverse of a strict freeze-before-ethics order; an India CTRI
    retrospective-registration audit (EN, peer-reviewed, Global South) shows 63% of a national
    registry's 2016 cohort was registered after enrolment began (median lag 428 days), empirical
    evidence that an unenforced timing norm is widely gamed; a Pan-African PACTR descriptive
    analysis (EN, peer-reviewed, Global South) shows the continental African registry explicitly
    permits registration before ethics approval is finalised (gated only on recruitment not
    having started), while 45% of its own registrations are still retrospective relative to
    enrolment; and the CASRAI preregistration guide (EN, grey/community) and an arXiv NLP
    preregistration preprint (EN) both push back on a universal hard gate -- the former warns
    against treating a passed timing check as ethics-substance verification, the latter shows an
    entire live research field (NLP) has no ethics-approval event to sequence against at all.
  strength_note: >-
    No source found tests Q5's exact compound claim (frozen preregistration strictly before
    BOTH ethics approval and data, as one hard glosa gate) as a single studied proposition --
    every real working system found (Registered Reports, CTRI, PACTR) treats "before ethics" and
    "before data" as two separately-enforced conditions, and the two Global-South registries show
    they can be sequenced in either order in practice, with "before data" being the harder,
    more-often-violated one. This is a design/normative question the literature bears on
    indirectly (via how existing registries actually sequence approvals) rather than one any
    source directly settles either way.
  small_n_stopping_rule_disclosed: true
local_track:
  summary: >-
    Two Thai-language sources found and read directly: a ThaiJo/TCI-indexed Mahidol R2R
    e-Journal article on TCTR (Thai Clinical Trials Registry) naming transparency, quality,
    non-duplication and ethical-reporting correctness as TCTR's institutional purposes (abstract
    only fetched, logged honestly); and TCTR's own official Help Center "New Study Registration"
    how-to page, which shows a TCTR record can be drafted ("In Progress") and have its Ethics
    Review field filled in before the record itself is administratively "Released" -- i.e. a
    real, currently-operating Thai registry already separates "record drafted/frozen" from "study
    ethics approved" from "registry's own approval of the filing" as three distinct, independently
    timestamped events, not two.
  result: FOUND
transfer_verdict: TRANSFERS_WITH_ADAPTATION
summary_disclaimer: >-
  This is a SCOPING_SEARCH (8 kept candidates from web search, not a systematic review) --
  support-family queries surfaced the COS/OSF timing FAQ and two Global-South registry-audit
  studies (India CTRI, Pan-African PACTR) showing both that timing gates are gameable without
  enforcement and that "before ethics" and "before data" are already treated as separable
  conditions by real registries; challenge-family queries surfaced the Registered Reports
  journal-policy text (ethics precedes protocol freeze, not the reverse), the CASRAI guide
  (preregistration must not be conflated with ethics approval), and an arXiv NLP preprint
  (an entire research field lacking any ethics-approval event to sequence against). No source
  directly tests Q5's own proposed compound gate as a single studied claim; absence of a source
  testing that exact move does NOT mean none exists -- this is a small, non-exhaustive scoping
  pass, disclosed as such.
