search_mode: SCOPING_SEARCH
frozen_scope:
  hypothesis_or_falsifier: >-
    Q1 (glosa-v0-3, K2-lrs): "Premature Category Stabilization" (PCS) -- the pattern where a
    working category/label is fixed before enough evidence has accumulated to justify closing
    it, then downstream reasoning treats the category as settled -- generalizes beyond its
    tourism/hilal/service-template case studies into a named, cross-domain glosa kernel
    failure-mode/red-flag that belongs in the base-hub contaminated-concept table (alongside
    kc-base-018), informing whether FOUNDATION §5's disclaimer catalogue / §6 genre router gets
    a new named red-flag. Falsifier: the world literature on premature closure / categorization
    bias / institutional template lock-in is found to describe a domain-bound phenomenon only
    (e.g. clinical diagnostic reasoning, or single-institution isomorphism) with no
    cross-domain/general mechanism independent of subject matter -- in which case PCS stays
    domain content confined to its originating case studies rather than becoming a kernel-level
    red-flag.
  question_type: mechanism
  concepts_synonyms_vocabulary:
    - premature closure
    - premature category stabilization
    - categorization bias
    - schema formation
    - cognitive closure
    - institutional isomorphism
    - template lock-in
    - boundary object
    - anchoring bias category formation
    - sensemaking premature convergence
    - การปิดหมวดหมู่ก่อนเวลาอันควร
    - อคติในการจัดหมวดหมู่
    - การล็อกรูปแบบสถาบัน
  inclusion_exclusion_rules: >-
    INCLUDE: sources discussing (a) premature closure / early category-fixing as a cognitive or
    organizational bias with a described mechanism (not just a named phenomenon), (b)
    institutional isomorphism / template lock-in where an organizational form gets adopted and
    then treated as settled before fit is tested, (c) boundary-object / classification-theory
    work on category stabilization in science & technology studies, (d) Global South or
    Thailand/SEA empirical cases of institutional template transplantation. EXCLUDE: sources
    using "premature closure" only in the narrow clinical-diagnosis sense (a specific DSM/medical
    decision-making literature) with no generalizable mechanism claim; pure marketing/consulting
    content with no method or citation; sources that only use "category" in a database/software
    schema sense unrelated to belief/classification stabilization.
  time_window: '1977-2026 (institutional isomorphism traces to DiMaggio & Powell 1983; category
    theory in STS traces to Bowker & Star; looser lower bound to admit foundational texts)'
  language_strategy: 'EN primary; TH searched directly (คำค้นภาษาไทย ผ่าน WebSearch) as the
