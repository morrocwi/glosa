disclosure: >-
  I0 only (same session, not independently checked). Title/journal/DOI confirmed mechanically via
  Crossref bibliographic search ("What Drives Institutional Reforms in Regional Organisations
  Diffusion Contextual Conditions Modular Design ASEAN"), returning TRaNS: Trans-Regional and
