  JATS abstract was read (mechanical metadata route); the Cambridge Core full text was not
  fetched. This source bears on Q1 as a Global South/SEA (ASEAN) case: it documents that
  regional-organization "templates" are selected and stabilized ("modular adoption") based on
  contextual conditions and cognitive priors, and -- notably for Q1 -- explicitly argues AGAINST
  the view that institutional borrowing/template adoption necessarily produces a bad
  ("expectations-deliverance gap") outcome, instead finding that "if conducted consistently,
  modular adoption can lead to substantial innovation and success." This is a genuine CHALLENGE
  to an unqualified PCS-as-red-flag framing: it shows the same category-adoption mechanism Q1
  is asking about can be adaptive rather than a failure mode, at least in the ASEAN case studied
  (single market, dispute settlement mechanism).
