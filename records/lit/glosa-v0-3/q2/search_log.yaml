global_track:
  summary: >-
    Real, mixed empirical literature exists on whether a certification-substitute mechanism
    actually delivers checkable rigour without an institutional say-so. On the mechanism-design
    side, Registered Reports (Center for Open Science) and F1000Research's open-peer-review
    model both publish a mechanically-checkable record (an in-principle-accepted protocol; an
    open review report tied to a named Approved/Approved-with-reservations/Not-approved rating)
    in place of an opaque institutional stamp -- structurally close to what Q2 asks whether a
    claim card can do. Against this, the strongest direct empirical test found (Hardwicke et al.
    2021, R. Soc. Open Sci.) checked articles that had already received an open-data badge and
    found open data alone did not ensure the results were actually analytically reproducible;
    Brown (2024, PLOS Biology) documents badges and Registered Reports being gamed in practice
    (a "Preregistered" badge awarded for minimal-detail preregistration; a journal discontinuing
    the badge over exactly this). Dudda et al. (2025, R. Soc. Open Sci.) scoping-reviews the
    wider open-science-intervention literature and finds only a small fraction of studies (15 of
    many candidate interventions) directly measured an effect on reproducibility/replicability
    at all -- most evidence is proxy-outcome, not a direct test of the certification-substitute
    claim.
  strength_note: >-
    No source found is a direct test of Q2's specific object (a Rule-17-style claim card +
    I0-I5 independence ladder); the literature tests structurally similar but not identical
    mechanisms (badges, Registered Reports, open review). Evidence tier for the empirical
    badge-reproducibility findings: Dr (well-specified peer-reviewed empirical studies, not
    independently replicated by this search). The mechanism-design sources (COS, F1000) are
    read as primary descriptions of the mechanism, evidence_tier definition/Dr as appropriate,
    not as independent evaluations.
local_track:
  summary: >-
    Thai-language material found is thin and off-angle for Q2's specific question: the one
    kept source (a Mahachulalongkornrajavidyalaya University internal guide to reaching Thai
    Journal Citation Index [TCI] Group 1) documents what formal institutional certification
    actually requires and confers in the Thai academic system (TCI Group-1 status feeds into
    ASEAN Citation Index inclusion) -- useful as CONTEXT_ONLY for what Q2's "institutional
    certification" side concretely is in this workspace's own country, but it does not discuss
    or evaluate any certification-substitute mechanism. The India-USA professors survey
    (Chakravorti et al. 2024, arXiv/PLOS One) is the clearest Global-South-relevant empirical
    source: it finds reproducibility/replicability attention and incentive alignment differ by
    country and argues any intervention (implicitly including a certification substitute) needs
    to be culturally centered rather than assumed to transfer directly.
  result: FOUND
transfer_verdict: TRANSFERS_WITH_ADAPTATION
  # The badge/Registered-Reports gaming and non-reproducibility findings are mechanism-level
  # (about what the badge/protocol process does or fails to enforce), not shown to be
  # Global-North-specific in cause -- but the one Global-South-comparative source found
  # (Chakravorti et al.) explicitly argues incentive/resource context differs by country and
  # institution, and the one Thai source found shows Thailand's own institutional-certification
  # side (TCI) is itself a going, actively-used mechanism, not an absence Q2's argument would be
  # filling -- so a certification-substitute clause would need local adaptation, not a
  # direct drop-in, before it could be said to transfer to this workspace's own setting.
summary_disclaimer: >-
  This is a SCOPING_SEARCH (not a systematic review): 7 sources kept from 8 queries across 2
  query families (support/challenge), one search episode (2026-09-05). WAS found: real
  peer-reviewed empirical evidence that at least one concrete certification-substitute
  mechanism (open-data badges) does not by itself guarantee the checkable rigour it is meant to
  signal, and that badges/Registered Reports are demonstrably gameable in practice; the two
  mechanisms' own primary design descriptions (Registered Reports, F1000Research open review);
  a scoping review showing direct reproducibility-effect evidence for open-science interventions
  generally is thin; one Global-South comparative empirical source; one Thai institutional
  source describing the certification side of the comparison. NOT found: any source that tests
  Q2's actual object (a Rule-17 claim card + I0-I5 ladder) as a certification substitute; any
  source, Thai or otherwise, proposing or evaluating a claim-card-shaped mechanism specifically;
  a source that resolves the gaming/non-reproducibility findings in the substitute-mechanism's
  favor rather than the institutional-certification side's favor. Absence of a direct test is a
  search-coverage fact, not evidence Q2's clause should or should not be formalized (NC-27).
