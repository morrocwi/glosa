    - เกรดคุณภาพหลักฐาน GRADE
  inclusion_exclusion_rules: >-
    INCLUDE: sources discussing (a) formal evidence-grading frameworks (GRADE, AGREE II, or
    equivalent) and how they treat sources that do not self-declare an evidence tier, (b)
    methodological guidance specifically for appraising/including grey literature (policy briefs,
    NGO reports, government technical notes) in a systematic or scoping review, (c) health-policy
    or development-policy grey literature (a working policy brief itself) usable as a worked
    example of a tier-undeclared source, (d) Global South or Thailand/SEA policy-brief practice or
    grey-literature appraisal guidance. EXCLUDE: sources about evidence grading in a purely
    clinical-trial context with no grey-literature/policy-brief angle; general "how to write a
    policy brief" style guides with no evidence-quality/appraisal content; sources using "tier"
    only in an unrelated sense (pricing tiers, org-chart tiers).
