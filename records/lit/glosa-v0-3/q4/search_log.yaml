id: search-glosa-v0-3-001
claim_or_hypothesis_ref: Q4
search_mode: SCOPING_SEARCH
frozen_scope:
  hypothesis_or_falsifier: >-
    Q4 (glosa-v0-3, K2-lrs): policy-brief-style sources (grey literature that makes an
    evidence-based recommendation but does not itself declare a claim-tier / evidence-quality
    grade the way a GRADE-assessed guideline or a peer-reviewed paper's methods section does)
    need a DISTINCT glosa intake rule -- flag-and-request-tier before ingestion -- rather than
    being silently skipped by the existing intake gate, informing FOUNDATION §7.9's Literature
    Review System (LRS) intake rule. Falsifier: the world literature on grey-literature appraisal
    and evidence-hierarchy practice (GRADE, AGREE II, health-policy grey-lit guidance) is found to
    already treat "no declared tier" as equivalent to "excluded/low-confidence by default" with no
    separate flag-and-request-tier step needed -- i.e. existing appraisal frameworks already
    resolve this case by automatic downgrading, not by a distinct request-back-to-source step --
    in which case Q4's proposed new intake rule is redundant with existing practice rather than a
    genuine gap.
  question_type: mechanism
  concepts_synonyms_vocabulary:
    - GRADE evidence quality
    - grey literature appraisal
    - policy brief evidence hierarchy
    - AGREE II guideline appraisal
    - evidence grading unstructured sources
    - claim tiering intake
    - grey literature systematic review inclusion
    - evidence quality rating policy documents
    - การจัดระดับหลักฐานเชิงนโยบาย
