global_track:
  summary: >-
    A real methodological literature exists, but no source found uses Q4's own phrase
    ("flag-and-request-tier before ingestion") or tests glosa's specific intake-gate mechanism.
    SUPPORT: an empirical review of 100 recent systematic reviews (Khalil et al. 2026) finds
    formal grey-literature screening (89%) far outpaces separate appraisal (19%) and states there
    is "no universally accepted guidance" for appraising grey literature -- a real, measured gap;
    the MOS field's own history (Adams, Smart & Huff 2016/2017) shows a discipline noticing this
    exact gap and building explicit new guidelines to close it; and a philosophy-of-policy-evidence
    paper (Parkhurst & Abeysinghe 2016) argues policy evidence needs case-specific
    "appropriateness" judgment rather than a single hierarchy check, which favors a distinct,
    deliberate handling step over silent skip. CHALLENGE: GRADE's own foundational text (Balshem
    et al. 2011) treats tiering as inherently the reviewer's/review-team's job applied to a body
    of evidence, not something an individual source is expected to self-declare, so "lacking a
    declared tier" may be the normal state, not an anomaly; and two independently-converging grey-
    literature appraisal tools -- the AACODS checklist (Tyndall 2010) and a WHO evidence-synthesis-
    for-policy methods guide that points reviewers to AACODS (Karlsson & Takahashi 2017) -- both
    explicitly name "a policy brief" as their worked example and answer it with a generic
    trace-to-original-and-judge appraisal step, not a distinct request-a-tier-from-the-source step.
  strength_note: >-
    No source tests glosa's own K2-lrs intake-gate design directly; the global literature
    establishes (a) a real, measured appraisal gap for grey literature generally and (b) at least
    two established generic checklists that already claim to cover the policy-brief case without a
    distinct request-tier mechanism, so this is a genuine unresolved methodological tension in the
    literature itself, not a one-sided answer. Evidence tier for the surrounding premises: Dr
    (well-specified peer-reviewed/institutional claims, not independently replicated by this
    search).
local_track:
  summary: >-
    No Thai-language source was found on-topic for Q4 despite two dedicated Thai-language query
    attempts (results were general Thai public-policy-process and ISO-quality-policy content,
    excluded per the frozen inclusion/exclusion rule -- a real local-context gap, not evidence
    against Q4). Two Global South/English-language empirical sources were found instead and kept:
    a Latin America/Caribbean clinical-guideline mapping study (Cabrera & Pardo 2019, Colombia-
    based, Globalization and Health) showing a real 9776-document regional screening pipeline
    already resolves "no declared grading methodology" by sorting into an explicit residual
    classification bucket rather than pausing to request a declaration; and a West African
    regional-health-body guidance-development study (Uneke et al. 2020, Nigeria/WAHO,
    Globalization and Health) showing ECOWAS's own evidence-based-policymaking guidance
    deliberately treats a wide range of ungraded evidence (anecdotal, expert judgement, local
    knowledge) as legitimate policy evidence by design -- both complicate a framing that treats
    "no declared tier" as inherently suspect. One grey/institutional source with clear policy-
    synthesis intent (Karlsson & Takahashi 2017, WHO Regional Office for Europe Health Evidence
    Network Synthesis Report No. 50) and one grey/institutional checklist itself (AACODS, Tyndall
    2010) were also kept, both directly naming "a policy brief" as their worked example.
  result: FOUND
transfer_verdict: TRANSFERS_WITH_ADAPTATION
  # The measured appraisal-practice gap (Khalil et al.) and the "appropriateness not hierarchy"
  # argument (Parkhurst & Abeysinghe) plausibly transfer to Q4's glosa-intake-gate setting -- the
  # underlying problem (a source with no self-declared evidence quality needs SOME deliberate
  # handling) is not shown to be domain- or discipline-specific. But two independently-converging
  # generic checklists (AACODS; the WHO HEN guide that routes to it) already claim coverage of
  # exactly the policy-brief case via a trace-to-original appraisal step rather than a distinct
  # request-tier step, and GRADE's own foundational text treats tiering as the reviewer's job, not
  # the source's -- so this is an adaptation-with-caveats verdict: the literature supports SOME
  # deliberate, non-silent handling of tier-undeclared policy-brief-style sources, but does not
  # clearly support Q4's SPECIFIC proposed mechanism (flag-and-request-tier back to the source)
  # over the alternative already used elsewhere (reviewer-side generic critical appraisal without
  # contacting the source).
summary_disclaimer: >-
  This is a SCOPING_SEARCH (not a systematic review): 8 sources kept from 10 queries across 2
  query families (support/challenge, including 2 Thai-language queries) and one search episode
  (2026-09-05). WAS found: (a) a measured, real gap in current systematic-review practice between
  formal screening and separate appraisal of grey literature; (b) a disciplinary precedent (MOS
  studies) of a field noticing this exact gap and building new explicit guidance; (c) a
  philosophy-of-policy-evidence argument that case-specific appropriateness, not a single
  hierarchy check, should govern judging policy evidence; (d) GRADE's own foundational framing
  that tiering is reviewer-side, not source-side; (e) two independently-converging generic
  grey-literature checklists that already name "a policy brief" as their worked example and route
  it through trace-to-original appraisal, not a request-tier step; (f) two Global South empirical/
  institutional sources (Latin America/Caribbean, West Africa/ECOWAS) showing real institutional
  practice classifies tier-undeclared sources into explicit buckets or treats ungraded evidence as
  legitimate by design, rather than defaulting to silent exclusion. NOT found: any source testing
  glosa's own K2-lrs intake-gate mechanism directly; any source using the phrase
  "flag-and-request-tier"; any on-topic Thai-language source despite two dedicated Thai-language
  query attempts (a real search-coverage gap, not a verdict on Q4 itself, NC-27).
