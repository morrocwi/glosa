exact_passage: Rather than adhering to a single hierarchy of evidence to judge what
  constitutes "good" evidence for policy, it is more useful to examine evidence through
  the lens of appropriateness. The form of evidence, the determination of relevant
  categories and variables, and the weight given to any piece of evidence, must suit
  the policy needs at hand.
