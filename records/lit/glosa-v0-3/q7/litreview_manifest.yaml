  exact_passage: Scholastic philosophy took as its own Aristotle's radical rejection of actual infinity
    and expressed it in the famous thesis infinitum actu non datur. Most medieval and modern scholars
    adhered to it, and until the end of the 19th century, only potential infinity was almost exclusively
    considered acceptable. The question of actual infinity became at the time a theological question since
    infinity was one of the attributes of God. Its use in mathematics was viewed with suspicion by theologians
    because it might be an assault on the unique and absolute nature of God.
