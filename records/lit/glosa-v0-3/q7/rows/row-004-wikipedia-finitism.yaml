how_it_sees_the_problem: Finitism denies infinite sets exist as mathematical objects at all -- a flat rejection
  of actual infinity grounded in ontological economy, with no transcendence claim on either side (it does
  not deny God's infinity; it simply has nothing to say about it, staying entirely within mathematical
  ontology).
what_it_separates: Separates individual natural numbers (each finite, accepted) from "the set of all natural
  numbers" as a completed object (rejected) -- a set-theoretic/ontological separation with no transcendence
  category.
what_it_assumes: Assumes mathematical existence claims must be finitely groundable; does not address whether
  infinity, as a concept, could still be meaningful OUTSIDE mathematics (e.g. theologically) even while
  being rejected WITHIN mathematics -- the source is silent on that question rather than taking a position
  against it.
