exact_passage: Since for the intuitionist all infinity is potential, infinite objects can only be grasped
  via a process that generates them step-by-step. What will be allowed as a legitimate construction therefore
  decides which infinite objects are to be accepted. For example, in most other forms of constructivism
  only computable rules for generating such objects are allowed, while in Platonism infinities are considered
  to be completed totalities whose existence is accepted even in cases when no generating rules are known.
