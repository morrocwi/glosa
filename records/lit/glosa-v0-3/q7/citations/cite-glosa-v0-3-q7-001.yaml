exact_passage: Aristotle postulated that an actual infinity was impossible, because
  if it were possible, then something would have attained infinite magnitude, and
  would be "bigger than the heavens." However, he said, mathematics relating to infinity
  was not deprived of its applicability by this impossibility, because mathematicians
  did not need the infinite for their theorems, just a finite, arbitrarily large magnitude.
