  summary: '10 of 14 named H1 relatives reached VERIFIED status with a directly fetched, mechanically
    passage-checked, cross-vendor-confirmed (route:claude I1) exact quotation. The closest single
    near-neighbor found is Kolchinsky & Wolpert 2018, whose semantic-information framework already
    layers a semantic definition on top of a prior syntactic/statistical layer via a single
    causal-necessity/viability criterion -- structurally adjacent to H1''s claimed admission order,
    but without H1''s four named gates (reader, translation, loss, dynamics-preservation) or a
    provenance record; recorded as bearing CHALLENGES / stance NO (undermines H1''s distinctiveness
    claim on the coarser two-layer-order question, though not a full match on the four-gate
    specifics). Lumpability (Faccin et al. 2020 / Buchholz 1994) supplies a clean, independently
    verified match for exactly ONE of H1''s four named gates (dynamics-preservation); MDP
    approximate homomorphisms (Ravindran & Barto 2004) and the information bottleneck (Tishby,
    Pereira & Bialek 1999) each supply a clean match for the ''loss'' gate alone. No single fetched
    source combines all four gates with a provenance record the way H1 claims; the two own-lineage
    sources (Readout Genesis Synthesis, The Readout Condition) are the only fetched sources that
    state the full admission-order + provenance architecture, and they are the position under test,
    not independent evidence.'
  strength_note: 'All 10 VERIFIED cards passed a mechanical verbatim-passage check against directly
