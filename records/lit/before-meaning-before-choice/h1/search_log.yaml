frozen_scope:
  hypothesis_or_falsifier: 'H1 (admission order, root gate): human-semantic and agentic categories
    are admitted only after a non-semantic retained-state layer has passed explicit reader,
    translation, loss and dynamics-preservation gates; what distinguishes the architecture from its
    relatives is this admission order with provenance, not any single construct. Falsifier: a
    published framework that already admits meaning/experience/agency only after an explicit
    reader+translation+loss+dynamics-preservation gate from a non-semantic retained layer (then
    H1 is same, not different).'
  question_type: mechanism
  concepts_synonyms_vocabulary:
    - difference that makes a difference
    - semantic information / non-semantic information
    - bisimulation / behavioural equivalence
    - lumpability / state aggregation
    - MDP / SMDP homomorphism
    - causal states / computational mechanics
    - information bottleneck
    - perspectivism / scientific representation
    - admission order / provenance gate
  inclusion_exclusion_rules: 'Include: published (or open preprint) frameworks that define an
    explicit reduction/aggregation/abstraction step over a non-semantic retained-state
    representation, prior to or independent of a semantic/agentic layer, named in QUESTIONS.md
    H1 relatives. Exclude: work that only asserts semantic content is grounded in physical state
    without an explicit gate (reader/translation/loss/dynamics-preservation) as a distinguishable
    step.'
  time_window: '1972-2022 (Bateson 1972 to Massimi 2022), open access or freely fetchable copy only'
