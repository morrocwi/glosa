how_it_sees_the_problem: 'Epistemic warrant requires a three-part norm on every claim-level distinction:
  existence (a provenance path), attribution (licensed by the actual source), and disclosure (augmentations
  stay visible to audit).'
what_it_separates: the distinctions a claim makes from the access sources actually licensed to supply
  them, tracking provenance/attribution/disclosure as three separate, auditable requirements.
what_it_assumes: that every claim-level distinction can in principle be traced to a specific access source,
  model, or decision rule that supplied the discrimination.
