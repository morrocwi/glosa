  a legitimate defeater would be a showing that the three-part existence/attribution/disclosure norm here
  is not actually what H1's four gates (reader/translation/loss/dynamics-preservation) reduce to, i.e.
  that H1's paper does not in fact implement this norm on its own admission order.
what_it_would_say_against_us: As the position under test, this source does not argue against itself; the
  human review must confirm the paper actually being drafted as H1 (Before Meaning, Before Choice) implements
  the existence/attribution/disclosure norm on its own four gates, rather than merely gesturing at this
  companion paper.
