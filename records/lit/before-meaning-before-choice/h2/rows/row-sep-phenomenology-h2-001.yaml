how_it_sees_the_problem: 'Consciousness is essentially intentional: the central structure of any experience
  is its directedness toward an object, given through the experience''s own content or meaning.'
what_it_separates: the intentional content/meaning of an experience from the object it is about, and from
  the enabling background conditions that make the directedness possible.
what_it_assumes: that intentional directedness is available to first-person description as the basic structure
  of experience, not a construction built up afterward from a more primitive non-semantic layer.
stance: 'NO'
