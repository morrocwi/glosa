legitimate_defeater: A passage in this or another phenomenological source that itself derives intentional
  structure FROM a prior non-semantic retained layer, with an explicit loss/defect accounting per translation,
  would defeat this row's disagree reading (then 'same', per H2's own falsifier).
what_it_would_say_against_us: If intentionality is the central, defining structure of experience itself
  rather than something meaning gets attached to afterward, there is no experience-shaped remainder left
  over once you strip away the semantic/intentional layer for H2 to derive meaning from.
