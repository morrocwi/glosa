global_track:
  summary: 'Of 12 sources named or reachable from QUESTIONS.md H2, 8 reached VERIFIED
    status (6 with full open text, 2 at abstract level) and 4 were parked
    (2 real-but-mechanically-unconfirmed full-text cards, 2 fully unreachable
    closed monographs, 1 unreachable journal article). The one directly on-topic
    full-text rival source obtained (SEP Phenomenology) CHALLENGES H2 by
    presenting intentionality as experience''s own basic/primitive structure
    rather than something derived after a non-semantic layer. The formal rival
    (active inference / Parr, Pezzulo & Friston 2022) was read in full at chapter
    level and does state its own explicit generative-model-before-posterior
    derivation order (ORTHOGONAL: a different, non-semantic-difference-free
    architecture that nonetheless also makes an order claim) but could not be
    machine-reverified after the fact due to Wayback Machine serving-inconsistency,
    so it is parked rather than left as VERIFIED on a stale mechanical check.
    No independently-authored (non-own-lineage) full-text source directly
    confirmed H2''s specific two-layer admission order; the strongest direct
    supporting statements found are all own-lineage (Experience Is Meaning-Giving,
    Meaning Before Naming, Experience Is the Human LoRA, Readout Genesis).'
  strength_note: 'Weak-to-moderate: the hypothesis''s own programme states its
    claim clearly and consistently across 4 own-lineage sources, but the only
    fully-read independent literature obtained so far (SEP Phenomenology) reads
    as a genuine rival/challenger rather than a confirming source, and two
    named enactivist relatives (De Jaegher & Di Paolo 2007; Di Paolo, Rohde &
    De Jaegher 2010) could not be read in full to test whether they already
    make an equivalent claim (H2''s stated falsifier condition). Absence of a
    fetched De Jaegher & Di Paolo full text is a real evidence gap, not a
    finding that they disagree.'
