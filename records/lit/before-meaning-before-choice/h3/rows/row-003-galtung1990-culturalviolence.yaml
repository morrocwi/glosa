$schema: dialogue_table_row.schema.json
hypothesis_ref: H3
source_label: Galtung (1990), "Cultural Violence", p.291 (Journal of Peace Research
  27(3))
how_it_sees_the_problem: Cultural violence is the symbolic work (religion, ideology,
  language, art, science) that makes direct or structural violence look legitimate
  or normal, rather than an act of force itself.
what_it_separates: Separates the FORCE that closes a channel from the LEGITIMATION
  that keeps the closure unremarked and unchallenged -- force and its cultural cover
  are two different mechanisms.
what_it_assumes: Assumes legitimation is itself analyst-identifiable as such; does
  not specify how an outside observer would distinguish a channel that is closed-and-legitimated
  from one that was never live to begin with, which is the discrimination H3's live-possibility
  field is meant to make.
stance: 'YES'
defeater_class: constitutive
legitimate_defeater: A passage where Galtung shows cultural violence operating only
  AFTER an explicit prohibition (rather than pre-empting the need for one) would weaken
  this row's reading of 'power before prohibition'.
what_it_would_say_against_us: Cultural violence legitimates existing direct/structural
  violence; it does not by itself claim to act BEFORE any prohibition exists -- H3's
  stronger claim (that power shapes the live-possibility field even where no prohibition,
  explicit or structural, is yet in place) goes beyond what this passage documents.
citation_card: cite-galtung1990-culturalviolence-bmbc-003
