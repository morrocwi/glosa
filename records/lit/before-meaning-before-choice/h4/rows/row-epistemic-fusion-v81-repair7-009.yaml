how_it_sees_the_problem: A single in-session retention scalar (ηs) is not a
  sound basis for inferring durable residue after a human-AI session ends; the
  fix ("Repair 7") is to keep the scalar as a conceptual session-end gate but
  estimate the actual durable residue through a separate, later, unaided return
  battery (reconstruction, discrimination, transfer, next-question quality).
what_it_separates: the conceptual session-end retention gate (ηs) from the
  operationalized post-session return measurement (the Y_return battery); frames
  this as a repair to a previously identified measurement weakness in the same
  programme's own session architecture.
what_it_assumes: that an unaided return battery administered at a delay (s+delta)
  is a valid proxy for "durable residue," and that engagement/recall during the
  session are the wrong proxies to substitute for it.
