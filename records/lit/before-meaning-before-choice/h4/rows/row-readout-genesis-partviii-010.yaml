how_it_sees_the_problem: A governance-relevant quantity attached to some component
  (any component, not AI specifically) is meaningful only when its value changes
  under ABLATION of that component (removal) relative to policy or correction --
  i.e. removal-comparison is the general test for whether a component's
  contribution is real, not decorative.
what_it_separates: the presence-conditioned value of a governance operator from
  its ablated (component-removed) value; treats "does removal change anything
  that matters" as the operative question, generalized far beyond human-AI
  interaction.
what_it_assumes: that an ablation/removal comparison (with-component vs.
  without-component) is well-defined and computable for the governance operator
  in question, and that a tolerance threshold (τidle) for "matters" can be set.
