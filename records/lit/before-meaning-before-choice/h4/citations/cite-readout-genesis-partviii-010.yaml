disclosure: 'OWN-LINEAGE SOURCE, not independent literature (I0). This card grounds
  H4 in Readout Genesis''s general ablation/removal principle: a governance quantity
  is only meaningful when its value under ablation (component G removed, i.e. the
  AI/aid taken away) is compared against its value with the component present, and
  only counted as relevant if that comparison exceeds a tolerance. This is a structural
  precursor to H4''s "separately audited quantity" claim, generalized far beyond human-AI
  carryover (this passage is about any governance-relevant component, not AI specifically)
  -- DIRECT support for H4 as restatement of own prior general architecture, not independent
  evidence, and CONTEXT_ONLY in the sense that Part VIII itself never names human-AI
  interaction as the ablated component. | I1 route (claude) judged from fetched metadata/abstract
  + the card''s quoted passage, not full text: Metadata (title, first author Lahtee,
  2026, Zenodo DOI) matches. Passage found verbatim in fetched text near eq. 82 as
  located. Source is own-lineage governance/ablation framework, not human-AI carryover
  evidence; card itself limits scope to one principle. Relevant as context only, not
  evidence for or against H4''s falsifier.'
