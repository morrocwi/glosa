disclosure: 'Verified at abstract/summary level via WebFetch; this session did not
  itself re-derive the effect-size statistics from the raw dataset. This is the closest
  direct empirical support in this source set for H4''s claim that "what survives
  after the AI is removed" is a distinct, separately measured quantity from assisted
  performance: students improved DURING AI-assisted practice but performed WORSE than
  a no-AI control once AI access was removed on the unaided exam -- assisted performance
  did not predict, and in fact inverted relative to, the post-removal state. This
  directly instantiates H4''s falsifier test (assisted-session measures vs. delayed
  unaided return) by finding they diverge, which is evidence AGAINST the falsifier
  (i.e. SUPPORTS H4''s claim that the separate audit is not redundant). | I1 route
  (claude) judged from fetched metadata/abstract + the card''s quoted passage, not
  full text: Crossref title/year/first author (Bastani, 2025, PNAS) match the DOI
  card; the exact passage appears verbatim in the fetched abstract. Source reports
  that assisted performance rose while unaided post-removal performance fell, so assisted
  measures did not predict the unaided return, bearing directly on H4''s separately-audited-survival
  claim. | I1 route (claude) judged from fetched metadata/abstract + the card''s quoted
  passage, not full text: Title, 2025, first author Bastani match. Passage found verbatim
  in fetched abstract. Source reports assisted gains (48%/127%) alongside worse unaided
  performance after removal (17% drop), i.e. assisted measures did not predict unaided
  return, bearing directly on H4''s audited-residue claim. Card correctly notes abstract-level
  verification only.'
