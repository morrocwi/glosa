how_it_sees_the_problem: (from secondary/citing-source characterizations only,
  not the primary text) Human use of automation falls into distinguishable patterns
  -- use, misuse (over-reliance), disuse (under-reliance/neglect), and abuse
  (automation imposed without regard to operator needs) -- each with different
  causes and consequences.
what_it_separates: (secondhand) voluntary engagement/disengagement of automation
  (use) from over-reliance (misuse), under-reliance (disuse), and designer/manager-imposed
  automation without operator support (abuse).
what_it_assumes: (secondhand) that these four categories are jointly useful for
  analyzing any human-automation relationship, prior to the specific case of
  generative-AI carryover H4 addresses.
