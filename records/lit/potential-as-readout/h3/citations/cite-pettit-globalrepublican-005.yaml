exact_passage: 'Abstract: "The concept of freedom as non-domination that is associated
  with neo-republican theory provides a guiding ideal in the global, not just the
  domestic arena, and does so even on the assumption that there will continue to be
  many distinct states." Body (p.3): "you do not enjoy freedom as non-domination or
  independence just by virtue of actually escaping interference; it must also be that
  you would not suffer interference even if you had wished to act otherwise or others
  had not wanted you to be able to act on your wishes."'
