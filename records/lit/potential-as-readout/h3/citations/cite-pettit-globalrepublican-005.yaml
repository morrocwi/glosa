disclosure: 'SUPPORTS H3 directly at the theory level: Pettit''s robustness requirement
  is exactly the test that separates real peace from pseudo-peace in H3. Actual non-interference
  RIGHT NOW ("observed calm") is not enough for non-domination; what matters is whether
  the calm would SURVIVE a change in the dominant party''s will -- i.e. whether the
  correction/voice channel is robustly open, not merely quiet because nobody has tried
  to use it. This maps directly onto H3''s "blocked correction channel" clause: a
  blocked channel that has simply not been tested yet looks identical to an open one
  under Pettit''s "actually escaping interference" reading, which is precisely the
  confound H3 is naming. | I3 route (codex) judged from fetched metadata/abstract
  + the card''s quoted passage, not full text: '
