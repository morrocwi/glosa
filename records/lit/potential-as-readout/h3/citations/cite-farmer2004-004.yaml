disclosure: 'SUPPORTS H3: Farmer''s core move is that visible/local suffering ("what
  is there in front of us", his own later phrase in the same essay) is produced by
  large-scale structures that stay largely invisible ("ethnographically visible" vs.
  the hidden structural cause) -- directly analogous to H3''s "observed calm" (locally
  visible) masking a "blocked correction channel" (structurally invisible, operating
  at a scale the visible surface does not reveal). This card cards the essay''s own
  definitional framing paragraph (p.305); it does not yet quote Farmer''s later explicit
  citation of Galtung''s structural-violence term, which appears further into the
