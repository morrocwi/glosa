exact_passage: Any thorough understanding of the modern epidemics of AIDS and tuberculosis
  in Haiti or elsewhere in the postcolonial world requires a thorough knowledge of
  history and political economy. This essay, based on over a decade of research in
  rural Haiti, draws on the work of Sidney Mintz and others who have linked the interpretive
  project of modern anthropology to a historical understanding of the large-scale
  social and economic structures in which affliction is embedded.
