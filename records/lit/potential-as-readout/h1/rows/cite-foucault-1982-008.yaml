hypothesis_ref: H1
source_label: Foucault 1982, The Subject and Power
how_it_sees_the_problem: Power is not force or consent but the structuring of the
  possible field of action of others; governing = shaping what can be done.
what_it_separates: violence/struggle and voluntary linking (instruments of power)
  from government proper (structuring possible action).
what_it_assumes: that a field of possible action is analyst-identifiable and that
  its structuring is observable in practice.
stance: UNDETERMINED
defeater_class: constitutive
legitimate_defeater: A passage where Robeyns explicitly requires evidence of actual
  achievement or demonstration (not mere availability) before counting something as
  part of a person's capability set would defeat this row's CHALLENGES reading.
what_it_would_say_against_us: If the field of possible action is itself constituted
  by power, no witnessed set is ever independent of the permitting authority, and
  D5 cannot be operationalized.
