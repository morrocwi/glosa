disclosure: 'CHALLENGES H1 as literally stated: Nussbaum''s own formulation defines
  the capability approach around a SET OF OPPORTUNITIES people are able to have (the
  "What is each person able to do and to be?" question), which is asked independent
  of whether that ability is ever witnessed/exercised -- closer to H1''s rejected
  "declared feasible set" framing than to a witnessed-set requirement. See also the
  companion quotation of Sen''s own definition on p.20 of this same fetched excerpt
  (cite-sen-1999-006): "a person''s ''capability'' refers to the alternative combinations
  of functionings that are FEASIBLE for her to achieve" -- Sen''s own word "feasible"
  is the literal term H1''s falsifier clause names. This exact_passage was shortened
  from an earlier draft that spliced two separated sentences with an ellipsis marker;
  rule 17 forbids that, so only the single continuous opening passage is quoted here.
  I3 CROSS-VENDOR ATTEMPT FAILED (codex CLI returned "ERROR: You''ve hit your usage
  limit" -- no content judgment was made; this is an environmental/quota blocker in
  this session, not a finding about the card). independence_class and claim_match_verified
  reflect the prior self-verified (I1) state rather than a spurious I3 result. A genuine
  cross-vendor pass should be re-run once codex/gemini access is available. | I2 route
  (claude) judged from fetched metadata/abstract + the card''s quoted passage, not
