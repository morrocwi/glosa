exact_passage: '"The Capabilities Approach can be provisionally defined as an approach
  to comparative quality-of-life assessment and to theorizing about basic social justice.
  It holds that the key question to ask, when comparing societies and assessing them
  for their basic decency or justice, is, ''What is each person able to do and to
  be?''"'
