disclosure: 'This card is Chaiklin''s OWN reproduction (in quotation marks, with page
  cite) of Vygotsky''s canonical ZPD definition. It directly supports H1: "potential
  development" is defined not as an open/declared capacity but as the level ACTUALLY
  DETERMINED THROUGH an assisted-performance act (problem solving under adult guidance
  or peer collaboration) -- i.e. potential is witnessed via a specific demonstrable
  procedure, not merely asserted. Chaiklin''s own surrounding argument (pp. 2-3, read
  in full) further argues against loose/expansive readings of ZPD ("it will be used
  loosely and indiscriminately, thereby becoming so amorphous that it loses all explanatory
  power", quoting Wertsch 1984 p.7 as quoted by Chaiklin p.2), which is itself consistent
  with H1''s finite/bounded framing of potential against open-ended declaration. |
