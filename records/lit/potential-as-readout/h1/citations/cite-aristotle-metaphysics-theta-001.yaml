disclosure: 'Ross translation, public domain, hosted by MIT Internet Classics Archive.
  Aristotle here defines dynamis (potency/potentiality) as an ORIGINATIVE SOURCE OF
  CHANGE located in a determinate thing (the thing acted on, or the agent itself "qua
  other") -- a bounded, thing-indexed causal power, not an open/unbounded possibility
  space. This is consistent with H1''s claim that potential is not a mere open declaration,
  but the passage itself does not use language of "witnessing" or "finite enumeration"
  -- those are this project''s own vocabulary, not Aristotle''s. Read as a partial,
  structural precursor (a definite source-of-change framing) rather than a full statement
  of H1''s finite-enumerable-witnessed-set claim. | I3 route (codex) judged from fetched
  metadata/abstract + the card''s quoted passage, not full text: '
