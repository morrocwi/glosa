exact_passage: For one kind is a potency of being acted on, i.e. the originative source,
  in the very thing acted on, of its being passively changed by another thing or by
  itself qua other; and another kind is a state of insusceptibility to change for
  the worse and to destruction by another thing or by the thing itself qua other by
  virtue of an originative source of change.
