global_track:
  summary: 'Three independent literatures converge on the same two-layer split H2 proposes. (1) The programme''s
    own ancestors state it formally: Causal Agency Def.3 (p.18) requires C_{t+1}=G(x_t,C_t) with dC/dx
    != 0 AND d(persistence)/dC * dC/dx > 0 for "agency" -- a system that only stabilizes within an already-given
    viable region V (Def.2) but never modifies C is named "proto-agency", not agency; Causal Grammar Table
    1 (p.4) independently encodes the same split socially: "Tension"/"Conflict" regimes leave possibility-space
    contested/stable (layer 1 still open) while "Violence" compresses it and only "Repair" (protected
    reopening of the structure itself) reopens it -- repair is explicitly layer-2 action on the structure,
    not a layer-1 move within it. (2) The capability/agency literature draws the same line under different
    names: Bandura 2001''s agentic perspective distinguishes "personal agency" operating within "a broad
    network of sociostructural influences" from being "producers as well as products of social systems"
    (the production side is layer-2); Kabeer 1999 explicitly separates the "conditions of choice" (the
    structural parameters) from the exercise of choice itself, and frames empowerment as the process of
    *acquiring* the ability to make strategic choices (a layer-2 gain), not merely making them (layer-1);
    Bazzani 2023''s abstract proposes agency as "a conversion process of personal resources shaped by
    conversion factors" operating at "micro, meso, and macro levels", i.e., structural factors external
    to any single layer-1 choice. (3) The information-theoretic empowerment literature (Klyubin 2005,
    Salge/Glackin/Polani 2014) gives layer-1 a precise readout (empowerment = channel capacity of the
    actuation-to-sensor channel, a property of the CURRENT sensor/actuator coupling) while explicitly
    showing this quantity is itself a function of "what the agent''s sensors and actions are" (Salge et
    al. p.19) -- i.e., empowerment is layer-1''s readout GIVEN a fixed structure, and changing that structure
    (the sensor/actuator endowment itself) is a distinct, higher-order move the same papers gesture at
    (evolutionary sensor/actuator selection) without formalizing as a two-layer system the way Causal
    Agency does. Ryan & Deci 2000 supports the premise that a real distinction exists between exercising
    an innate capacity and the social-contextual conditions that "facilitate versus forestall" it, but
    does not itself formalize a layer-1/layer-2 split at the level of a recoverable-gap quantity.'
  strength_note: 'No source found tests H2''s specific quantitative claim (a recoverable gap defined as
    the difference between what layer-1 choice reaches and what layer-2 structural change reaches) as
    a measured quantity; the programme''s own two source documents (Causal Agency, Causal Grammar) state
    the two-layer distinction as a formal/conceptual claim (tier: definition, as read from their own Def.2/Def.3/Table
    1 -- not independently proven here) and the external literature converges on the SAME distinction
    under different vocabulary (Dr: well-specified conceptual/ empirical claims in peer-reviewed venues,
    not independently re-derived by this search). This is convergent conceptual support across independent
    literatures, not a mechanism test.'
