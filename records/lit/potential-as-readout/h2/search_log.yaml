frozen_scope:
  hypothesis_or_falsifier: 'H2 (potential-as-readout): Potential has two layers -- choosing within a given
    constraint structure (layer 1: which admissible move a system selects from the set the structure already
    permits) and changing the structure itself (layer 2: modulating the constraint structure that defines
    what is admissible in the first place -- Causal Agency''s constraint modulation C_{t+1}=G(x_t,C_t)
    with dC/dx != 0 and d(persistence)/dC * dC/dx > 0; Causal Grammar''s repair, the protected reopening
    of a compressed possibility space). The recoverable gap is the difference between what layer-1 choice
    alone can reach and what layer-2 structural change can reach -- a system stuck at layer 1 (Causal
    Agency''s "proto-agency") may have zero recoverable gap even while distress persists, because the
    compression lives in the structure, not in which admissible move was chosen. Falsifier: a documented
    case where all available evidence shows a system/actor exercising only layer-1 choice (no constraint-structure
    modification is present or occurring) yet the outcome differences attributed to "potential" are fully
    explained without reference to any layer-2 structural change -- i.e., the two-layer split adds no
    distinguishing power over a single undifferentiated notion of "capacity to act".'
