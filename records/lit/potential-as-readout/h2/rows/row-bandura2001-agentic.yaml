how_it_sees_the_problem: 'Frames the problem as one of reciprocal causation: personal agency is exercised
  ''within a broad network of sociostructural influences,'' and in the same transactions people are both
  shaped by and shape those structures.'
what_it_separates: 'Separates ''people are products of social systems'' (layer 1: acting as the structure
  allows) from ''people are producers of social systems'' (layer 2: acting so as to change the structure)
  as two roles the SAME agentic transaction plays simultaneously, per the abstract''s own wording -- a
  tighter, more explicit two-layer statement than Ryan & Deci 2000''s facilitate/forestall framing.'
what_it_assumes: This card is abstract-level only (full text not fetched this session); assumes the abstract's
  summary claim ('producers as well as products') is elaborated with a mechanism in the full article that
  was not read here, so the specific correspondence to Causal Agency's dC/dx ≠ 0 condition is a plausible
  reading, not a confirmed one.
stance: UNDETERMINED
