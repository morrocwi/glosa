  agency proper (modifying the structure to raise expected persistence) -- the source's own
  binary, which H2 reads as its own layer-1 (proto-agency) vs. layer-2 (agency) split.
what_it_assumes: Assumes the reader already has §6.4's persistence-regulation definition and
  §6.5's inequality in view; does not itself argue that this binary generalizes to social
  agents under structural deprivation, the domain H2 wants to apply it to.
