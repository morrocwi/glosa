# --- stratified selection table (S14 §5.4/§7.9f) ----------------------------------------------
# Coverage table over (quality_tier x region x language) actually searched, per frozen_scope's
# strata definition (quality x region x language). This is a SCOPING_SEARCH, not a bibliography
# down-select -- every kept candidate is already cited above; this table exists to show which
# cells were reached and which were searched-for-but-empty (NC-27: empty != nothing exists).
strata_table:
  - stratum: { quality_tier: "peer_reviewed", region: "Global North", language: "en" }
    candidates_considered: [cite-rsos-citizen-epistemology-001, cite-cstp-boundary-work-001, cite-rsos-preprint-credibility-001, cite-disclosure-not-documentation-001]
    selected: cite-rsos-preprint-credibility-001
    selection_reason: >-
      Most directly tests H1's actual substitution mechanism (verification/transparency cues
      standing in for institutional prestige) with an empirical survey method; the other three in
      this cell are also kept (all four appear in the dialogue table) because a scoping search of
      this size cites every kept candidate rather than narrowing to one per cell.

  - stratum: { quality_tier: "preprint", region: "Global North", language: "en" }
    candidates_considered: [cite-llm-hallucination-survey-001]
    selected: cite-llm-hallucination-survey-001
    selection_reason: "Only preprint-tier candidate found in this cell; kept for its direct bearing on the independence-ladder rationale."

  - stratum: { quality_tier: "peer_reviewed", region: "Global South (incl. Thailand+SEA)", language: "en" }
    candidates_considered: [cite-pgph-citizen-science-sea-001]
    selected: cite-pgph-citizen-science-sea-001
    selection_reason: "Only peer-reviewed Global South/SEA candidate found; kept despite being orthogonal to H1's actual claim, disclosed honestly rather than dropped."

  - stratum: { quality_tier: "grey_literature", region: "Global South (incl. Thailand+SEA)", language: "en" }
    candidates_considered: [cite-ocsdnet-honf-001]
    selected: cite-ocsdnet-honf-001
    selection_reason: "Strongest Thailand/SEA-relevant grey/community source found (names Thailand, Indonesia, Nepal directly); no peer-reviewed candidate found in this exact cell despite searching."

  - stratum: { quality_tier: "grey_literature", region: "Global North", language: "en" }
    candidates_considered: [cite-scholarly-kitchen-credentialism-001]
    selected: cite-scholarly-kitchen-credentialism-001
    selection_reason: "Only grey/Global-North candidate found in the credentialism-challenge query family."

  - stratum: { quality_tier: "grey_literature", region: "Global South (incl. Thailand+SEA)", language: "th" }
    candidates_considered: [cite-tcij-freelance-th-001]
    selected: cite-tcij-freelance-th-001
    selection_reason: "Only Thai-language candidate found across all query families; kept despite thin topical match (orthogonal), disclosed rather than silently dropped to inflate apparent diversity."

  - stratum: { quality_tier: "peer_reviewed", region: "Global South (incl. Thailand+SEA)", language: "th" }
    candidates_considered: []
    selected: null
    selection_reason: >-
      No Thai-language peer-reviewed source was found despite two Thai-language queries being run
      (support and challenge families). Recorded as LOCAL_EVIDENCE_NOT_FOUND, not
      NO_LOCAL_EVIDENCE_EXISTS (NC-27) -- a search-coverage fact, not proof no such source exists.

  - stratum: { quality_tier: "grey_literature", region: "Global North", language: "other" }
    candidates_considered: []
    selected: null
    selection_reason: >-
      The frozen scope's language_strategy named a third language (ID/MY-region or FR) as a
      deliberate target; no query in a third language was actually run in this pass (only EN and
      TH queries were issued) -- this cell is empty because the search did not reach it, disclosed
      here rather than silently omitted. Flagged as an open item for a follow-up search round.

