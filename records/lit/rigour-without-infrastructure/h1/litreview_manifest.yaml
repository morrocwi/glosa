  blocked_reason: >-
    accuracy_gate FAIL: 0 of 9 citations are status VERIFIED (all 9 sit at METADATA_OK). Every
    claim_match_verified=true on these cards was produced by independence_class I1 (same-session
    AI, this run) -- per AGENTS.md gate rule 3 ("maker != checker != approver; same-model
    self-review has no standing") and P13 L5's own exit gate ("metadata_verified (mechanical) AND
    claim_match_verified (I5 human or decorrelated I3) both true"), an I1 same-session AI check
    cannot upgrade a card past METADATA_OK to VERIFIED. No citation here has yet gone through a
    genuine HUMAN_I5 or DECORRELATED_AI_I3 route (all 9 carry claim_match_verification_route:
    NOT_YET) -- that route has not been run in this task. This is the honest, expected FAIL state
    for an AI-only search-and-extraction pass, not an error to paper over; per P13's "gate into
    method design and paper," no lit-review section may be drafted from this manifest until an
    independent route is actually run and the accuracy_gate is re-computed.

