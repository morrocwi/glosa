# --- honest note on the CLI run ---------------------------------------------------------------
# `./cli/glosa lit manifest rigour-without-infrastructure H1 --human-owner founder --freeze` was
# run first (per task instructions) and did write a file at this path, but its `citations` list
# was built by dumping raw citation_card payloads (id/claim_ref/... shape) directly into the slot
# the manifest schema defines with a DIFFERENT required shape (citation_card_id/identifier_kind/
# claim_match_verification_route/...) -- `cmd_lit_manifest`'s `scaffold_litreview_manifest` in
# `cli/glosa` does not translate between the two. The kernel's own `lit_gate` check on that CLI
# output failed schema validation (9x missing citation_card_id/identifier_kind/
# claim_match_verification_route). This is a real CLI bug (`scaffold_litreview_manifest` builds
# the wrong per-citation shape), reported below rather than silently worked around; this file
# REPLACES that invalid CLI output with a hand-built, schema-valid manifest carrying the identical
# underlying citation data (same 9 `citation_card.yaml` files under `citations/`, same dialogue
# rows under `rows/`) translated into the shape `litreview_manifest.schema.json` actually
# requires. No citation content was changed to do this -- only the container shape.

