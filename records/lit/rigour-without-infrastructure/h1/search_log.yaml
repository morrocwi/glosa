    citizen-science or community-science epistemic practice, especially Thai/SEA grassroots or
    grey-literature examples. EXCLUDE: sources purely about AI capability benchmarks with no
    epistemic/verification angle; sources that are themselves uncredentialed blog opinion with no
    described method (may be logged as grey literature but not used to support/disagree with H1
    without a readable method); marketing material for a commercial AI-detection product.
