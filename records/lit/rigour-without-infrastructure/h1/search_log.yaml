id: search-rigour-without-infrastructure-001
claim_or_hypothesis_ref: H1
search_mode: SCOPING_SEARCH
frozen_scope:
  hypothesis_or_falsifier: >-
    H1 (DESIGN, GLS-2026-001): If every claim a standalone scholar (no university, no lab, no
    research team) produces is recorded as a claim card that answers the founder's five questions
    (what was actually seen / what the data separates / what AI filled in / what is assumed / what
    independent test, if any, it has survived), tied to the Readout Condition's
    Existence-Attribution-Disclosure conditions, and passed through the independence ladder before
    any public release -- then a person with no institutional affiliation can co-produce knowledge
    with AI whose rigour a reader can check for themselves, without an institutional credential
    serving as the thing that certifies it. Falsifier: a real claim card that passes every
    mechanically-checkable schema field is nonetheless found by a genuine independent reviewer
    (I5) to have a false answer at Q2 (evidence/authority-to-believe) or Q3 (AI-fill disclosure).
