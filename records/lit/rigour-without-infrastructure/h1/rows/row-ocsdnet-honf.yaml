how_it_sees_the_problem: >-
  Frames the problem in the field/practice terms H1 actually cares about: how open-science and
  citizen-science practice actually operates "between formal and informal institutions" in three
  named countries (Indonesia, Thailand, Nepal), through grassroots practitioner and university
  collaboration.
what_it_separates: >-
  Separates "formal institution" from "informal institution" as two real, coexisting channels for
  producing science in this regional context -- coarser than H1's own five-question claim-card
  structure (this project page does not describe a per-claim verification mechanism), but
  empirically grounds H1's premise that non-institutional knowledge production is a live regional
  practice, not a hypothetical.
