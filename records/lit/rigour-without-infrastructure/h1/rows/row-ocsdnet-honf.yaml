  Assumes workshop-based ethnographic engagement is a legitimate way to study/produce this
  knowledge; does not describe any AI involvement, disclosure structure, or independence-ladder
  mechanism -- H1's specific machinery is not present in what this project describes, only its
  general setting (non-institutional, cross-Thailand/SEA science practice).
