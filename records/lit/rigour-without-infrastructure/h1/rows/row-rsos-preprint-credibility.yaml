hypothesis_ref: H1
source_label: "Soderberg, Errington & Nosek 2020, Credibility of preprints: an interdisciplinary survey of researchers (Royal Society Open Science)"
how_it_sees_the_problem: >-
  Frames it as a measurement problem: given that a preprint lacks the traditional signal of
  journal-brand prestige, what cues do working researchers actually use to judge whether to trust
  it? Surveys ~1,800 researchers on which credibility cues they rate as important.
what_it_separates: >-
  Separates "prestige-based" credibility cues (journal name, author affiliation) from
  "content/process-based" cues (open data, open materials, independent verification of claims,
  preregistration) -- and finds researchers rate the second family as highly important precisely
  when the first family is absent, which is structurally the same situation H1 is describing for a
  standalone scholar.
what_it_assumes: >-
  Assumes the survey population (researchers already embedded in the preprint/open-science
  ecosystem) generalizes to a broader reading public including outside a standalone scholar's own
  field; does not test AI-assisted claim cards or an independence ladder specifically -- it
  supports the *premise* that verification cues can substitute for prestige, not the *specific
  design* H1 proposes.
stance: "YES"
what_it_would_say_against_us: >-
  Could note the surveyed population is itself academically credentialed (researchers judging
  preprints, not lay readers judging a standalone scholar with zero institutional trace) -- the
  substitution effect found here may not transfer to a reader population with no prior trust
  relationship to research culture at all, which is closer to H1's actual target reader.
citation_card: cite-rsos-preprint-credibility-001
verified:
  metadata_verified: true
  claim_match_verified: true
