hypothesis_ref: H1
source_label: "Scholarly Kitchen guest post 2026, The Guild and the Gap: What One Rejection Revealed About the Cost of Credentialism"
how_it_sees_the_problem: >-
  Frames the problem as a live editorial-policy case study: a preprint server rejected a
  content-complete submission specifically because the author lacked a record of prior
  peer-reviewed publications, and the same content was then accepted, unchanged, elsewhere --
  showing the filter was about the author's institutional track record, not the work itself.
what_it_separates: >-
  Separates "evaluating the work on its own content" from "evaluating the author's prior
  publication pedigree" -- the exact distinction H1's claim card is designed to make possible
  (a reader/reviewer checks the claim's own recorded structure, not the author's CV).
what_it_assumes: >-
  Assumes this one documented rejection is representative of a broader pattern rather than an
  isolated moderation decision; does not describe any structured claim-card or independence-ladder
  alternative -- it argues credential-gating is a policy choice, without itself proposing or
  testing a replacement mechanism like H1's.
stance: UNDETERMINED
what_it_would_say_against_us: >-
  The rejection episode itself is direct evidence that real gatekeepers, right now, use
  institutional/credential signals rather than claim-level content checks -- exactly the practice
  H1 says should not be necessary. Whether a claim card would have changed this specific outcome is
  untested (the moderator's stated reason was prior-publication history, not absence of a
  structured claim record) -- recorded as undetermined rather than assumed either way.
citation_card: cite-scholarly-kitchen-credentialism-001
verified:
  metadata_verified: true
  claim_match_verified: true
