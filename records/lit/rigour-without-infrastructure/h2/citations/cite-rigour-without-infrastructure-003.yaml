exact_passage: '"We surveyed the credibility-building strategies of 30 citizen science programs that monitor
  environmental aspects of the California coast. We identified a total of twelve strategies: Three that
  are applied during training and planning; four that are applied during data collection; and five that
  are applied during data analysis and program evaluation... Our results illustrate those tradeoffs and
  provide a framework for the necessary discussions between citizen science programs and potential users
  of their data -- including scientists and decision makers -- about shared expectations for credibility."'
