exact_passage: '"ความเชื่อถือได้ (Trustworthiness) ซึ่งพัฒนาโดย Lincoln และ Guba (1985)
  เพื่อเป็นเกณฑ์ในการประเมิน คุณภาพของงานวิจัย แนวคิดนี้เปรียบเสมือนมาตรฐานที่ยืนยันว่าข้อค้นพบจากงานวิจัยนั้น
  \"เชื่อถือได้ สอดคล้อง และเกิดขึ้นจากข้อมูลจริง\" โดยประกอบด้วย 4 องค์ประกอบสำคัญ
  ได้แก่ 1) ความน่าเชื่อถือ (Credibility) 2) ความสามารถในการโอนย้าย (Transferability)
  3) ความสอดคล้อง (Dependability) และ 4) ความสามารถใน การยืนยัน (Confirmability)"
  (p. 67) -- English abstract on the same page: "the article presents the application
  of the ''Trustworthiness'' framework developed by Lincoln and Guba (1985) as a standard
  for quality assurance... Confirmability emphasizes neutrality, ensuring that interpretations
  are derived from actual data rather than the researcher''s imagination, often documented
  through an audit trail."'
