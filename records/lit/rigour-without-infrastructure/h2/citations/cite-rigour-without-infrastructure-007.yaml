exact_passage: '"Citizen science (CS), a collaboration between people and scientists, is a viable approach
  utilizing citizens experiences in COVID-19 pandemic to manage future response. This study aimed to understand
  concepts, experiences, approaches, and sustainability issues of CS among citizens in five South and
  Southeast Asian countries. A qualitative study was carried out in Nepal, Bangladesh, India, Philippines,
  and Indonesia from October 2022 to March 2023... Some participants expressed lack of confidence and
  language barriers as notable concerns while sharing their opinions with stakeholders (policymakers and
  researchers)."'
