hypothesis_ref: H2
source_label: 'The Civilization of Knowledge: Who Has the Authority to Interpret the World (Lahtee, Zenodo
  10.5281/zenodo.18943971)'
how_it_sees_the_problem: Sees the history of knowledge as a succession of agencies authorized to interpret
  the world's signals and stabilize interpretations as social reality -- authority, not just accumulation
  of truths, is what changes across eras.
what_it_separates: Separates a raw signal/trace from a stabilized, socially authorized interpretation
  of it -- and locates the stabilizing step in institutions, procedures, or recognized interpreters historically,
  not in the claim's own recorded structure.
what_it_assumes: Assumes social authorization is a necessary step for a signal to become 'knowledge' in
  a civilizational sense; does not evaluate whether a machine-checkable claim-card schema could itself
  function as a new (non-institutional) stabilization mechanism.
stance: UNDETERMINED
what_it_would_say_against_us: Would say H2 risks mistaking a technical recording format for the social
  authorization step this paper argues has always been doing the actual stabilizing work -- a claim card
  with perfect internal structure may still lack the socially-authorized interpreter role this paper says
  is required.
