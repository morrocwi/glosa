hypothesis_ref: H2
source_label: 'The Readout Condition: Distinguishability, Access, and Epistemic Warrant (Lahtee, Zenodo
  10.5281/zenodo.22301318)'
how_it_sees_the_problem: Sees epistemic warrant as attaching to a specific claim-level distinction, checked
  against the source that actually licensed it, rather than to an institution issuing the claim.
what_it_separates: Separates existence, attribution, and disclosure as three independently-checkable conditions
  -- a claim satisfying all three does not need an institution to vouch for it.
what_it_assumes: Assumes the audit trail (provenance path) is recoverable in principle; does not itself
  argue institutions add nothing, only that the norm is defined at claim grain.
stance: UNDETERMINED
what_it_would_say_against_us: Would ask whether disclosure ('essential augmentations remain visible to
  audit') is actually achievable without some institutional or third-party audit function to check it.
