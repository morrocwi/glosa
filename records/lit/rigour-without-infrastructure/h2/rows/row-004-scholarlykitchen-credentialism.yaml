hypothesis_ref: H2
source_label: "Scholarly Kitchen guest post, 'The Guild and the Gap...' + comments (EN, grey/community, 2026)"
how_it_sees_the_problem: >-
  Sees the problem from the rejected submitter's side: a repository declined to even evaluate
  the substance of a submission because the author had "no record of previous relevant
  peer-reviewed publications" -- and from two commenters' side, who defend that exact practice
  as a legitimate scrutiny-calibration signal.
what_it_separates: >-
  Separates "evaluating the work on its own merits" from "using prior publication record/
  affiliation as a pre-filter for whether the work gets evaluated at all" -- and the commenters
  explicitly argue the second is necessary, not merely convenient.
what_it_assumes: >-
  The defending commenters assume that a good record/track history is evidence of training,
  supervision, and accountability that a first-time, unaffiliated submitter's material cannot
  yet demonstrate on its own -- i.e. the credential is doing evidentiary work about the *person*,
  not just about the *claim*.
stance: "NO"
what_it_would_say_against_us: >-
  This is close to being the falsifier itself: a named commenter states "I give much more
  scrutiny to someone with no prior record and sketchy identity credentials than I do to a
  well-established academic" -- i.e. an intended reader/gatekeeper treats affiliation/publication
  history as load-bearing beyond what any single record could substitute for, exactly the class
  of case H2's own falsifier names.
