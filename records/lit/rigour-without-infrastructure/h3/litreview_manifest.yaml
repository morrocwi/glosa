gate:
  accuracy_gate: FAIL
  # Honest FAIL, not an error state (S14 worked-example pattern): all 10 citations reached
  # metadata_verified=true and claim_match_verified=true, but the verifying route was this SAME
  # AI session (independence_class I1) -- per FOUNDATION_v0.5 S14 L5 and this task's own binding
  # instruction, status may only reach VERIFIED via a genuinely decorrelated I3+ AI route or a
  # human I5 route (claim_match_verification_route: HUMAN_I5 | DECORRELATED_AI_I3), never NOT_YET.
  # This manifest has zero VERIFIED citations by construction of this pass; accuracy_gate == FAIL
  # is the correct, undisguised state, matching D-SAME-VENDOR/D-CITATION-UNVERIFIED.
  diversity_gate: PASS_WITH_LIMITS
  # Corrected from the CLI scaffold's crude "PASS if total_citations > 0" placeholder (which does
  # not itself compute concentration) after a manual diversity_audit pass found two real,
  # disclosed concentrations (90% English-language; 60% undetermined author geography) --
  # PASS_WITH_LIMITS is the honest value per S14's own rule ("a disclosed concentration downgrades
  # to PASS_WITH_LIMITS ... a real, disclosed concentration is honest; a fabricated 'diverse'
  # claim is not"). The stratification FLOOR this task set (>=2 Thai/SEA, >=2 Global South, >=1
  # grey/community, >=8 total candidates) IS met -- see manifest-level counts below -- which is
  # why this is PASS_WITH_LIMITS and not FAIL.
  overall: FAIL
  # overall FAIL is driven entirely by accuracy_gate == FAIL (S14 rule: diversity failing alone
  # would only downgrade to PASS_WITH_LIMITS, but accuracy_gate itself must be in
  # {PASS, PASS_WITH_LIMITS} for overall to reach anything but FAIL, and it is not).
  blocked_reason: >-
    accuracy_gate == FAIL: all 10 citations are status METADATA_OK (metadata_verified=true,
    claim_match_verified=true, both confirmed only by this same AI session -- independence_class
    I1). None has reached VERIFIED because none has a HUMAN_I5 or DECORRELATED_AI_I3
    claim_match_verification_route yet (all currently NOT_YET). Per P13's gate ("no lit-review
    section may be drafted ... until gate.overall in {PASS, PASS_WITH_LIMITS}"), this hypothesis's
    lit-review section may NOT be drafted into paper/main.md on the strength of this manifest
    alone -- the next required step is routing at least the spot-check sample (S14 5.4: 20% of
    10 -> 2 citations, small_n_rule not applicable at n=10) through a genuinely decorrelated I3 AI
    route or a human (founder) I5 read, per P13's "best a human can do" standard.
