  # non-schema-required field) so the disclosure is not lost -- read alongside disclaimers_emitted.
  D-CITATION-UNVERIFIED: >-
    Every citation in this manifest is METADATA_OK, not VERIFIED -- claim_match_verified was
    confirmed only by the same AI session that drafted this manifest (independence_class I1).
    Treat every quoted passage/stance in this manifest and its dialogue_table.md as candidate
    evidence pending an I3+ or human I5 check, not as settled.
  D-SAME-VENDOR: >-
    The sole verifying route for all 10 citations so far is this single Claude (Anthropic)
    session -- no cross-vendor or cross-session AI route, and no human read, has yet independently
    re-derived any exact_passage or stance in this manifest.
  D-LIT-MODE: "This is a SCOPING_SEARCH (search_log.yaml search_mode), not a SYSTEMATIC_REVIEW -- bounded by a stopping rule (>=8 candidates + stratification floor, or 6 query rounds), not exhaustive."
  D-LIT-CONCENTRATED: "Two disclosed concentrations in diversity_audit.concentration_flags: 90% of sources are English-language; 60% have undetermined author geography/institution (see diversity_audit above for both)."
  D-COMPARISON: "Every neighbour/source comparison in dialogue_table.md is same/different/cited language only -- no novelty or priority claim is made for H3 or for glosa relative to any source here."
