rejected_candidates:
  # Candidates opened/considered but NOT turned into citation_cards, with an honest reason each
  # (never silently dropped) -- part of the same-session L3/L4 record.
  - label: "Png (2022), At the Tensions of South and North: Critical Roles of Global South Stakeholders in AI Governance (FAccT'22, DOI 10.1145/3531146.3533200)"
    reason: >-
      Fetched via Crossref (mechanical): sole author's affiliation is recorded as "Oxford Internet
      Institute, United Kingdom" -- a Global North institution, despite the paper's own Global-
      South-centered standpoint and subject matter. Not used toward the Global South stratum count
      to avoid gaming diversity_audit by author-institution vs subject-matter conflation; not
      otherwise on-topic enough for H3's mechanism to warrant a card on other grounds within this
      SCOPING_SEARCH's stopping rule.
  - label: "Adebara et al., Where Are We? Evaluating LLM Performance on African Languages (arXiv:2502.19582)"
    reason: >-
      Fetched (WebFetch of the HTML full text). Confirmed real, with named author affiliations
      (UBC, MBZUAI). On reading, contains no passage comparing same-vs-different-model/vendor
      error-catching -- topically about multilingual benchmark coverage, not verification
      mechanism. Excluded per frozen_scope.inclusion_exclusion_rules ("model accuracy/capability
      alone with no same-vs-different reviewer comparison").
  - label: "nhimg.org, Cross-model AI code review exposes the limits of single-model judgment"
    reason: >-
      Surfaced in the same WebSearch result set as cite-mindstudio-crossvendor-010 (near-identical
      claim) but this session did not independently WebFetch/open this specific URL -- not cited,
      per the secondary-citation ban (FC-S14-1): never cite what this session did not itself open.

prisma_counts: null
global_track:
  summary: >-
    International/global literature clearly SUPPORTS the underlying MECHANISM H3 relies on
    (same-model/same-source review shares the producing process's blind spots; a structurally
    different model/process sometimes catches what the first misses -- cite-toohconsistent-003,
    cite-selfpreference-judge-001, cite-selfcorrect-reasoning-005) but the ONE source found that
    actually RUNS H3's own comparison (cross-vendor vs same-vendor catch/improvement rate,
    cite-crossmodel-codereview-002) found an ASYMMETRIC, direction-dependent result, not a clean
    uniform rise -- one cross-vendor direction helped a lot, the reverse direction hurt, and
    same-vendor self-review also helped in one condition. No source found tests H3's own exact
    operationalization (claim-card Q3/Q4 field-level AI-fill/assumption disclosure catch rate).
  strength_note: >-
    Weak-to-moderate support for the underlying mechanism, genuinely mixed/complicated support for
    H3's literal comparative claim as stated (a uniform rise with cross-vendor/I3 review). This is
    a SCOPING_SEARCH (bounded, 14 WebSearch rounds + fetches), not a systematic review -- absence
    of a cleaner confirming study does not mean one does not exist; it means this scope did not
    surface one within its stopping rule.
local_track:
  summary: >-
    Thai/SEA-specific literature found (cite-cofact-thai-detector-009, cite-iseas-sea-governance-008)
    addresses a DIFFERENT, adjacent problem (AI-detection tool reliability; national regulatory-body
    capacity) rather than H3's cross-vendor-vs-same-vendor claim-review mechanism directly, and
    neither source measures a catch-rate comparison. No Thai/SEA source was found that tests H3's
    mechanism locally.
  result: LOCAL_EVIDENCE_NOT_FOUND
transfer_verdict: UNASSESSED
  # H3's global-track evidence itself is mixed/asymmetric (not a clean transferable finding), and
  # no local Thai/SEA source tests the mechanism directly -- a transfer verdict of TRANSFERS_* or
  # DOES_NOT_TRANSFER would overstate what this scoping search actually found; UNASSESSED is the
  # honest value (NC-27: LOCAL_EVIDENCE_NOT_FOUND != NO_LOCAL_EVIDENCE_EXISTS).
summary_disclaimer: >-
  This is a SCOPING_SEARCH (not a systematic review): 10 sources kept from 14 WebSearch query
  rounds plus targeted WebFetch opens, bounded by the pre-registered stopping rule. On the SUPPORT
  side: several sources (cite-toohconsistent-003, cite-selfpreference-judge-001,
  cite-selfcorrect-reasoning-005) support the general mechanism H3 depends on (same-source checking
  under-detects a class of stable, self-consistent error; a structurally different model/process
  sometimes does not share that blind spot), and one source (cite-mindstudio-crossvendor-010,
  grey/practitioner, unstudied) states H3's claim almost verbatim as an unsupported assertion. On
  the CHALLENGE side: the one source that actually measured H3's own comparison
  (cite-crossmodel-codereview-002) found the effect is asymmetric and direction-dependent, not a
  uniform "cross-vendor beats same-vendor" pattern, and found same-vendor self-review ALSO helped
  in one tested condition -- a real complication to H3 as generally stated, not a clean refutation
  either. No source in this search directly measures H3's precise operationalization (claim-card
  Q3/false-AI-fill or Q4/false-assumption field disclosure, caught by I3 cross-vendor review vs
  I0/I1 same-vendor re-check). Absence of a source testing that exact operationalization is a
  search-coverage fact (this scope did not find one), never asserted as evidence that no such study
  exists.
