disclosure: 'Existence/metadata confirmed by fetching the arXiv HTML full-text page
  directly (title, all three authors with named institutions, and the abstract/results
  all present on the fetched page). claim_match_verified true from text read directly.
  This is a Global South-authored study (two of three authors at Sunrise University,
  Alwar, Rajasthan, India; third at Technological University Dublin, Ireland). It
  is a structural analogue, not a direct test of H3: it measures whether HUMAN checkers
  (law students) catch AI legal-citation errors better after repeated exposure to
  AI failures, and separately measures a "High-Confidence Error Rate" across three
  different AI systems (ChatGPT, Meta AI, Perplexity) evaluated on the SAME 60 cases
  -- which is itself a form of cross-system comparison (different vendors'' error
  rates on identical inputs differ substantially: 6.7% vs 15.0% vs 31.7%), consistent
  with H3''s premise that different vendors do not share the same blind spots, but
  the paper does not itself run a same-vendor-recheck vs cross-vendor-recheck catch-rate
  comparison. | I3 route (codex) judged from fetched metadata/abstract + the card''s
  quoted passage, not full text: Metadata matches the supplied fetched metadata, and
  the quoted passage is present and consistent with the excerpt. But H3 is only named,
  not stated, so I cannot verify that the source supports the hypothesis as claimed.
  | I3 route (codex) judged from fetched metadata/abstract + the card''s quoted passage,
  not full text: Metadata and quoted passage match the fetched material. But the source
  concerns legal AI hallucinations and students'' verification behavior, not same-vendor
  versus cross-vendor AI checking or detection of false Q3/Q4 fields, so it is only
  contextual for H3. | I3 route (codex) judged from fetched metadata/abstract + the
  card''s quoted passage, not full text: Metadata and quoted passage are consistent
  with the fetched material. But the source concerns legal-AI hallucinations and student
