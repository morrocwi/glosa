disclosure: >-
  Metadata mechanically confirmed via Crossref (title/container-title/authors/publisher match exactly:
  title, container-title "Proceedings of the 2025 Conference on Empirical Methods in Natural Language
  Processing", publisher ACL). claim_match_verified true from the abstract text, read directly via WebFetch
  of arxiv.org/abs/2505.17656 and aclanthology.org/2025.emnlp-main.238. Supports H3's mechanism directly:
  same-model repeated sampling ("self-consistency") systematically FAILS to catch a class of error the
  paper names "self-consistent errors" -- the model repeats the same wrong answer -- while a DIFFERENT
  ("external verifier") model's hidden-state signal helps detect them, because self-consistent errors
  "often differ across LLMs" (i.e. what one model gets stably wrong, another model does not get wrong
  the same way, so cross-model checking has traction that same-model re-sampling structurally lacks).
  This is a strong SUPPORT source for H3's underlying mechanism, though its instrument is LLM factual-error
  detection via hidden states, not human-legible claim-card field review -- domain gap flagged, not elided.
  Session- internal I1 check only; status stays METADATA_OK.
