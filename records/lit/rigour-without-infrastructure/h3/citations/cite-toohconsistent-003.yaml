exact_passage: >-
  "Motivated by the observation that self-consistent errors often differ across LLMs, we propose a simple
  but effective cross-model probe method that fuses hidden state evidence from an external verifier LLM.
  Our method significantly enhances performance on self-consistent errors across three LLM families."
