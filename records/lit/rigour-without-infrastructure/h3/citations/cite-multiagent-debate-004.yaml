  where multiple language model instances propose and debate their individual responses
  and reasoning processes over multiple rounds to arrive at a common final answer...
  We also demonstrate that our approach improves the factual validity of generated
  content, reducing fallacious answers and hallucinations that contemporary models
  are prone to."'
