disclosure: >-
  Existence/metadata mechanically confirmed via the arXiv abstract page. claim_match_verified true
  from the abstract text read directly. Relevant to H3 as background support for WHY a same-vendor
  re-check (which is not truly "external" in the sense this paper means, but is structurally
  closer to intrinsic self-correction than a cross-vendor route is) might under-perform: this paper
  shows intrinsic self-correction (no external signal at all) fails or degrades performance on
  reasoning tasks. It does NOT test same-vendor-different-session re-check vs cross-vendor
  independent check specifically -- that gap is real and is why scope is SUPPORTS_GENERAL_CLAIM_
  ONLY rather than DIRECT_QUOTATION-as-H3-evidence.

