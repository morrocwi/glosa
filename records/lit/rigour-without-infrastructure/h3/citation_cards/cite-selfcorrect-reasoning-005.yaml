exact_passage: >-
  "Central to our investigation is the notion of intrinsic self-correction, whereby an LLM
  attempts to correct its initial responses based solely on its inherent capabilities, without the
  crutch of external feedback... our research indicates that LLMs struggle to self-correct their
  responses without external feedback, and at times, their performance even degrades after
  self-correction."
