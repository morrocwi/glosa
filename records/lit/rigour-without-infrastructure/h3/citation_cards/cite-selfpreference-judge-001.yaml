  "Our findings reveal that LLMs assign significantly higher evaluations to outputs with lower
  perplexity than human evaluators, regardless of whether the outputs were self-generated. This
  suggests that the essence of the bias lies in perplexity and that the self-preference bias
  exists because LLMs prefer texts more familiar to them."
