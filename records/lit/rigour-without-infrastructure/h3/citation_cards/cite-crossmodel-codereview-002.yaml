disclosure: >-
  Existence and metadata mechanically confirmed via the arXiv abstract page. claim_match_verified
  is true (abstract text read directly). This is the single most DIRECTLY on-point source found:
  a controlled experiment (116 tasks, six conditions: solo, cross-model both directions, same-model
  both directions) comparing cross-vendor vs same-vendor review/re-check pass rates -- exactly H3's
  comparison. It is also H3's strongest available complication, not a clean confirmation: (a) one
  cross-vendor direction helps (Claude reviewing Codex), (b) the OTHER cross-vendor direction hurts
  (Codex reviewing Claude, pass rate drops), and (c) SAME-model self-review also raised the pass
  rate for Codex drafts (71.6% -> 84.5%), which is evidence a same-vendor re-check is not simply
  worse across the board -- direction and model identity both matter, not "cross-vendor" as a
  single undifferentiated lever. Verified this session only (I1); METADATA_OK, not VERIFIED.

