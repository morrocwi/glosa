exact_passage: >-
  "Claude review raises Codex drafts from 71.6% to 89.7% (p_BH=.001); Codex self review raises
  them to 84.5% (p_BH=.022). The reverse direction does not pay off: Codex reviewing Claude drafts
  drops the pass rate from 91.4% to 82.8% (p_BH=.046), and Claude self review leaves the 91.4%
  baseline unchanged. Our evaluation indicates that the useful pairing is asymmetric: use Claude to
  review Codex, not the other way around."
