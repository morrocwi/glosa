  are not of this kind, so the mechanism does not transfer directly.
stance: UNDETERMINED
what_it_would_say_against_us: Would note that machine-checked (Coq-level) verification, where available,
  is a strictly stronger independence route than cross-vendor AI review, and H3's claim should not be
  read as claiming cross-vendor AI checking is the strongest possible independent check -- only that it
  beats same-vendor re-checking.
