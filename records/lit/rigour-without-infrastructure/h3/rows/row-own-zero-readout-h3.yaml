how_it_sees_the_problem: Sees mechanical (machine-checked) verification as capable of settling a characterisation
  without informal argument.
what_it_separates: Separates a machine-checked proof from an informally-argued one -- a stronger, but
  different, independence mechanism than cross-vendor AI review.
