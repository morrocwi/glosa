what_it_would_say_against_us: >-
  Similar to the Bangladesh source: this would not contest H3's empirical mechanism, but it names
  a real constraint on H3's applicability within Southeast Asia specifically -- if national bodies
  capable of mandating or auditing INDEPENDENT (let alone cross-vendor) AI review are themselves
  under-resourced in parts of the region, a policy built on "just require cross-vendor checking"
  faces an institutional-capacity gap this source documents directly for SEA states.
