source_label: "Fong (2026) — What is Shaping AI Governance Policies in Southeast Asia? (ISEAS Perspective 2025/13, Singapore)"
how_it_sees_the_problem: >-
  Frames independent verification as an INSTITUTIONAL/regulatory-body capacity question at the
  national level (which body has authority and capability to act as a market-surveillance
  authority for AI), not a technical model-checking question -- macro-institutional framing
  versus H3's micro/technical framing.
what_it_separates: >-
  Separates countries by existing Data Protection Authority (DPA) capability across Southeast
  Asia, arguing DPA-as-AI-oversight-body is viable for some states and not others -- a
  country-level granularity H3 does not use at all (H3 operates at the level of individual
  claim-card checks, not national regulatory capacity).
what_it_assumes: >-
  Assumes DPAs are the natural candidate institution for AI market surveillance in the region;
  does not examine model-level or vendor-level review mechanisms.
