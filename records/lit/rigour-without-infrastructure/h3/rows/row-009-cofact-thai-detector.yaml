how_it_sees_the_problem: >-
  Frames verification as a civil-society, practitioner-facing problem: ordinary people and
  volunteer fact-checkers need PRACTICAL tools and habits to tell whether media is AI-generated,
  since no single detector is fully trustworthy -- a media-authenticity framing, not a claim-card-
  field-honesty framing.
what_it_separates: >-
  Separates AI-DETECTION (is this content AI-made at all) from AI-CONTENT-VERIFICATION (is this
  AI-made content's claims accurate/honest) -- H3 is squarely about the second category; this
  source is squarely about the first, a genuinely different problem despite surface similarity
  ("checking AI").
what_it_assumes: >-
  Assumes readers have access to try multiple detection tools plus manual visual/textual cues
  (fingers, lighting, text coherence); assumes combining tools compensates for any single tool's
  weakness -- a "use more than one checker" intuition that rhymes with H3's cross-vendor logic
  but is not established with any measured comparison in the source itself.
