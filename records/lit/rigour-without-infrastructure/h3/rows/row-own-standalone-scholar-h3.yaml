  draws between same-vendor and cross-vendor checking.
what_it_assumes: Assumes independent validation in this paper's own sense requires human friction, not
  merely a different AI vendor; H3's cross-vendor AI route is a weaker, AI-only approximation of this
  paper's stronger independence requirement.
