non_claims:
  - this card does not claim DLEH reduces real-world hallucination or improves creative utility on
    any actual LLM system -- the paper itself says no such benchmark has been run
  - this card does not claim Theorem 1 or invariants I1-I6 are Toledo theorems; they are the
    paper's own new, un-registered formal objects (PROPOSAL / not yet in Toledo if ever cited
    elsewhere)
  - this card does not certify the companion code repository's already-public self-review as an
    independent check -- confirmed NOT genuinely independent (same session, 12 minutes apart)
  - this card does not claim v3 (the originally delivered PDF) is safe to submit -- it is not (ref
    [20] uncorrected; Section 15's availability claim false as written); v3 is superseded and kept
    only as the historical record
  - this card does not claim v4 (`paper/main_v4.pdf`) has passed an independent check -- it has
    not; two independent passes found real defects across two rounds, both were fixed by this
    session itself, and the final fixed state was not itself independently re-examined before
    being pushed to the public repository
