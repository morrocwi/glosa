schema_version: 0.4.0
claim_id: GLOSA-CC-20260919-0001
shape: full
statement:
  language: en
  text: >
    The preprint "Fail Closed for Truth, Open for Imagination — A Dual-Lane Epistemic Control
    Harness for Generative AI Under Evidence Gaps" (Y. Lahtee, v3, 18 Sep 2026) defines a control
    architecture (DLEH) that separates verification status from generation class, grounds its lens
    layer in this workspace's own Toledo Readout Bridge (Eq. 2-11, citing the closure record and
    Coq source in morrocwi/toledo and morrocwi/information-discrete-math), and proves an
    architectural noninterference property (Theorem 1) for a reference transition system, backed
    by an executable finite-state conformance checker.
  is_verbatim_quote: false
standpoint:
  declared_basis: >
    the founder is the sole author and the concept-line owner (DLEH, the Toledo-grounded lens);
    AI assistance drafted prose/proofs/checker and this check under the founder's direction.
  disciplines_not_claimed: [formal verification of Theorem 1 in a proof assistant, an LLM benchmark
    of real hallucination reduction]
  method_basis: readout-not-truth; glosa maker != checker != approver; EPIS-TOLEDO-FIRST
claim_type: FORMAL
produced_by: ai
responsible: human
origin_blackbox_ref: BB-2026-09-19-01#1
five_questions:
  tested:
    evidence_relations:
      - evidence_id: EV-2026-09-19-independent-pass
        bearing: CHALLENGES
        independence_class: I2
        citation_ref: 'an in-session reviewer (id not recorded publicly) (in-session subagent,
          read-only against primary git objects in toledo/information-discrete-math, pdftotext
          extraction of the actual PDF, and a live re-run of dleh_model_check.py + pytest)'
        review_mode: null
        route_id: null
        asserted_by: ai
        date: '2026-09-19'
        notes: >
          VERDICT: NOT YET SAFE. Confirmed: (1) ref [20] blob-hash-as-commit error is STILL
          PRESENT in the actual delivered PDF (line ~1190), despite the filename saying
          "toledo_fixed" and despite a companion-repo doc proposing the fix -- the fix was never
          applied to the submission artifact itself. (2) Table 3 counts (22/44/0, 24/48/3, 24/46/1)
          confirmed NOT reproducible from any script on this machine; the "ancillary file
          dleh_model_check.py" Section 15 claims will be supplied does not exist as the original --
          only a post-hoc reconstruction (29/38/0, 32/46/4, 32/44/4) exists, found system-wide
          search. Section 15's own reproducibility claim is therefore false as things stand: a real
          prose/evidence mismatch, not previously logged. (3) The companion repo's own "pass
          2/pass 3 independent review" was NOT genuinely independent -- both commits are 12 minutes
          apart, one git identity, one continuous session, no external reviewer artifact exists;
          self-narrated independence does not satisfy this workspace's own maker-checker rule, and
          the repo was already pushed public before any check from outside that session occurred.
          (4) Eq. 2-11 Coq-source attribution (Alg_Q/S4/NEVER in information-discrete-math,
          S1/S3/S5 split correctly) reproduced independently by reading the actual .v files --
          this part checks out. (5) No AI attribution and no leak found, confirmed independently.
          (6) the paper carries no Core Epistemic Structure disclosure block; flagged as a judgment
          call for the founder, not resolved by this check. independence_class I2 (a fresh
          in-session agent, same model family) -- a cross-vendor or human check is still stronger
          and has not run; this check does not itself license removing D-INDEPENDENCE.
      - evidence_id: EV-2026-09-19-v4-authored-and-rechecked
        bearing: SUPPORTS
        independence_class: I2
        citation_ref: 'a second in-session reviewer (id not recorded publicly) (second, separate
          in-session agent, checked the newly-authored v4 draft against v3 page-by-page and
          re-derived the fixes independently)'
        review_mode: null
        route_id: null
        asserted_by: ai
        date: '2026-09-19'
        notes: >
          No LaTeX source for v3 existed anywhere in the workspace, so a full v4 was authored
          (not patched) applying the two blocking fixes above plus an AI-assistance disclosure.
          This second agent independently re-verified both fixes (git blob-vs-commit object
          types; exact re-execution of the shipped checker matching v4's printed numbers) and
          confirmed v4 is a faithful, unaltered reproduction of v3's scientific content -- but
          returned VERDICT: NEEDS FIXES for two mechanical defects in that first v4 draft (empty
          PDF metadata; a duplicated QED mark) plus restoring seven dropped DOIs. All three were
          applied directly afterward by this session (not by a further independent agent), then
          recompiled and re-inspected page-by-page. Pushed to the public
          morrocwi/dual-lane-epistemic-harness repository as `paper/main_v4.pdf` (commit
          `995c141`), superseding v3 (kept, unedited, for the record). **The final, post-fix
          state of v4 has itself NOT been re-examined by any independent pass** --
          independent_check.status stays FAILED rather than PASSED for exactly this reason: the
          last round of edits was self-applied and self-verified only. Independence class of
          everything in this card: I2 throughout. No cross-vendor or human check has run.
    falsifier: >
      any one of: reference [20] resolving to a real commit and matching content when checked
      fresh; the paper's printed Table 3 counts (22/44/0, 24/48/3, 24/46/1) reproducing from a
      correctly-modelled checker; or Eq. 4-7 (Alg_Q, S4, NEVER) failing to appear as Th_coqc-tier,
      closed objects in the cited repositories' own current default branches -- would each defeat
      the corresponding sub-claim of this card.
