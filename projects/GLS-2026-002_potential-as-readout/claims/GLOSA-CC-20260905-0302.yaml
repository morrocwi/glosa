  question_readout: >-
    Under the access relation this programme actually has, does the layer-1/layer-2 separation
    Causal Agency already draws (D3) generalize as a portable reading of "potential" across the
    other three papers and the wider human-agency literature, or is it specific to Causal Agency's
    own vocabulary?
  local_contrast_space_X:
    - "X1 -- potential reported as one flat layer-1 envelope (choice within a fixed structure only), with no separate accounting for capacity to change the structure"
    - "X2 -- potential reported as two separated layers (layer 1: choice within C; layer 2: change of C), per Causal Agency's own agency/proto-agency distinction"
    - "X3 -- as X2, and the two-layer separation is checked against independently fetched capability-theory/social-cognitive/relational-sociology literature for a same/different/cited verdict, not merely asserted by this programme"
  restriction_provenance: >-
    Every distinction this project draws about "potential" is itself drawn from inside the same
    programme that produced the four prior papers being checked -- a reflexive check, not an
    externally commissioned audit (lens_translation.md, this project).
  access_relation_R: >-
