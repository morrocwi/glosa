statement:
  language: en
  text: '"Potential" across this programme''s five texts is proposed to be at minimum two layers that
    are not collapsed in this reading: LAYER 1, choosing a policy within an already-fixed constraint
    structure $C$ (what the programme note of 5 September 2026 (superseded by the paper) called Agency
    Potential''s $p^\ast$, and what Causal Ethics'' Axiom II selects a regime within, cite-causal-ethics-axiom2-001);
    and LAYER 2, changing the constraint structure itself -- renegotiating a rule, opening a correction
    channel, forming a coalition, delegating -- which Causal Agency reserves the word "agency" for (the
    inequality $\partial T_p/\partial C \cdot \partial C/\partial x > 0$, attributed to its own actual
    location at §6.5 p.19, cite-causal-agency-formula-002, not to Def. 3''s prose statement) and calls
    mere layer-1 stabilisation "proto-agency" (§6.6, cite-causal-agency-protoagency-002), and which Causal
    Grammar''s "repair" this card glosses as a layer-2 act -- "layer-2" is this card''s own reading of
    Causal Grammar''s "protected reopening of damaged relations", not a term Causal Grammar itself uses
    (paper/main.tex, D3). This card states the proposed two-layer distinction and its falsifier; it does
    not yet claim the distinction has been checked against the wider human-agency literature (capability
    theory, social-cognitive theory, relational sociology) for portability -- that check is the citation
    work this card''s evidence_relations point at, not yet complete or independently reviewed (see
    `scope.claim_scope` and `non_claims`).'
  is_verbatim_quote: false
  translation:
    text: '"ศักยภาพ" ในห้าข้อความของโปรแกรมนี้เสนอให้มีอย่างน้อยสองชั้นที่ไม่ยุบรวมกันในการอ่านนี้: **ชั้น 1**
      เลือกนโยบายภายในโครงสร้างข้อจำกัด $C$ ที่ตายตัวแล้ว (สิ่งที่บันทึกโปรแกรมวันที่ 5 กันยายน 2026 --
      ถูกแทนที่ด้วยตัวเปเปอร์แล้ว -- เรียกว่า $p^\ast$ ของ Agency Potential) และ **ชั้น 2** เปลี่ยนโครงสร้างข้อจำกัดเอง
      ซึ่ง Causal Agency สงวนคำว่า "agency" ไว้ให้ชั้นนี้เท่านั้น (อสมการที่ตำแหน่งจริงคือ §6.5 หน้า 19 ไม่ใช่ตัวนิยาม
      Def. 3 เอง) และเรียกการทรงตัวในชั้น 1 ว่า "proto-agency" (§6.6) ส่วนคำว่า "ชั้น 2" สำหรับ "repair" ของ
      Causal Grammar เป็นการตีความของการ์ดนี้เอง ไม่ใช่คำที่ Causal Grammar ใช้เอง การ์ดนี้ยังไม่อ้างว่าข้อแยกนี้ผ่านการตรวจสอบวรรณกรรม
      มนุษย์-agency ภายนอกแล้ว งานตรวจสอบนั้นยังไม่เสร็จ'
    language: th
    translation_status: machine
