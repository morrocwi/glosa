    reader study or field evidence on whether human-agency researchers outside this programme
    already draw or reject this same line; an I5 (outside human, no stake) route, not yet arranged.
  claim_function_Phi_z0: >-
    The readout functional this card evaluates H2 against, at reference point z0 = "a single
    human-agency source's own account of what 'potential' or 'agency' means": does restating that
    account through the layer-1/layer-2 lens recover a distinction the source itself already draws
    (same), a distinction it draws differently (different), or a distinction genuinely absent from
    it (a real gap, not yet a novelty claim). Phi_z0 is a fit-checking functional, not a
    truth-functional.
  formal_applicability: relational_pointwise
hypothesis_world:
