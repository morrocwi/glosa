$schema: claim_card.schema.json
schema_version: 0.8.0
claim_id: GLOSA-CC-20260905-0302
shape: full
statement:
  language: en
  text: >-
    "Potential" across this programme's five texts is proposed to be at minimum two layers that
    must not be collapsed: LAYER 1, choosing a policy within an already-fixed constraint structure
    $C$ (what Agency Potential's $p^\ast$ computes, what Causal Ethics' Axiom II selects a regime
    within); and LAYER 2, changing the constraint structure itself -- renegotiating a rule, opening
    a correction channel, forming a coalition, delegating -- which Causal Agency reserves the word
    "agency" for ($\partial T_p/\partial C \cdot \partial C/\partial x > 0$, Def. 3) and calls mere
    layer-1 stabilisation "proto-agency" (§6.5-6.6), and which Causal Grammar's "repair" names as a
    protected layer-2 act (paper/main.tex, D3). This card states the proposed two-layer distinction
    and its falsifier; it does not yet claim the distinction has been checked against the wider
    human-agency literature (capability theory, social-cognitive theory, relational sociology) for
    portability -- that check is the citation work this card's evidence_relations point at, not yet
    complete or independently reviewed (see `scope.claim_scope` and `non_claims`).
  is_verbatim_quote: false
  translation:
    text: >-
      "ศักยภาพ" ในห้าข้อความของโปรแกรมนี้เสนอให้มีอย่างน้อยสองชั้นที่ห้ามยุบรวมกัน: **ชั้น 1**
      เลือกนโยบายภายในโครงสร้างข้อจำกัด $C$ ที่ตายตัวแล้ว (สิ่งที่ $p^\ast$ ของ Agency Potential
      คำนวณ) และ **ชั้น 2** เปลี่ยนโครงสร้างข้อจำกัดเอง ซึ่ง Causal Agency สงวนคำว่า "agency" ไว้ให้
      ชั้นนี้เท่านั้น และเรียกการทรงตัวในชั้น 1 ว่า "proto-agency" ส่วน Causal Grammar เรียกการเปิด
      พื้นที่คืนภายใต้การคุ้มครองว่า "repair" การ์ดนี้ยังไม่อ้างว่าข้อแยกนี้ผ่านการตรวจสอบวรรณกรรม
      มนุษย์-agency ภายนอกแล้ว งานตรวจสอบนั้นยังไม่เสร็จ
    language: th
    translation_status: machine
