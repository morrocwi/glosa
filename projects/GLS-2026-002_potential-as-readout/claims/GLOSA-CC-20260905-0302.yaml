claim_type_mapping_note: >-
  hypotheses.md/hypothesis_selection.yaml label H2 "CONCEPTUAL" (a claim about how many distinct
  layers the word "potential" names). `claim_card.schema.json`'s `claim_type` enum has no
  `CONCEPTUAL` value (EMPIRICAL|FORMAL|INTERPRETIVE|NORMATIVE|CONVENTIONAL_LEGAL|DECISION|SOCIAL|
  HUMAN_PARTICIPANT); `genre: conceptual` (below) carries the "conceptual" vocabulary as a separate
  axis. INTERPRETIVE is used as the schema's closest fit, the same mapping GLS-2026-001's own H2
  card (GLOSA-CC-20260904-0202) used for a structurally similar claim (a claim about where a
  concept's structure/meaning is located, not a measurement report or a mechanism-adoption claim).
  Documented rather than silent, per the same precedent.
