    A regime that suppresses visible instability-amplitude without changing the underlying operator
    shows a distinguishable numerical signature once suppression is budget-bounded (re-crossing the
    threshold after budget exhaustion; unbounded accumulated force under sustained suppression),
    distinct from a real operator change (repair) that achieves the same visible calm at zero
    accumulated force -- checked once on the project's own two-node fixture. Not yet independently
    re-run; see `scope.claim_scope`.
