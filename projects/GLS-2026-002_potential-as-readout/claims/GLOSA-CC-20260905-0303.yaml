$schema: claim_card.schema.json
schema_version: 0.8.0
claim_id: GLOSA-CC-20260905-0303
shape: full
statement:
  language: en
  text: >-
    A regime that suppresses the visible amplitude of instability without changing the underlying
    operator that determines the feasible/viable region (Violence-as-Instability's No-Go theorem:
    "no bounded force-based intervention can drive the system to a globally violence-free absorbing
    state") produces a distinguishable numerical signature once the suppression is bounded by a
    finite budget: the system re-crosses its instability threshold once the budget is exhausted, and
    the accumulated force paid to suppress grows without bound the longer suppression is sustained
    (Causal Ethics' $\lim C = \infty$, "karma as cost divergence"), whereas an operator change
    (raising $\Gamma$, lowering $S_{\mathrm{env}}$ -- a real layer-2 repair) achieves the same
    visible calm at zero accumulated force. This has been checked once, on the project's own
    two-node, finite-memory fixture (`sim/nogo_fixture.py`,
    `sim/nogo_fixture_result.json`, tier finite_diagnostic on that fixture only) --
    the actual executed numbers are cited as the primary evidence_relation below. The fixture's
    first-attempt passing/failing control was itself wrong and was corrected once (see
    `five_questions.tested.dissent_records`); this card does not yet claim the fixture has been
    independently re-run by a second route, nor that the wider instability/AI-safety-corrigibility
    literature has been checked for a same/different/cited comparison (see `non_claims`).
  is_verbatim_quote: false
  translation:
    text: >-
      ระบอบที่กดแอมพลิจูดที่มองเห็นได้ของความไม่เสถียรโดยไม่เปลี่ยน operator ที่กำหนดพื้นที่ความ
      เป็นไปได้ จะมีลายเซ็นเชิงตัวเลขที่แยกออกได้เมื่อการกดถูกจำกัดด้วยงบจำกัด: ระบบจะข้ามเกณฑ์ไม่
      เสถียรอีกครั้งหลังงบหมด และแรงสะสมที่จ่ายเพื่อกดจะโตไม่มีขอบเขตตามเวลาที่กดต่อเนื่อง ในขณะที่
      การเปลี่ยน operator จริงจะได้ความสงบที่มองเห็นได้แบบเดียวกันโดยไม่มีแรงสะสมเลย ตรวจแล้วครั้ง
      เดียวบน fixture สองโหนดของโครงการเอง การ์ดนี้ยังไม่อ้างว่า fixture ผ่านการรันซ้ำโดยเส้นทางอิสระ
      หรือวรรณกรรมภายนอกถูกตรวจสอบแล้ว
    language: th
    translation_status: machine
