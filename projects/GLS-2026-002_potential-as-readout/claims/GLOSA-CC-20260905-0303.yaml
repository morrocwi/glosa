    (sim/nogo_fixture.py, sim/nogo_fixture_result.json); the Violence-as-Instability paper's own
    No-Go theorem text; Causal Ethics' $\lim C = \infty$ result. Does NOT have access to: an
    independent (I3+) re-execution of the fixture; a second, independently authored fixture testing
    the same claim; instability/AI-safety-corrigibility literature checked for a same/different/
    cited comparison (owned by concurrent lit workers, not yet complete).
  claim_function_Phi_z0: >-
    The readout functional this card evaluates H3 against, at reference point z0 = "the fixture's
    own executed run": does the numerical output (threshold_crossings, recurrences_after_budget,
    cumulative_force_spent across the no-intervention / bounded-budget / unbounded-suppression /
    operator-change conditions) actually show the signature the theorem predicts, or does it show
    something else. Phi_z0 is a fit-checking functional over the fixture's own numbers, not a
    truth-functional about the theorem's general validity.
  formal_applicability: exact_functional
hypothesis_world:
