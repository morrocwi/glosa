  question_readout: >-
    Under the access relation this programme actually has, does the Violence-as-Instability No-Go
    theorem's sketch-level claim (no bounded force-based intervention reaches a globally
    violence-free absorbing state) produce a numerically checkable signature (threshold
    re-crossing plus unbounded accumulated force) when actually executed on a minimal fixture, or
    does the sketch fail to survive being made concrete?
  local_contrast_space_X:
    - "X1 -- the No-Go theorem stated only as a sketch (Dr tier), no executed numbers"
    - "X2 -- the theorem executed on a minimal fixture with an initially-mis-set passing/failing control (the project's own first-attempt failure, see dissent_records)"
    - "X3 -- the theorem executed on the corrected fixture (finite_diagnostic on that fixture only), producing the threshold-recrossing + unbounded-force signature this card cites"
    - "X4 -- as X3, and independently re-run by a second route or a second independently authored fixture (not yet reached)"
  restriction_provenance: >-
    Every distinction this project draws about "potential" is itself drawn from inside the same
    programme that produced the four prior papers being checked -- a reflexive check, not an
    externally commissioned audit (lens_translation.md, this project).
  access_relation_R: >-
