          records/lit/potential-as-readout/h1/rows/row-003-vygotsky-1978.yaml (stance YES)
        citation_ref: cite-vygotsky-1978-mindinsociety-003
        review_mode: null
        route_id: null
        asserted_by: ai
        date: "2026-09-05"
        notes: >-
          Vygotsky's own definition of the ZPD as "the distance ... as DETERMINED through problem
          solving under adult guidance" makes potential a determined (witnessed) quantity rather than a
          declared one. Row flags this rests on a secondary quotation, not this session's own reading of
          the primary text. Reconciled 2026-09-05 (POT1-integrate).
      - evidence_id: cite-robeyns-2017-004
        bearing: CHALLENGES
        independence_class: I1
        strength: >-
          single direct fetch (Open Book Publishers, CC BY 4.0), I1 -- reconciled from
          records/lit/potential-as-readout/h1/rows/row-004-robeyns-2017.yaml (stance NO)
        citation_ref: cite-robeyns-2017-004
        review_mode: null
        route_id: null
        asserted_by: ai
        date: "2026-09-05"
        notes: >-
          Frames capabilities as "real freedoms or opportunities" mediated by conversion factors, without
          requiring the opportunity to have ever been exercised/demonstrated -- opposite polarity from
          H1's witnessing requirement. Row's own counter-note: "real" (vs. merely formal/nominal) freedoms
          may already build in an implicit witnessing requirement, which is closer to H1 than a literal
          reading of "opportunity" suggests. Reconciled 2026-09-05 (POT1-integrate).
      - evidence_id: cite-nussbaum-2011-005
        bearing: CHALLENGES
        independence_class: I1
        strength: >-
          single direct PDF read (Harvard University Press, Ch. 2 p.18), I1 -- reconciled from
          records/lit/potential-as-readout/h1/rows/row-005-nussbaum-2011.yaml (stance NO)
        citation_ref: cite-nussbaum-2011-005
        review_mode: null
        route_id: null
        asserted_by: ai
        date: "2026-09-05"
        notes: >-
          Explicitly separates provision of an opportunity set (societal task) from its exercise
          (individual choice: "the choice is theirs"), treating an unexercised, unwitnessed option as
          still counting toward justice assessment -- the opposite polarity from H1. Row's own counter-
          note: Nussbaum's "combined capabilities" concept elsewhere does witnessing-like evidentiary
          work (showing external conditions are actually in place). Reconciled 2026-09-05 (POT1-integrate).
      - evidence_id: cite-sen-1999-006
        bearing: CHALLENGES
        independence_class: I1
        strength: >-
          disclosed secondary route (quoted through Nussbaum 2011 p.20, primary text Development as
          Freedom not independently opened), I1 -- reconciled from
          records/lit/potential-as-readout/h1/rows/row-006-sen-1999.yaml (stance NO)
        citation_ref: cite-sen-1999-006
        review_mode: null
        route_id: null
        asserted_by: ai
        date: "2026-09-05"
        notes: >-
          Defines capability as "the alternative combinations of functionings that are FEASIBLE" --
          the feasible set itself is the object, assessable by an analyst's model without requiring
          demonstrated achievement. Row's own counter-note: Sen's applied work often relies on observed/
          measured achievements as the operational proxy, closer in practice to a witnessed-set method
          even if the formal definition uses "feasible" language. Reconciled 2026-09-05 (POT1-integrate).
