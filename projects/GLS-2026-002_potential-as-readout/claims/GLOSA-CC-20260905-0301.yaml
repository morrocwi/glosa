schema_version: 0.8.0
claim_id: GLOSA-CC-20260905-0301
shape: full
statement:
  language: en
  text: >-
    "Potential" quantities in this programme's own texts -- the feasible set $\Pi^{\mathrm{feas}}$
    of Agency Potential (AP), the admissible-regime set $R_{\mathrm{adm}}$ of Causal Ethics, the
    viable region $V$ of Causal Agency, the "feasible life-space" of Causal Grammar -- are proposed
    to be readable, without loss of the programme's own claims, as the WITNESSED set: the finite,
    enumerable set of policies for which a retained record exists that an agent with comparable
    history and conditions executed the policy within a declared horizon and budget (paper/main.tex
    §"Definitions on the witnessed set", eq. 1's Witness Rule). Under this reading the envelope
    $p^\ast$ computed over the set is a checkable readout (a reader can ask: does the record exist,
    is the set finite and enumerable), not an unbounded declaration only its author can see. This
    card states the operational definition and its falsifier; it does not yet claim the definition
    has been independently checked against the wider literature -- that check is the citation work
    this card's evidence_relations point at, not yet complete or independently reviewed (see
    `scope.claim_scope` and `non_claims`).
  is_verbatim_quote: false
  translation:
    text: >-
      ปริมาณ "ศักยภาพ" ในข้อความของโปรแกรมนี้เอง -- $\Pi^{\mathrm{feas}}$ ของ Agency Potential,
      $R_{\mathrm{adm}}$ ของ Causal Ethics, $V$ ของ Causal Agency, "feasible life-space" ของ
      Causal Grammar -- เสนอให้อ่านได้ โดยไม่เสียข้อเคลมเดิม เป็น **เซตที่มีพยาน**: เซตจำกัดของ
      นโยบายที่มีบันทึกว่าเอเจนต์ที่มีประวัติ/เงื่อนไขใกล้เคียงเคยทำสำเร็จภายในขอบเวลาและงบประมาณที่
      ประกาศไว้ ภายใต้การอ่านนี้ envelope $p^\ast$ ที่คำนวณเหนือเซตนั้นเป็นการอ่านค่าที่ตรวจสอบได้
      ไม่ใช่การประกาศที่ไม่มีขอบเขต การ์ดนี้ยังไม่อ้างว่านิยามนี้ผ่านการตรวจสอบวรรณกรรมภายนอกแล้ว
      งานตรวจสอบนั้นยังไม่เสร็จ ยังไม่ผ่านการทบทวนอิสระ
    language: th
    translation_status: machine
standpoint:
  declared_basis: >-
    Written from the standpoint of a social entrepreneur and citizen (founder, Yaoharee Lahtee), not
    as a substitute expert in peace research, capability economics, information theory, or
    philosophy of language. AI assistance (the AI assistant) drafted the candidate hypothesis, this
    claim card's field structure, and (once populated by concurrent lit workers) will draft
    summaries of the supporting literature-review runs; every AI-drafted contribution is disclosed
    in `five_questions.ai_filled` and never counted as authorship (glosa gate rule 5).
  disciplines_not_claimed:
    - peace and conflict studies
    - development economics / capability theory
    - information theory
    - philosophy of language
    - AI safety / corrigibility research
    - law
  method_basis: >-
    glosa methodology itself (claim cards answering the founder's five questions, tied to the
    Readout Condition's Existence-Attribution-Disclosure, gated through the independence ladder
    before public release) -- this card is produced by running glosa on the "Potential as a Readout"
    paper (society-justice-peace series, cpg_research_journal), per founder rulings
    BBL-2026-09-05-130/132/134.
claim_type: FORMAL
claim_type_mapping_note: >-
  hypotheses.md/hypothesis_selection.yaml label H1 an operational-definition/DEFINITIONAL claim (a
  set-membership rule stated as an exact functional, paper/main.tex eq. 1). `claim_card.schema.json`
  's `claim_type` enum has no `DEFINITIONAL` value (EMPIRICAL|FORMAL|INTERPRETIVE|NORMATIVE|
  CONVENTIONAL_LEGAL|DECISION|SOCIAL|HUMAN_PARTICIPANT). FORMAL is used as the schema's closest fit:
  H1 states an exact, checkable set-membership criterion (a policy is IN the witnessed set iff a
  retained execution record exists), consistent with this card's own
  `lens_translation.formal_applicability: exact_functional` -- not a measurement report (EMPIRICAL),
  a meaning-location claim about an existing concept (INTERPRETIVE, used for the sibling H2 card,
  GLOSA-CC-20260905-0302), or a mechanism-adoption claim (NORMATIVE). Documented rather than silent,
  matching the same-discipline precedent in GLOSA-CC-20260904-0201's own `claim_type_mapping_note`.
