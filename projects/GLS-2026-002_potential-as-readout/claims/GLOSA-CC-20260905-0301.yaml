  question_readout: >-
    Under the access relation this programme actually has, does restating the feasible/admissible/
    viable set of each of the four prior papers plus AP as the WITNESSED set (finite, enumerable,
    under a retained execution-record rule) let a reader check the envelope $p^\ast$ mechanically,
    rather than only being able to trust the author's declaration of what is feasible?
  local_contrast_space_X:
    - "X1 -- potential reported as a bare declared set (a feasible/admissible/viable region asserted without a stated membership rule)"
    - "X2 -- potential reported as an envelope over a witnessed set (finite, enumerable, retained-record rule)"
    - "X3 -- as X2, and the witness rule is itself checked against independently fetched literature for a same/different/cited verdict, not merely asserted by this programme"
  restriction_provenance: >-
    Every distinction this project draws about "potential" is itself drawn from inside the same
    programme that produced the four prior papers being checked -- a reflexive check, not an
    externally commissioned audit (lens_translation.md, this project).
  access_relation_R: >-
    Has access to: the programme's own four prior papers and their stated equations; the fifth note
    (AP); the Readout Genesis/Readout Universe core; openly fetchable published literature in peace
    research, capability theory, and information-theoretic agency. Does NOT have access to: any
    human population's actual measured capability sets; an I5 (outside human, no stake) review
    route, not yet arranged for this project.
  claim_function_Phi_z0: >-
    The readout functional this card evaluates H1 against, at reference point z0 = "one of the
    programme's own feasible-set declarations, before restatement under the witness rule": does
    restating it as a witnessed set let an independent reader recover the same membership test the
    source text intends, without smuggling in an unretained continuum. Phi_z0 is a checkability
    functional, not a truth-functional -- it certifies the definition is checkable, not that any
    given envelope value is correct.
  formal_applicability: exact_functional
hypothesis_world:
  text: >-
    If a "potential" quantity is defined as the witnessed set (the finite, enumerable set of
    policies for which a retained record exists that a comparable agent executed within a declared
    horizon/budget) rather than a declared, unretained continuum -- then the envelope computed over
    it is a readout a reader can check, not an unbounded declaration only its author can see. Not
    yet checked against independently fetched literature for a same/different/cited verdict; see
    `scope.claim_scope`.
  language: en
  falsifier_ref: five_questions.tested.falsifier
  signature: >-
