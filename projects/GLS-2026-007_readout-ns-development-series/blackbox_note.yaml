context: >-
  Volume 1's abstract states it is a direct response to a NEW external event: "In September 2026,
  OpenAI released a proposed smooth-forced finite-time breakdown construction [for 3D incompressible
  Navier-Stokes] together with a Lean formalization" (cited as OpenAI, "Finite Time Blowup for
  Navier-Stokes", preprint released 2026-09-08, and OpenAI's "NavierStokesAndEuler" Lean-certificate
  GitHub repo). Volume 1 explicitly takes neither the truth nor falsity of that external proof as
  its target; it asks the same discrete-native readout question this workspace already asked of
  Fefferman's original Clay problem statement (see GLS-2026-006, released today as the public repo
  morrocwi/readout-problem-navier-stokes, DOI 10.5281/zenodo.22673246) -- but now applied to a
  concrete, newly-published forced-blowup CANDIDATE rather than only to the abstract Clay
  alternatives (C)/(D). Volume 1 reuses the SAME Toledo root objects GLS-2026-006 already
  registered/cited (CAN-002/003/006/007/008/009 under EQ-015 and weld/M.02-03.v1, A.5/M.01.v1,
  A.8/M.01.v1) and proves a new finite non-entailment theorem (its own "NSR-01", an 8-state witness
  of the same general shape as GLS-2026-006's Theorem 1/3.1, but not yet cross-checked here for
  whether it is the identical construction or a distinct one -- a Toledo-first duplication check is
  explicitly NOT yet done for Volume 1's NSR-01/NSR-02/NSR-03/NSR-04 proposals, nor for anything in
  Volumes 2-6). Volume 1's own Appendix D explicitly refuses to use Toledo's weld/M.39.v1 (a
  causal-history entry whose Coq source is only an open proposition) to claim a flux-closure result
  -- the same source-discipline this workspace already practices, independently re-applied by the
  founder to Toledo's own registry.
