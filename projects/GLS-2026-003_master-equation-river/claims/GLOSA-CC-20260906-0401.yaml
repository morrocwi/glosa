  not the world-truth of the theory the chain supports.
- This card does not claim an independent (I3+) review has occurred -- independent_check.status is NONE,
  not PENDING or PASSED; all ten citation-card checks are I1 (same-session).
- This card does not claim the Zenodo DOI 22361830 ("Potential as a Readout v2") is the correct or sole
  source for the audit's "Effective, Corrigible Agency Potential" bibliography entry -- it discloses that
  these are, on direct reading, two differently-titled documents, with the checked one restating the other's
