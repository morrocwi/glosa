- This card does not claim the ten sources have priority over each other or
  to any external literature -- no novelty comparison is made (glosa gate rule 6).
- This card does not claim that the Zenodo deposit dates, version numbers, or author-attributed priority
  among the programme's own ten manuscripts have been independently audited beyond what each manuscript's
  own Zenodo record states.
- This card is not a veterinary, medical, legal, or religious determination of any kind.
