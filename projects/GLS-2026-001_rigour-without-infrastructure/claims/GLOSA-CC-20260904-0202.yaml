  lens_ref: "10.5281/zenodo.21529456"
  question_human:
    text_verbatim: >-
      ...คนที่ไม่มีมหาวิทยาลัย ไม่มีแล็บ และไม่มีทีมวิจัย จะผลิตความรู้จากพื้นที่ของตนเองอย่างเข้มงวดได้อย่างไร...
    language: th
    blackbox_line_ref: "blackbox/BLACKBOX_NOTE_glosa-paper_2026-09-04.md#L1"
  question_readout: >-
    Under the access relation this person actually has, is the contaminated concept "ความเข้มงวด"
    (rigour) -- as ordinarily used, quietly assuming an institutional mechanism (lab, department,
    review committee) sits behind it -- actually a property that a single claim's own recorded
    structure can carry on its own, checked field-by-field, rather than a property only an
    institution can confer?
  local_contrast_space_X:
    - "X1 -- claim carries no field distinguishing evidence from interpretation from AI-fill (bare narrative assertion)"
    - "X2 -- claim looks well-formed and academic (AI-smoothed prose, citations present) but the evidence/interpretation/AI-fill boundary is still not recoverable by a reader"
    - "X3 -- claim is recorded as a structured card that answers, per item, what was seen / what data separates / what AI filled / what is assumed / what independent test (if any) it has survived"
    - "X4 -- as X3, and the card has additionally passed through the independence ladder (I0..I5) before any public release claim is made about it"
  restriction_provenance: >-
    Every distinction this project can draw about "rigour without infrastructure" is itself drawn
    from inside that same restricted access relation -- glosa's own author-project is a
    standalone-scholar project run under exactly the condition it studies (lens_translation.md,
    this project).
  access_relation_R: >-
    Has access to: own practice/local context and its raw observations; general-purpose AI
    assistance (drafting, checking mechanically, routing, logging -- never authoring or
    certifying); publicly available literature and tools; the glosa methodology itself once
    adopted. Does NOT have access to: a university appointment or department; a certified lab; a
    standing research team; institutional peer-review machinery; an institution's own name as a
    certifying signal on the claim.
  claim_function_Phi_z0: >-
    The readout functional this project evaluates H2 against, at reference point z0 = "the
    property a reader relies on when they treat a claim as rigorous": does that reliance actually
    trace to the claim's own recorded structure (X3/X4), or does it trace to an institutional
    signal the structure cannot substitute for. Phi_z0 is a location-of-the-property functional,
    not a truth-functional -- it asks WHERE rigour's warrant actually comes from, not whether any
    given claim is true.
  formal_applicability: not_applicable_narrative
hypothesis_world:
  text: >-
    "Rigour" is not conferred on a claim by institutional machinery from the outside; it is a
    property a single claim can carry in its own recorded structure (what was seen, what
    separates, what AI filled, what is assumed, what independent check it survived) --
    institutions are one historical mechanism that has produced this property, not the only
