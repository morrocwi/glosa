        bearing: SUPPORTS
        independence_class: I3
        strength: "moderate -- DIRECT_QUOTATION scope, same-lineage source (this project's own Readout Condition paper), metadata + claim-match confirmed by a decorrelated AI route"
        citation_ref: cite-own-readout-condition-h2-002
        review_mode: DECORRELATED_AI_ROUTE
        route_id: codex
        asserted_by: ai
        date: "2026-09-04"
        notes: >-
          The Readout Condition's own E-A-D (existence/attribution/disclosure) architecture is a
          claim-level structure a single claim can carry -- directly supports H2's core mechanism,
          though it is same-author lineage, not independent evidence
          (h2/citations/cite-own-readout-condition-h2-002.yaml, .i3.json bearing SUPPORTS).
      - evidence_id: cite-own-written-ai-h2-001
        bearing: SUPPORTS
        independence_class: I3
        strength: "moderate -- DIRECT_QUOTATION scope, same-lineage source"
        citation_ref: cite-own-written-ai-h2-001
