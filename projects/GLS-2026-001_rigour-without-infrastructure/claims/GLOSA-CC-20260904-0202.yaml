      - evidence_id: cite-own-civilization-of-knowledge-h2-007
        bearing: CHALLENGES
        independence_class: I3
        strength: "moderate -- DIRECT_QUOTATION scope, same-lineage source, but argues the opposing direction"
        citation_ref: cite-own-civilization-of-knowledge-h2-007
        review_mode: DECORRELATED_AI_ROUTE
        route_id: codex
        asserted_by: ai
        date: "2026-09-04"
        notes: >-
          Argues social authorization through institutions/procedures/recognized interpreters is
