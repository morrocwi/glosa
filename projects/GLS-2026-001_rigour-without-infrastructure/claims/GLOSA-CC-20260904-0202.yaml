$schema: claim_card.schema.json
schema_version: 0.4.0
claim_id: GLOSA-CC-20260904-0202
shape: full
statement:
  language: en
  text: >-
    "Rigour" is not a property that institutional machinery (lab, department, review committee)
    confers on a claim from the outside; it is a property a single claim can carry in its own
    recorded structure (what was seen, what separates, what AI filled, what is assumed, what
    independent check it survived) -- institutions are one historical mechanism that has produced
    this property, not the only possible one.
  is_verbatim_quote: false
  translation:
    text: >-
      "ความเข้มงวด" ไม่ใช่คุณสมบัติที่กลไกสถาบัน (แล็บ ภาควิชา คณะกรรมการตรวจ) มอบให้กับข้ออ้างจากภายนอก
      แต่เป็นคุณสมบัติที่ข้ออ้างชิ้นหนึ่งสามารถ "พกติดตัว" ได้เองผ่านโครงสร้างการบันทึกของมัน (ตอบได้ว่าเห็นอะไร
      แยกอะไร AI เติมอะไร สมมติอะไร ผ่านการตรวจอิสระอะไรมา) -- สถาบันเป็นเพียงหนึ่งในกลไกที่เคยทำให้เกิดคุณสมบัตินี้ได้ในอดีต
      ไม่ใช่แหล่งเดียวที่เป็นไปได้
    language: th
    translation_status: reviewed
standpoint:
  declared_basis: >-
    Written from the standpoint of a social-enterprise practitioner and citizen (founder, Yaoharee
    Lahtee), not as a substitute expert in computer science, philosophy of science, library and
    information science, or research-integrity studies. AI assistance (the AI assistant, seated as "the AI assistant"
    this session) drafted the candidate hypothesis, this claim card's field structure, and the
    supporting literature-review runs; every AI-drafted contribution is disclosed in
    `five_questions.ai_filled` and never counted as authorship (AGENTS.md gate rule 5).
  disciplines_not_claimed:
    - computer science
    - philosophy of science
    - library and information science
    - research-integrity studies
    - sociology of knowledge
    - law
  method_basis: >-
    glosa methodology itself (claim cards answering the founder's five questions, tied to the
    Readout Condition's Existence-Attribution-Disclosure, gated through the independence ladder
    before public release) -- this card is produced by running glosa on glosa's own paper (dogfood,
    founder instruction BBL-2026-09-04-091).
claim_type: INTERPRETIVE
claim_type_mapping_note: >-
  hypotheses.md/hypothesis_selection.yaml label H2 "CONCEPTUAL" (a claim about what a term/property
  IS). `claim_card.schema.json`'s `claim_type` enum has no `CONCEPTUAL` value
  (EMPIRICAL|FORMAL|INTERPRETIVE|NORMATIVE|CONVENTIONAL_LEGAL|DECISION|SOCIAL|HUMAN_PARTICIPANT).
  `genre: conceptual` (below) is the correct field for the "conceptual" vocabulary -- `claim_type`
  is a separate axis (what KIND of claim this is, not what section of a paper it belongs in).
  INTERPRETIVE is used as the schema's closest fit for `claim_type`: H2 is a claim about the
  meaning/location of a concept ("rigour" as a property a record can carry vs. a property an
  institution confers), not a measurement report (EMPIRICAL) or a mechanism specification
  (NORMATIVE, the mapping used for the sibling H1 card, GLOSA-CC-20260904-0201). Documented rather
  than silent, per the same discipline `formal_applicability`'s own plain-language table (§3.2b)
  applies to a comparable ambiguous-enum problem.
