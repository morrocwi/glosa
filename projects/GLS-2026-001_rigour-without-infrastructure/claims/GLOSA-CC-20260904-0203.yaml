$schema: claim_card.schema.json
schema_version: 0.4.0
claim_id: GLOSA-CC-20260904-0203
shape: full
statement:
  language: en
  text: >-
    Hypothesis, not yet tested: when claim cards are checked by a different AI vendor from the one
    that produced them (cross-vendor, independence level I3) instead of being re-checked by the
    same vendor that produced the card (I0/I1), the rate at which undisclosed AI-fill (a false Q3
    field) or undisclosed assumptions (a false Q4 field) is caught would rise measurably compared
    to same-vendor re-checking. No seeded-error benchmark has been run by this project (n=0 own
    trials); this project's own most directly on-point source found the effect direction-dependent,
    not uniform (see `five_questions.separates.licensing_test.result`,
    `five_questions.tested.dissent_records`, and `non_claims` below).
  is_verbatim_quote: false
  translation:
    text: >-
      สมมติฐาน ยังไม่ได้ทดสอบ: เมื่อการ์ดข้ออ้างถูกตรวจโดย AI คนละยี่ห้อ (cross-vendor, ระดับความเป็นอิสระ I3)
      แทนที่จะตรวจซ้ำด้วย AI ยี่ห้อเดียวกับที่ผลิตการ์ด (I0/I1) อัตราการจับได้ของ AI-fill ที่ไม่เปิดเผย (ฟิลด์ Q3 เป็นเท็จ)
      หรือข้อสมมติที่ไม่เปิดเผย (ฟิลด์ Q4 เป็นเท็จ) *น่าจะ* สูงขึ้นอย่างมีนัยสำคัญ เทียบกับการตรวจด้วยยี่ห้อเดียวกัน -- ยังไม่มีการทดลองวัดผลจริงโดยโครงการนี้
      (n=0) และแหล่งอ้างอิงที่ตรงประเด็นที่สุดกลับพบว่าผลลัพธ์ขึ้นกับทิศทาง ไม่สม่ำเสมอ
    language: th
    translation_status: machine
standpoint:
  declared_basis: >-
    Written from the standpoint of a social-enterprise practitioner and citizen (founder, Yaoharee
    Lahtee), not as a substitute expert in computer science, statistics, or AI-evaluation
    methodology. AI assistance (the AI assistant) drafted the candidate
    hypothesis, this claim card's field structure, and the supporting literature-review runs; every
    AI-drafted contribution is disclosed in `five_questions.ai_filled` and never counted as
    authorship (AGENTS.md gate rule 5).
  disciplines_not_claimed:
    - computer science
    - statistics
    - AI-evaluation methodology
    - philosophy of science
    - research-integrity studies
  method_basis: >-
    glosa methodology itself (claim cards answering the founder's five questions, tied to the
    Readout Condition's Existence-Attribution-Disclosure, gated through the independence ladder
    before public release) -- this card is produced by running glosa on glosa's own paper (dogfood,
    founder instruction BBL-2026-09-04-091).
claim_type: EMPIRICAL
genre: conceptual
venue_track: none
companion_of: null
produced_by: joint
responsible: human
origin_blackbox_ref: "blackbox/BLACKBOX_NOTE_glosa-paper_2026-09-04.md#L1"
litreview_manifest_ref: records/lit/rigour-without-infrastructure/h3/litreview_manifest.yaml
hypothesis_selection_ref: hsel-rigour-without-infrastructure-001
lens_translation:
  lens_ref: "10.5281/zenodo.21529456"
  question_human:
    text_verbatim: >-
      ...คนที่ไม่มีมหาวิทยาลัย ไม่มีแล็บ และไม่มีทีมวิจัย จะผลิตความรู้จากพื้นที่ของตนเองอย่างเข้มงวดได้อย่างไร...
    language: th
    blackbox_line_ref: "blackbox/BLACKBOX_NOTE_glosa-paper_2026-09-04.md#L1"
  question_readout: >-
    Under the access relation this project actually has (existing AI-vendor accounts, no funded
    reader study), does the specific mechanism the independence ladder depends on -- a decorrelated
    (cross-vendor) checking route catching more undisclosed AI-fill/assumption instances than a
    same-vendor re-check -- actually hold, or does it only look like it should hold by analogy to
    adjacent domains (code review, judge bias)?
  local_contrast_space_X:
    - "X1 -- same-vendor re-check (I0/I1): the AI vendor that produced the card also re-checks it"
    - "X2 -- cross-vendor check (I3): a different AI vendor from the one that produced the card checks it"
    - "X3 -- cross-vendor check catches a measurably higher rate of seeded undisclosed AI-fill/assumption instances than X1"
    - "X4 -- cross-vendor check does not catch a measurably higher rate, or the effect is direction-dependent (helps one vendor-pair direction, hurts the reverse, as the closest analogous study found)"
  restriction_provenance: >-
    Every distinction this project can draw about H3 is itself drawn from inside the same
    restricted access relation -- glosa's own author-project has existing AI-vendor accounts
    (the AI assistant, codex) but no seeded-error benchmark has actually been run yet
    (lens_translation.md, this project).
  access_relation_R: >-
    Has access to: existing AI-vendor accounts (used already for I3 citation-card cross-checking in
    this project's own LRS runs); the glosa methodology itself. Does NOT have access to: a funded,
    pre-registered seeded-error benchmark with a scoring rubric; a controlled human-adjudicated
    ground truth for "undisclosed AI-fill" beyond this project's own frozen records.
  claim_function_Phi_z0: >-
    The readout functional this project evaluates H3 against, at reference point z0 = "a claim
    card with a known, logged, deliberately undisclosed AI-fill or assumption instance": does a
    cross-vendor (I3) check route catch it at a measurably higher rate than a same-vendor (I0/I1)
    route. Phi_z0 is a detection-rate functional over a to-be-built seeded benchmark, not yet
    computed on real seeded data by this project.
  formal_applicability: stochastic
hypothesis_world:
  text: >-
    Hypothesis, not yet tested: when claim cards are checked by a different AI vendor from the one
    that produced them (cross-vendor, independence level I3) instead of being re-checked by the
    same vendor that produced the card (I0/I1), the rate at which undisclosed AI-fill (a false Q3
    field) or undisclosed assumptions (a false Q4 field) is caught would rise measurably compared
    to same-vendor re-checking. No measurement has been made (n=0); see `non_claims`.
  language: en
  falsifier_ref: five_questions.tested.falsifier
  signature: >-
    Hypothesis derived with Readout Universe -- Yaoharee Lahtee (lens, DOI 10.5281/zenodo.21529456);
    candidate proposed by AI, selected by the founder (BBL-2026-09-04-095).
five_questions:
  seen:
    record_ref: projects/GLS-2026-001_rigour-without-infrastructure/hypotheses.md#H3
    as_of: "2026-09-04"
    retrievable_original: true
    access_model: >-
      The founder's own Blackbox Note question line (BB-2026-09-04-01#1, mirrored publicly at
      blackbox/BLACKBOX_NOTE_glosa-paper_2026-09-04.md#L1), the paper abstract
      (paper/main_th.md), and the self-application run records: `records/lit/rigour-without-
      infrastructure/h3/*` (search_log.yaml, litreview_manifest.yaml, dialogue_table.md, 17
      citation cards under `citations/`, all VERIFIED) and
      `projects/GLS-2026-001_rigour-without-infrastructure/*` (hypotheses.md, lens_translation.md,
      hypothesis_selection.yaml, GLOSA-PC-20260904-0001.yaml). These records are what was actually
      seen producing this card, not a claim about the world beyond glosa's own dogfood run.
    citation_refs:
      - cite-mindstudio-crossvendor-010
      - cite-selfpreference-judge-001
      - cite-toohconsistent-003
  separates:
    value_z0: "whether cross-vendor (I3) checking catches a measurably higher rate of seeded undisclosed AI-fill/assumption instances than same-vendor (I0/I1) re-checking"
    licensing_test:
      regime: "no seeded-error benchmark has been run by this project yet; this is a pre-study literature scan only (n=0 own experimental trials)"
      result: >-
        Of the 17 VERIFIED citation cards found for H3 (h3/citations/, independence_class I3
        throughout), three (cite-mindstudio-crossvendor-010, cite-selfpreference-judge-001,
        cite-toohconsistent-003) SUPPORT H3's underlying mechanism at the SUPPORTS_GENERAL_CLAIM_ONLY
        scope level (cross-vendor blind-spot avoidance, LLM self-preference/familiarity bias,
        cross-model verification catching self-consistent errors) -- none is H3's own direct test.
        The one source that IS H3's own direct test (cite-crossmodel-codereview-002, an arXiv
        controlled comparison of cross-vendor vs. same-vendor code review pass rates, 116 tasks, 6
        conditions) came back with i3.json bearing CONTEXT_ONLY, not SUPPORTS -- it found an
        asymmetric, direction-dependent effect (one cross-vendor direction helped substantially,
        the reverse direction hurt, and same-vendor self-review also improved one condition),
        which the decorrelated route judged as analogous context (code-review pass rate, not
        Q3/Q4 claim-card field detection) rather than a clean confirmation or refutation of H3
        (litreview_manifest.yaml developability note; hypothesis_selection.yaml
        candidates[2].criteria.developability). This is disclosed here as the single most
        important open complication to H3, not omitted for a cleaner-looking evidence set.
      notes: "n=0 own experimental trials; no seeded-error benchmark has been built or run by this project; all evidence is by-analogy from adjacent literature (LLM judging, code review), not H3's own instrument."
    zero_vs_bottom: distinct_difference_found
  ai_filled:
    current_evidence: >-
      AI (the AI assistant, this session) retrieved and drafted the summaries of the 17 H3 citation cards
      under records/lit/rigour-without-infrastructure/h3/citations/ during the S3b LRS run; the
      founder did not independently re-fetch each source before this claim card was drafted.
    retrieved_tool_evidence: >-
      WebFetch/WebSearch tool calls performed the literature retrieval recorded in
      records/lit/rigour-without-infrastructure/h3/search_log.yaml; a second AI route (codex, I3)
      cross-checked metadata/claim-match for each card, recorded in each citation card's own
      .i3.json file.
    retained_record_route: >-
      This claim card's field structure and initial evidence-relation selection were drafted by AI
      from the existing frozen project records (litreview_manifest.yaml, dialogue_table.md,
      citation cards) -- no seeded-error benchmark, new observation, or new search was performed to
      produce this card itself.
    model_calibration_assumption: >-
      No claim in this card depends on an AI model's stated confidence or calibration score; all
      independence_class/status/bearing values are taken directly from the frozen citation cards
      and their .i3.json verdicts, not re-estimated here.
    prompt_system_constraint: >-
      This card was drafted under task instructions (BBL-2026-09-04-091..101) requiring citation
      only from cards already at status VERIFIED with an existing citation card -- no citation was
      drawn from AI training-data memory.
    decision_policy: >-
      Selection of which 3 of the 17 VERIFIED H3 citation cards to cite as tested.evidence_relations
      was an AI drafting choice (favoring the three entries with i3.json bearing SUPPORTS); the
      most directly on-point source (cite-crossmodel-codereview-002) was excluded from the formal
      evidence_relations list because its i3.json bearing is CONTEXT_ONLY, not SUPPORTS/CHALLENGES,
      but is discussed explicitly in `separates.licensing_test.result` above and in `non_claims`
      below so its complication is not silently dropped -- an AI drafting choice, presented to the
      founder for review, not a founder-directed selection.
  assumed:
    - id: A1
      type: inferential_commitment
      description: >-
        Findings from adjacent domains (LLM-judge self-preference bias, cross-model code review,
        cross-model consistency checking) are informative about H3's own claim-card Q3/Q4-detection
        mechanism, even though none of the cited sources tests claim-card field-level AI-fill or
        assumption detection directly -- an analogy, not a direct test, and named as such in every
        cited source's own notes.
      identification_level: A1
      contaminated_concept_hit: null
    - id: A2
      type: inferential_commitment
      description: >-
        The direction-dependent, asymmetric effect found in the single closest analogous study
        (cite-crossmodel-codereview-002 -- one cross-vendor direction helps, the reverse hurts,
        same-vendor self-review also helps in one condition) does not by itself defeat H3, but is
        treated as a real open complication to the simple "cross-vendor > same-vendor" framing H3
        states, rather than being explained away.
      identification_level: A1
      contaminated_concept_hit: null
  tested:
    evidence_relations:
      - evidence_id: cite-mindstudio-crossvendor-010
        bearing: SUPPORTS
        independence_class: I3
        strength: "weak -- CONTEXT_ONLY / SUPPORTS_GENERAL_MECHANISM scope (routes R1/R2/R3 consensus), evidence_tier Open (practitioner/blog context, not controlled evidence, NOT a Q3/Q4 detection-rate test)"
        citation_ref: cite-mindstudio-crossvendor-010
        review_mode: DECORRELATED_AI_ROUTE
        route_id: codex
        asserted_by: ai
        date: "2026-09-04"
        notes: >-
          Supports the general cross-vendor blind-spot-avoidance mechanism H3 depends on, but only
          as practitioner/blog context, not controlled evidence for H3's own claim-card Q3/Q4
          detection-rate comparison (h3/citations/cite-mindstudio-crossvendor-010.yaml).
          Cross-vendor review (routes R1/R2/R3) found the bare "SUPPORTS" label overstated for an
          empirical measurable-rate claim; relabelled scope CONTEXT_ONLY/SUPPORTS_GENERAL_MECHANISM
          in `strength` -- do not read as evidence a detection-rate comparison was run.
      - evidence_id: cite-selfpreference-judge-001
        bearing: SUPPORTS
        independence_class: I3
        strength: "weak -- CONTEXT_ONLY / SUPPORTS_GENERAL_MECHANISM scope (routes R1/R2/R3 consensus), evidence_tier fit_calibrated, mechanism-by-analogy only"
        citation_ref: cite-selfpreference-judge-001
        review_mode: DECORRELATED_AI_ROUTE
        route_id: codex
        asserted_by: ai
        date: "2026-09-04"
        notes: >-
          Finds LLM judges assign significantly higher evaluations to outputs with lower
          perplexity regardless of self-generation, i.e. familiarity/self-preference bias -- a
          mechanism relevant to why same-vendor re-checking may under-detect what its own vendor
          produced, but the paper does not itself run a cross-vendor-vs-same-vendor comparison
          (h3/citations/cite-selfpreference-judge-001.yaml). Route R3: supports
          familiarity/self-preference bias, not cross-vendor checking performance directly;
          downgraded from moderate to weak, scope narrowed to CONTEXT_ONLY/
          SUPPORTS_GENERAL_MECHANISM, not a test of H3's own claim-card detection rates.
      - evidence_id: cite-toohconsistent-003
        bearing: SUPPORTS
        independence_class: I3
        strength: "weak -- CONTEXT_ONLY / SUPPORTS_GENERAL_MECHANISM scope (routes R1/R2/R3 consensus); DIRECT_QUOTATION is of the source's own task (hidden-state external-verifier error detection), not claim-card field review"
        citation_ref: cite-toohconsistent-003
        review_mode: DECORRELATED_AI_ROUTE
        route_id: codex
        asserted_by: ai
        date: "2026-09-04"
        notes: >-
          Supports cross-model/external-verifier checking improving detection of LLM
          self-consistent errors -- relevant to H3's cross-vendor independence mechanism, though
          not a claim-card Q3/Q4 field-detection study specifically
          (h3/citations/cite-toohconsistent-003.yaml). Routes R2/R3: the DIRECT_QUOTATION scope
          label can overstate bearing on H3 unless explicitly limited to the quoted source's own
          task; downgraded from moderate to weak and scope narrowed to CONTEXT_ONLY/
          SUPPORTS_GENERAL_MECHANISM.
    falsifier: >-
      A controlled comparison (same set of claim cards, deliberately seeded with a known number of
      undisclosed AI-fill/assumption instances, checked by same-vendor vs. cross-vendor routes)
      shows no significant difference in detection rate, or shows cross-vendor checking performs
      worse -- that would falsify the independence-ladder mechanism this project's methodology
      cards (`methodology/`) currently assume works. Not yet run: this project has not built or run
      the seeded-error benchmark (hypotheses.md#H3; hypothesis_selection.yaml
      candidates[2].criteria.falsifier_reachable_with_our_resources: "yes" -- reachable, not yet
      done).
    dissent_records:
      - by: "route R1 (cross-vendor AI, I3)"
        date: "2026-09-04"
        content: >-
          The card does not establish the stated measurable increase. Its own readout says n=0 own
          trials and Phi_z0 is not computed; all three cited relations support only adjacent
          mechanisms, not Q3/Q4 claim-card detection rates. A seeded benchmark showing equal,
          lower, or direction-dependent cross-vendor detection would defeat the claim, and the
          closest analogous study already shows direction-dependence. Citation-card disclosures
          contain a standing tension: top-level status VERIFIED while some disclosure text says
          status stays METADATA_OK or claim_match false.
        resolved: true
        resolution: >-
          Accepted. `statement.text` and `hypothesis_world.text` rewritten from an assertion
          ("rises measurably") to an untested hypothesis ("would rise measurably... no measurement
          has been made, n=0"). All three evidence_relations downgraded to CONTEXT_ONLY/
          SUPPORTS_GENERAL_MECHANISM. The citation-card-level VERIFIED/METADATA_OK tension is a
          citation-card artifact (h3/citations/*.i3.json), out of this claim card's own fields;
          left open, not silently repaired here.
      - by: "route R2 (cross-vendor AI, I3)"
        date: "2026-09-04"
        content: >-
          The card overstates an empirical result: its own record says n=0 own trials and no
          seeded-error benchmark, while the statement said cross-vendor checking catches more
          undisclosed AI-fill/assumptions measurably. The closest analogous study is CONTEXT_ONLY
          and asymmetric, directly weakening the simple cross-vendor > same-vendor framing. No
          cited source directly tests claim-card Q3/Q4 detection rates.
        resolved: true
        resolution: >-
          Accepted. Statement and hypothesis_world now state the claim as an untested proposition
          ("would rise", not "rises"); `non_claims` adds an explicit line that no measurement has
          been made; evidence_relations reworded so none reads as a direct H3 test.
      - by: "route R3 (cross-vendor AI, I3)"
        date: "2026-09-04"
        content: >-
          Citation passages support adjacent mechanisms only, not the empirical claim that
          cross-vendor claim-card checks measurably catch more false Q3/Q4 fields than same-vendor
          re-checks. Bearing label SUPPORTS is inflated unless read strictly with scope
          qualifiers; relation labels should be CONTEXT_ONLY or SUPPORTS_GENERAL_MECHANISM, not
          plain SUPPORTS for H3.
        resolved: true
        resolution: >-
          Accepted exactly as recommended: all three evidence_relations' `strength` fields now
          read "CONTEXT_ONLY / SUPPORTS_GENERAL_MECHANISM scope"; `notes` rewritten to state
          explicitly that none is a direct H3 test. `bearing` values kept as SUPPORTS per schema
          (`schema/common.defs.json#/definitions/bearing` has no CONTEXT/partial enum value) with
          the scope narrowing carried in `strength`/`notes` instead.
identification_ladder:
  layers:
    - id: A0
      adds: "the independence ladder (I0..I5), the citation cards, and the .i3.json cross-vendor verdict files exist as named artifacts in this repo"
    - id: A1
      adds: "the 17 H3 citation cards exist, are status VERIFIED, and were checked by a decorrelated AI route (codex, I3); the single most directly on-point source (cite-crossmodel-codereview-002) found a real, disclosed, direction-dependent complication rather than a clean confirmation"
  per_rival:
    - rival: "the cross-vendor effect is direction-dependent / asymmetric rather than a uniform 'cross-vendor always beats same-vendor' effect (H3's own stated falsifier direction, and the closest analogous study cite-crossmodel-codereview-002)"
      first_identification_level: A1
    - rival: "none of the cited evidence tests claim-card Q3/Q4 field-detection directly -- the mechanism could hold in code review/judging but not transfer to claim-card review"
      first_identification_level: A1
