        A concrete I3/I5 review record showing independent readers cannot recover the recorded
        evidence/interpretation/AI-fill/assumption boundaries from otherwise compliant claim
        cards; or a comparison showing institutional credential, not card fields, remains
        necessary to certify the rigour claimed.
      disposition: not_reached
      resolution: "Not defeated -- not tested either; no such record or comparison exists yet in this project. Recorded as open in `ledger.open`, not closed."
    - route: R2
      independence_class: I3
      date: "2026-09-04"
      defeater: >-
        The card's own `separates.licensing_test` says no source directly tests the FULL combined
        mechanism; I3 is the ceiling reached, I5 explicitly not secured; the cited challenge card
        says credentialed/institutional legitimacy still shapes acceptance in practice.
      disposition: accepted_as_scope_limit
      resolution: "Statement and hypothesis_world reworded to a design proposition with an explicit n=1/single-readout caveat; not treated as a full defeat of H1, only as a scope bound."
    - route: R3
      independence_class: I3
      date: "2026-09-04"
      defeater: >-
        No cited card directly tests claim card + E-A-D + independence ladder as one system;
        packet was truncated inside the second evidence_relation, so exact claim-card wording was
        not fully visible to this route.
      disposition: accepted_as_scope_limit
      resolution: "evidence_relations strength/notes narrowed to component/general-context scope; packet truncation is a review-artifact, not a claim-card defect."
  status: run
