  version_or_date_read: "2026-09-04"
  what_it_did_here:
    lens_in: >-
      Read the founder's L1 question and the paper abstract as a readout problem: which
      distinctions (evidence seen / data separated / AI-filled / assumed / independently
      tested) does a standalone scholar's claim currently fail to carry, versus what an
      institutionally-backed claim implicitly borrows from lab/department/committee
      machinery to carry the same distinctions.
    lens_out: >-
      Translated back into world/discipline language as three candidate hypotheses
      (hypotheses.md) about whether a claim-card discipline (the founder's five questions +
      E-A-D + independence ladder) can substitute for institutional infrastructure as what
      lets a claim be checked.
  if_other_lens: "no other lens was used for this project's lens_translation/hypotheses this pass"
  note: "attribution ≠ authority — naming the lens credits its source and lets a reader replace it; it does not make the lens true"
