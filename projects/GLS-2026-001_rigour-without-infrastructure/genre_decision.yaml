  here as an adopted-by-human override of the router's mechanical output, per FOUNDATION_v0.5.md
  §6 (the router proposes, the founder decides) and glosa gate rule 6 (AGENTS.md) -- the router is
  never itself the legitimacy source for a genre choice.

disposition_of_hypotheses:
