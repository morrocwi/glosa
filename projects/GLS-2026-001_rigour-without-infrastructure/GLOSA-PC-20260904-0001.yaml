intake:
  q1_issue:
    text_verbatim: "...คนที่ไม่มีมหาวิทยาลัย ไม่มีแล็บ และไม่มีทีมวิจัย จะผลิตความรู้จากพื้นที่ของตนเองอย่างเข้มงวดได้อย่างไร..."
    retained_difference_statement: >-
      Under the agency of a standalone practitioner/citizen (no university affiliation, no
      certified lab, no research team) working in their own local context, and the query "can this
      person's own knowledge become rigorous, checkable knowledge, or not" -- the difference that
      survives: people who live daily with a problem (marginalized people, frontline workers,
      communities) typically know the problem before researchers do, but converting that knowing
      into "knowledge" hits walls of language, method, funding, institution, and expertise. AI
      lowers those walls quickly, but a second difference then survives: now anyone can produce
      output that looks smart and academic, while it remains unknown which part is evidence, which
      part is interpretation, and which part AI smoothed over past what the actual data supports.
      This is a difference that survives under this agency/context/query, not merely a topic label
      ("AI and research" or "citizen science").
    agency: standalone practitioner / citizen without institutional research infrastructure (no
      university, no lab, no research team), assisted by AI
    context: producing knowledge from one's own local/practice area, with AI assistance available
      but no institutional status of one's own
    query: can a claim this person produces be made rigorous and checkable by a reader, without an
      institutional credential as the thing that certifies it?
    blackbox_line_ref: blackbox/BLACKBOX_NOTE_glosa-paper_2026-09-04.md#L1
